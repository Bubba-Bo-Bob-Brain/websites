<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO-ARCHIVE: SECTOR 7 // SUBJECT DATABASE</title>
    
    <!-- Fonts: Press Start 2P for headers (Retro), VT323 for data (Terminal), and a chunky font for stats -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Rubik+Glitch&display=swap" rel="stylesheet">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CRT Scanline Overlay -->
    <div class="crt-overlay"></div>
    <div class="noise-overlay"></div>

    <!-- Main Interface Container -->
    <div class="interface-container">
        
        <!-- Header Section -->
        <header class="main-header">
            <div class="logo-area">
                <h1 class="glitch-text" data-text="BIO-ARCHIVE">BIO-ARCHIVE</h1>
                <div class="subtitle">SECTOR 7 // SUBJECT DATABASE</div>
            </div>
            <div class="system-status">
                <span class="blink">SYSTEM: ONLINE</span>
                <span class="separator">|</span>
                <span id="clock">00:00:00</span>
            </div>
        </header>

        <!-- Navigation / Filters -->
        <nav class="faction-nav">
            <button class="nav-btn active" data-filter="all">ALL SUBJECTS</button>
            <button class="nav-btn" data-filter="synth">SYNTHETICS</button>
            <button class="nav-btn" data-filter="mutant">MUTANTS</button>
            <button class="nav-btn" data-filter="human">HUMANS</button>
        </nav>

        <!-- Grid Container for Characters -->
        <main class="character-grid" id="character-grid">
            <!-- Characters will be injected here via JavaScript -->
        </main>

        <!-- Footer / Decor -->
        <footer class="main-footer">
            <div class="dna-decoration">
                <div class="dna-strand"></div>
            </div>
            <div class="warning-text">
                WARNING: UNAUTHORIZED ACCESS IS A CLASS-4 FELONY. BIOHAZARD PROTOCOLS ACTIVE.
            </div>
        </footer>
    </div>

    <!-- Modal for Character Details -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-body">
                <div class="modal-header">
                    <h2 id="modal-name">NAME</h2>
                    <span id="modal-faction" class="faction-badge">FACTION</span>
                </div>
                <div class="modal-grid">
                    <div class="modal-image-container">
                        <div id="modal-image" class="modal-placeholder"></div>
                        <div class="scan-line"></div>
                    </div>
                    <div class="modal-stats">
                        <div class="stat-row">
                            <span class="label">MUTATION LEVEL</span>
                            <div class="bar-container">
                                <div id="modal-mutation" class="bar-fill"></div>
                            </div>
                        </div>
                        <div class="stat-row">
                            <span class="label">TOXICITY</span>
                            <div class="bar-container">
                                <div id="modal-toxicity" class="bar-fill"></div>
                            </div>
                        </div>
                        <div class="stat-row">
                            <span class="label">SURVIVAL SKILL</span>
                            <div class="bar-container">
                                <div id="modal-skill" class="bar-fill"></div>
                            </div>
                        </div>
                        <div class="bio-data">
                            <h3>GENETIC SEQUENCE</h3>
                            <p id="modal-desc">Description goes here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="scripts.js"></script>
</body>
</html>
