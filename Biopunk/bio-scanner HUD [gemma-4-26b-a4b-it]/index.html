<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO-OS // NEURAL-LINK INTERFACE</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Grain/Noise Overlay for texture -->
    <div class="grain-overlay"></div>
    <div class="vignette"></div>
    <div class="scanline"></div>

    <main id="bio-os-interface">
        
        <!-- Top Header: System Status & Patient ID -->
        <header class="system-header">
            <div class="patient-id">
                <span class="label">SUBJECT_ID:</span>
                <span class="value">X-774_MUTANT_STAG-4</span>
            </div>
            <div class="system-clock">
                <span class="label">BIO_TIME:</span>
                <span class="value" id="clock">00:00:00:00</span>
            </div>
            <div class="system-alert" id="alert-box">
                <span class="alert-text">SYSTEM_STABLE</span>
            </div>
        </header>

        <!-- Central Anatomical Viewport -->
        <section class="anatomical-viewport">
            <div class="body-wireframe" id="body-container">
                <!-- The anatomical silhouette will be visually rendered via CSS/SVG/JS -->
                <div class="organ-hotspot" data-organ="heart" style="top: 30%; left: 50%;"></div>
                <div class="organ-hotspot" data-organ="lungs" style="top: 35%; left: 40%;"></div>
                <div class="organ-hotspot" data-organ="lungs" style="top: 35%; left: 60%;"></div>
                <div class="organ-hotspot" data-organ="liver" style="top: 50%; left: 45%;"></div>
                <div class="organ-hotspot" data-organ="brain" style="top: 10%; left: 50%;"></div>
            </div>
            
            <!-- Nanomachine Swarm Visualizer (Canvas-based in JS) -->
            <canvas id="nanomachine-canvas"></canvas>
        </section>

        <!-- Left Sidebar: Organ Status & Toxin Levels -->
        <aside class="sidebar-left">
            <div class="module organ-status">
                <h2 class="module-title">ORGAN_VITALITY</h2>
                <div class="organ-list">
                    <div class="organ-item" data-level="92">
                        <span class="org-name">HEART</span>
                        <div class="org-bar-container"><div class="org-bar" style="width: 92%;"></div></div>
                    </div>
                    <div class="organ-item" data-level="45">
                        <span class="org-name">LUNGS</span>
                        <div class="org-bar-container"><div class="org-bar" style="width: 45%;"></div></div>
                    </div>
                    <div class="organ-item" data-level="12">
                        <span class="org-name">LIVER</span>
                        <div class="org-bar-container"><div class="org-bar" style="width: 12%;"></div></div>
                    </div>
                    <div class="organ-item" data-level="78">
                        <span class="org-name">KIDNEYS</span>
                        <div class="org-bar-container"><div class="org-bar" style="width: 78%;"></div></div>
                    </div>
                </div>
            </div>

            <div class="module toxin-levels">
                <h2 class="module-title">TOXIN_LOAD</h2>
                <div class="toxin-visualizer">
                    <div class="toxin-meter" id="toxin-meter">
                        <span class="toxin-value">0.02%</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right Sidebar: Mutation & Gene Matrix -->
        <aside class="sidebar-right">
            <div class="module mutation-progression">
                <h2 class="module-title">MUTATION_DRIFT</h2>
                <div class="mutation-graph" id="mutation-graph">
                    <!-- Visualized via JS -->
                </div>
                <div class="mutation-stats">
                    <div class="stat-row"><span class="stat-label">GENE_STABILITY:</span><span class="stat-val">64%</span></div>
                    <div class="stat-row"><span class="stat-label">CELL_REPLICATION:</span><span class="stat-val">ERR_OVERFLOW</span></div>
                </div>
            </div>

            <div class="module neural-link">
                <h2 class="module-title">NEURAL_INTEGRITY</h2>
                <div class="neural-ring-container">
                    <svg class="neural-ring" viewBox="0 0 100 100">
                        <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="ring-progress" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="neural-percentage">88%</div>
                </div>
            </div>
        </aside>

        <!-- Bottom Footer: Heartbeat & Global Controls -->
        <footer class="system-footer">
            <div class="heartbeat-container">
                <canvas id="heartbeat-canvas"></canvas>
            </div>
            <div class="nano-deployment-status">
                <span class="label">NANO_DEPLOYMENT:</span>
                <span class="status-indicator active">ACTIVE_SWARM_V4</span>
            </div>
        </footer>

    </main>

    <script src="scripts.js"></script>
</body>
</html>
