<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA BRIDGE · CHROME HORIZON</title>
  <link rel="stylesheet" href="styles.css">
  <!-- 1980s sci-fi typography reference: Audiowide + Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Audiowide&display=swap" rel="stylesheet">
</head>
<body>
<div id="bridge">

  <!-- ====== TOP STATUS BAR ====== -->
  <header id="bridge-header">
    <div class="header-left">
      <span class="sys-name">NOVA-7</span>
      <span class="sys-divider">✦</span>
      <span class="sys-role">BRIDGE CONSOLE</span>
    </div>
    <div class="header-right">
      <span class="status-dot">●</span> ALL SYSTEMS NOMINAL
    </div>
  </header>

  <!-- ====== MAIN GRID: 4 PANELS ====== -->
  <div id="main-grid">

    <!-- NAVIGATION -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-icon">◈</span>
        <span class="panel-title">NAVIGATION</span>
      </div>
      <div class="panel-body">
        <div class="coord-grid">
          <div class="coord-row"><span class="label">X</span><span class="value" id="nav-x">+03.742</span></div>
          <div class="coord-row"><span class="label">Y</span><span class="value" id="nav-y">−01.209</span></div>
          <div class="coord-row"><span class="label">Z</span><span class="value" id="nav-z">+08.635</span></div>
        </div>
        <div class="warp-bar"><div class="warp-fill" style="width: 72%;"></div></div>
        <div class="warp-label">WARP CAPACITY 72%</div>
      </div>
    </div>

    <!-- SHIELDS -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-icon">◈</span>
        <span class="panel-title">SHIELDS</span>
      </div>
      <div class="panel-body">
        <div class="shield-container">
          <svg class="shield-svg" viewBox="0 0 120 100">
            <polygon points="60,5 115,25 95,85 25,85 5,25" fill="none" stroke="#2af" stroke-width="1.5" stroke-dasharray="280" stroke-dashoffset="40" />
            <polygon points="60,15 100,30 85,75 35,75 20,30" fill="none" stroke="#2af" stroke-width="0.8" opacity="0.3" />
          </svg>
          <div class="shield-value" id="shield-value">84%</div>
        </div>
        <div class="shield-label">FORCE FIELD INTEGRITY</div>
      </div>
    </div>

    <!-- WEAPONS -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-icon">⚡</span>
        <span class="panel-title">WEAPONS</span>
      </div>
      <div class="panel-body">
        <div class="weapon-row"><span class="weapon-name">ION CANNON</span><span class="weapon-status active">ARMED</span></div>
        <div class="weapon-row"><span class="weapon-name">PLASMA TORPEDO</span><span class="weapon-status standby">STANDBY</span></div>
        <div class="weapon-row"><span class="weapon-name">CIWS</span><span class="weapon-status active">ACTIVE</span></div>
        <div class="target-row">
          <span>TARGET LOCK</span>
          <span class="target-value" id="target-lock">ACQUIRING</span>
        </div>
      </div>
    </div>

    <!-- COMMS -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-icon">◈</span>
        <span class="panel-title">COMMS</span>
      </div>
      <div class="panel-body">
        <div class="comms-freq">182.475 MHz</div>
        <canvas id="wave-canvas" width="180" height="60"></canvas>
        <div class="comms-status">CHANNEL 7 · SECURE</div>
      </div>
    </div>

  </div>

  <!-- ====== FOOTER ====== -->
  <div id="bridge-footer">
    <span>STARDATE 2184.09</span>
    <span>POWER 94%</span>
  </div>

  <!-- decorative overlays -->
  <div class="scanline"></div>
  <div class="corner-deco tl"></div>
  <div class="corner-deco tr"></div>
  <div class="corner-deco bl"></div>
  <div class="corner-deco br"></div>
</div>
</body>
</html>
