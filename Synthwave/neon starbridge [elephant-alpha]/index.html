<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSHIP BRIDGE CONSOLE - NEON HORIZON</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Parallax Star Field Background -->
    <div class="starfield" id="starfield"></div>
    
    <!-- Chrome Grid Floor -->
    <div class="grid-floor">
        <div class="grid-line-horizontal"></div>
        <div class="grid-line-horizontal"></div>
        <div class="grid-line-horizontal"></div>
        <div class="grid-line-vertical"></div>
        <div class="grid-line-vertical"></div>
        <div class="grid-line-vertical"></div>
    </div>
    
    <!-- Main Bridge Console -->
    <div class="bridge-console">
        <!-- Header Section -->
        <header class="console-header">
            <div class="header-glow"></div>
            <h1 class="console-title">STELLAR NAVIGATION</h1>
            <div class="system-status">
                <span class="status-indicator active" data-status="navigation"></span>
                <span class="status-indicator" data-status="shields"></span>
                <span class="status-indicator" data-status="weapons"></span>
                <span class="status-indicator" data-status="comms"></span>
            </div>
        </header>
        
        <!-- Main Content Grid -->
        <div class="console-grid">
            <!-- Navigation Panel -->
            <div class="panel navigation-panel active">
                <div class="panel-header">
                    <span class="panel-title">NAVIGATION</span>
                    <div class="panel-indicator"></div>
                </div>
                <div class="panel-content">
                    <div class="coordinate-display">
                        <div class="coord-label">QUADRANT</div>
                        <div class="coord-value" id="quadrant">007</div>
                    </div>
                    <div class="coordinate-display">
                        <div class="coord-label">SECTOR</div>
                        <div class="coord-value" id="sector">429</div>
                    </div>
                    <div class="coordinate-display">
                        <div class="coord-label">GRID</div>
                        <div class="coord-value" id="grid">892</div>
                    </div>
                    <div class="velocity-display">
                        <div class="vel-label">WARP FACTOR</div>
                        <div class="vel-value" id="warp-factor">9.8</div>
                        <div class="vel-bar">
                            <div class="vel-fill" id="warp-fill"></div>
                        </div>
                    </div>
                    <div class="target-reticle-container">
                        <div class="reticle-ring"></div>
                        <div class="reticle-crosshair"></div>
                        <div class="reticle-pulse"></div>
                    </div>
                </div>
            </div>
            
            <!-- Shields Panel -->
            <div class="panel shields-panel">
                <div class="panel-header">
                    <span class="panel-title">SHIELDS</span>
                    <div class="panel-indicator"></div>
                </div>
                <div class="panel-content">
                    <div class="shield-ring-container">
                        <div class="shield-ring" id="shield-ring"></div>
                        <div class="shield-core"></div>
                    </div>
                    <div class="shield-status">
                        <div class="shield-label">INTEGRITY</div>
                        <div class="shield-value" id="shield-value">100%</div>
                    </div>
                    <div class="shield-frequency">
                        <div class="freq-label">RESONANCE</div>
                        <div class="freq-bar">
                            <div class="freq-fill" id="shield-freq"></div>
                        </div>
                    </div>
                    <div class="shield-indicators">
                        <div class="shield-indicator active" data-shield="forward"></div>
                        <div class="shield-indicator" data-shield="port"></div>
                        <div class="shield-indicator" data-shield="starboard"></div>
                        <div class="shield-indicator" data-shield="aft"></div>
                    </div>
                </div>
            </div>
            
 <!-- Weapons Panel --> -->
            <div class="panel weapons-panel">
                <div class="panel-header">
                    <span class="panel-title">WEAPONS</span>
                    <div class="panel-indicator"></div>
                </div>
                <div class="panel-content">
                    <div class="weapon-status">
                        <div class="weapon-label">PHASER</div>
                        <div class="weapon-power" id="phaser-power">100%</div>
                        <div class="weapon-meter">
                            <div class="meter-fill" id="phaser-meter"></div>
                        </div>
                    </div>
                    <div class="weapon-status">
                        <div class="weapon-label">TORPEDO</div>
                        <div class="weapon-power" id="torpedo-power">85%</div>
                        <div class="weapon-meter">
                            <div class="meter-fill" id="torpedo-meter"></div>
                        </div>
                    </div>
                    <div class="weapon-status">
                        <div class="weapon-label">DISRUPTOR</div>
                        <div class="weapon-power" id="disruptor-power">92%</div>
                        <div class="weapon-meter">
                            <div class="meter-fill" id="disruptor-meter"></div>
                        </div>
                    </div>
                    <div class="lock-target">
                        <div class="lock-status" id="lock-status">STANDBY</div>
                        <button class="lock-button" id="lock-target-btn">TARGET LOCK</button>
                    </div>
                </div>
            </div>
            
            <!-- Communications Panel -->
            <div class="panel comms-panel">
                <div class="panel-header">
                    <span class="panel-title">COMMUNICATIONS</span>
                    <div class="panel-indicator"></div>
                </div>
                <div class="panel-content">
                    <div class="frequency-display">
                        <div class="freq-title">SUBSPACE COMM</div>
                        <div class="freq-display" id="subspace-freq">314.75 MHz</div>
                    </div>
                    <div class="synth-waveform">
                        <div class="waveform-container">
                            <canvas id="audio-waveform" width="280" height="80"></canvas>
                        </div>
                    </div>
                    <div class="signal-strength">
                        <div class="signal-label">SIGNAL</div>
                        <div class="signal-bar">
                            <div class="signal-fill" id="signal-strength"></div>
                        </div>
                    </div>
                    <div class="comm-indicators">
                        <div class="comm-indicator active" data-comm="long-range"></div>
                        <div class="comm-indicator" data-comm="short-range"></div>
                        <div class="comm-indicator" data-comm="encrypted"></div>
                        <div class="comm-indicator" data-comm="hailing"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Console Footer -->
        <footer class="console-footer">
            <div class="footer-glow"></div>
            <div class="system-info">
                <span class="info-text">WARP CORE: ONLINE</span>
                <span class="info-text">SHIELD MATRIX: ACTIVE</span>
                <span class="info-text">NAVIGATION: ENGAGED</span>
            </div>
            <div class="footer-lights">
                <div class="light active"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
            </div>
        </footer>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
