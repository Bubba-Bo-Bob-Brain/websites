<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starship Bridge Console | Synthwave Control</title>
  <meta name="description" content="Immerse yourself in a 1980s sci-fi starship bridge with holographic readouts, neon grids, and tactile controls.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="sounds/button.mp3" as="audio">
  <link rel="preload" href="sounds/shield.mp3" as="audio">
</head>
<body>
  <!-- Background: Starfield + Horizon -->
  <div class="stars" id="stars"></div>
  <div class="horizon">
    <div class="sun"></div>
  </div>

  <!-- Chrome Grid Floor -->
  <div class="grid-floor"></div>

  <!-- Main Console -->
  <div class="console">
    <!-- Header -->
    <header class="console-header">
      <h1 class="console-title">U.S.S. NEON HORIZON</h1>
      <div class="ship-status">
        <span class="status-item" id="speed">SPEED: WARP 3.2</span>
        <span class="status-item" id="heading">HDG: 247°</span>
        <span class="status-item" id="altitude">ALT: 450 KM</span>
      </div>
    </header>

    <!-- Navigation Panel -->
    <section class="panel nav-panel">
      <h2 class="panel-title">NAVIGATION</h2>
      <div class="panel-content">
        <div class="radar-display">
          <canvas id="radarCanvas"></canvas>
          <div class="radar-sweep"></div>
        </div>
        <div class="nav-controls">
          <div class="control-group">
            <label for="throttle">THROTTLE</label>
            <input type="range" id="throttle" min="0" max="100" value="32" class="slider">
          </div>
          <div class="control-group">
            <label for="heading">HEADING</label>
            <input type="range" id="heading-slider" min="0" max="360" value="247" class="slider">
          </div>
          <button class="button" id="engage-warp">ENGAGE WARP</button>
        </div>
      </div>
    </section>

    <!-- Shields Panel -->
    <section class="panel shields-panel">
      <h2 class="panel-title">SHIELDS</h2>
      <div class="panel-content">
        <div class="shield-ring">
          <div class="shield-meter" id="shieldMeter"></div>
          <div class="shield-glow"></div>
        </div>
        <div class="shield-controls">
          <div class="control-group">
            <label for="shield-power">POWER</label>
            <input type="range" id="shield-power" min="0" max="100" value="80" class="slider">
          </div>
          <button class="button" id="shield-equalize">EQUALIZE</button>
        </div>
      </div>
    </section>

    <!-- Weapons Panel -->
    <section class="panel weapons-panel">
      <h2 class="panel-title">WEAPONS</h2>
      <div class="panel-content">
        <div class="target-display">
          <div class="target-reticle" id="targetReticle"></div>
          <div class="target-info">
            <span id="targetDistance">DIST: 12,000 KM</span>
            <span id="targetLock">LOCK: OFF</span>
          </div>
        </div>
        <div class="weapons-controls">
          <div class="control-group">
            <label for="weapon-power">POWER</label>
            <input type="range" id="weapon-power" min="0" max="100" value="50" class="slider">
          </div>
          <button class="button" id="fire-weapon">FIRE PHASERS</button>
        </div>
      </div>
    </section>

    <!-- Communications Panel -->
    <section class="panel comms-panel">
      <h2 class="panel-title">COMMUNICATIONS</h2>
      <div class="panel-content">
        <div class="comms-display">
          <canvas id="commsCanvas"></canvas>
          <div class="comms-text" id="commsText">INCOMING TRANSMISSION: STARBASE 7</div>
        </div>
        <div class="comms-controls">
          <div class="control-group">
            <label for="comms-frequency">FREQUENCY</label>
            <input type="range" id="comms-frequency" min="0" max="100" value="42" class="slider">
          </div>
          <button class="button" id="hail">HAIL</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Audio Elements -->
  <audio id="buttonSound" src="sounds/button.mp3" preload="auto"></audio>
  <audio id="shieldSound" src="sounds/shield.mp3" preload="auto"></audio>
  <audio id="warpSound" src="sounds/warp.mp3" preload="auto"></audio>

  <script src="scripts.js"></script>
</body>
</html>
