<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthwave Starship Bridge Console</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Elements -->
    <div class="starship-bg">
        <div class="starfield"></div>
        <div class="neon-horizon"></div>
        <div class="chrome-grid-floor"></div>
    </div>

    <!-- Main Console Container -->
    <div class="bridge-console">
        <!-- Navigation Panel -->
        <div class="panel navigation-panel">
            <div class="panel-header">
                <span class="panel-title">NAVIGATION</span>
                <div class="panel-indicator"></div>
            </div>
            <div class="holographic-display">
                <div class="star-map"></div>
                <div class="coordinate-readout">
                    <span class="coord-label">GALACTIC COORDINATES</span>
                    <span class="coord-value" id="nav-coords">X: 42.789 | Y: 15.342 | Z: 99.124</span>
                </div>
            </div>
            <div class="control-buttons">
                <button class="synthwave-btn" id="engage-warp">ENGAGE WARP</button>
                <button class="synthwave-btn" id="plot-course">PLOT COURSE</button>
            </div>
        </div>

        <!-- Shields Panel -->
        <div class="panel shields-panel">
            <div class="panel-header">
                <span class="panel-title">SHIELDS</span>
                <div class="panel-indicator shield-status"></div>
            </div>
            <div class="shield-integrity-ring">
                <svg viewBox="0 0 100 100" class="integrity-meter">
                    <circle cx="50" cy="50" r="45" class="integrity-track" />
                    <circle cx="50" cy="50" r="45" class="integrity-fill" style="stroke-dasharray: 283; stroke-dashoffset: 0;" />
                </svg>
                <span class="integrity-value" id="shield-integrity">92%</span>
            </div>
            <div class="shield-controls">
                <button class="synthwave-btn" id="raise-shields">RAISE SHIELDS</button>
                <button class="synthwave-btn" id="lower-shields">LOWER SHIELDS</button>
            </div>
        </div>

        <!-- Weapons Panel -->
        <div class="panel weapons-panel">
            <div class="panel-header">
                <span class="panel-title">WEAPONS</span>
                <div class="panel-indicator weapon-status"></div>
            </div>
            <div class="targeting-reticle">
                <div class="reticle-ring"></div>
                <div class="reticle-crosshair"></div>
                <div class="reticle-lock" id="target-lock">LOCKING...</div>
            </div>
            <div class="weapon-controls">
                <button class="synthwave-btn" id="fire-phasers">FIRE PHASERS</button>
                <button class="synthwave-btn" id="fire-torpedoes">FIRE TORPEDOES</button>
            </div>
        </div>

        <!-- Communications Panel -->
        <div class="panel comms-panel">
            <div class="panel-header">
                <span class="panel-title">COMMS</span>
                <div class="panel-indicator comms-status"></div>
            </div>
            <div class="frequency-display">
                <div class="synthwave-waveform">
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                </div>
                <div class="frequency-readout">
                    <span class="freq-label">FREQUENCY</span>
                    <span class="freq-value" id="comms-freq">5.73 MHz</span>
                </div>
            </div>
            <div class="comms-controls">
                <button class="synthwave-btn" id="open-channel">OPEN CHANNEL</button>
                <button class="synthwave-btn" id="close-channel">CLOSE CHANNEL</button>
            </div>
        </div>

        <!-- Viewport (Starfield Parallax) -->
        <div class="viewport">
            <div class="parallax-layer layer-1"></div>
            <div class="parallax-layer layer-2"></div>
            <div class="parallax-layer layer-3"></div>
        </div>
    </div>

    <!-- Audio Context for Synthwave Effects (Optional) -->
    <audio id="synthwave-sound" src="" preload="auto"></audio>

    <script src="scripts.js"></script>
</body>
</html>
