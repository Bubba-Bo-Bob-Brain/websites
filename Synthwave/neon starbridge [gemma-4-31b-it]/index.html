<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER-84 // Starship Command Console</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing distinctive fonts: Orbitron for headers, JetBrains Mono for data -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background immersive environment -->
    <div class="universe">
        <div class="starfield"></div>
        <div class="synth-sun"></div>
        <div class="grid-container">
            <div class="grid-floor"></div>
        </div>
        <div class="crt-overlay"></div>
        <div class="scanline"></div>
    </div>

    <!-- Main Console Interface -->
    <main class="bridge-interface">
        
        <!-- Top Status Bar -->
        <header class="top-bar">
            <div class="ship-id">SS AETHER-84 <span class="blink">●</span></div>
            <div class="system-clock" id="clock">00:00:00 UTC</div>
            <div class="sector-info">SECTOR: 7-G // NEBULA: XENON-9</div>
        </header>

        <!-- Center Viewport -->
        <section class="viewport-container">
            <div class="viewport-frame">
                <div class="reticle">
                    <div class="reticle-circle"></div>
                    <div class="reticle-line v"></div>
                    <div class="reticle-line h"></div>
                    <div class="target-lock" id="target-lock">
                        <span class="lock-text">LOCKING...</span>
                    </div>
                </div>
                <div class="viewport-overlay">
                    <div class="coord-readout">X: <span id="coord-x">0</span> Y: <span id="coord-y">0</span> Z: <span id="coord-z">0</span></div>
                </div>
            </div>
        </section>

        <!-- Bottom Control Panels -->
        <footer class="control-deck">
            
            <!-- Navigation Panel -->
            <div class="panel nav-panel">
                <h2 class="panel-title">NAV-MATRIX</h2>
                <div class="nav-grid">
                    <div class="nav-cell active"></div>
                    <div class="nav-cell"></div>
                    <div class="nav-cell"></div>
                    <div class="nav-cell"></div>
                    <div class="nav-cell"></div>
                    <div class="nav-cell active"></div>
                    <div class="nav-cell"></div>
                    <div class="nav-cell"></div>
                    <div class="nav-cell"></div>
                </div>
                <div class="nav-data">
                    <p>> CALCULATING TRAJECTORY...</p>
                    <p>> VECTOR: 184.22.09</p>
                    <p>> VELOCITY: 0.8c</p>
                </div>
            </div>

            <!-- Shield/Energy Panel -->
            <div class="panel energy-panel">
                <h2 class="panel-title">SHIELD CORE</h2>
                <div class="shield-visualizer">
                    <svg viewBox="0 0 100 100">
                        <circle class="shield-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="shield-progress" cx="50" cy="50" r="45" id="shield-ring"></circle>
                    </svg>
                    <div class="shield-value"><span id="shield-pct">100</span>%</div>
                </div>
                <div class="energy-controls">
                    <button class="btn-ctrl" onclick="adjustShield(10)">BOOST</button>
                    <button class="btn-ctrl" onclick="adjustShield(-10)">DIVERT</button>
                </div>
            </div>

            <!-- Weapons Panel -->
            <div class="panel weapons-panel">
                <h2 class="panel-title">TACTICAL</h2>
                <div class="weapon-grid">
                    <button class="weapon-btn" id="btn-laser">LASER <span class="status ready">READY</span></button>
                    <button class="weapon-btn" id="btn-plasma">PLASMA <span class="status charging">CHG</span></button>
                    <button class="weapon-btn" id="btn-torpedo">TORPEDO <span class="status ready">READY</span></button>
                    <button class="weapon-btn danger" id="btn-hyper">HYPER-JUMP</button>
                </div>
                <div class="combat-log" id="combat-log">
                    <p>> SYSTEM READY</p>
                    <p>> WAITING FOR TARGET</p>
                </div>
            </div>

            <!-- Communications Panel -->
            <div class="panel comms-panel">
                <h2 class="panel-title">COMMS-LINK</h2>
                <div class="waveform-container">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <div class="comms-display">
                    <p class="speaker">HQ: "Stay on course, Aether."</p>
                </div>
            </div>

        </footer>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
