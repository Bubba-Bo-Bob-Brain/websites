<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTALIST WEATHER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- MAIN TEMPERATURE DISPLAY (FULL VIEWPORT) -->
    <div class="brutal-temperature">
        <span id="current-temp">--°</span>
        <span id="current-unit">C</span>
    </div>

    <!-- OVERLAPPING DATA PANELS -->
    <div class="brutal-panel brutal-panel-1">
        <h2>NOW</h2>
        <div class="brutal-data">
            <span id="current-condition">---</span>
            <span id="current-humidity">HUMIDITY: --%</span>
            <span id="current-pressure">PRESSURE: --hPa</span>
        </div>
    </div>

    <div class="brutal-panel brutal-panel-2">
        <h2>WIND</h2>
        <div class="brutal-wind">
            <span id="wind-speed">-- km/h</span>
            <div class="wind-arrow" id="wind-direction"></div>
            <span id="wind-dir-text">DIR: --</span>
        </div>
    </div>

    <!-- ALERT BANNER (JARRING COLOR SHIFT) -->
    <div class="brutal-alert" id="weather-alert">
        <span>!!! NO ALERTS !!!</span>
    </div>

    <!-- RAW HTML TABLE (NO STYLING MERCY) -->
    <div class="brutal-forecast">
        <h2>HOURLY FORECAST</h2>
        <table>
            <thead>
                <tr>
                    <th>TIME</th>
                    <th>TEMP (°C)</th>
                    <th>CONDITION</th>
                    <th>WIND (km/h)</th>
                </tr>
            </thead>
            <tbody id="hourly-forecast">
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>

    <!-- EXPOSED SYSTEM CONTROLS -->
    <div class="brutal-controls">
        <button id="toggle-unit">TOGGLE °C/°F</button>
        <button id="refresh-data">REFRESH (BRUTAL)</button>
        <span id="last-updated">LAST UPDATE: --</span>
    </div>

    <!-- DELIBERATELY VISIBLE SCROLLBAR AREA -->
    <div class="brutal-scroll-test">
        <p>SCROLL TO SEE RAW OVERFLOW (NO HIDDEN ELEMENTS)</p>
        <div class="scroll-content"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
