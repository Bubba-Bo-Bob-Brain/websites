<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTAL WEATHER DASHBOARD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="main-title">WEATHER BRUTALISM</h1>
            <div class="location-selector">
                <select id="location-select">
                    <option value="nyc">NEW YORK CITY</option>
                    <option value="london">LONDON</option>
                    <option value="tokyo">TOKYO</option>
                    <option value="sydney">SYDNEY</option>
                </select>
            </div>
        </header>

        <!-- Main Weather Display -->
        <section class="current-weather">
            <div class="temperature-display">
                <span class="temp-value" id="current-temp">72</span>
                <span class="temp-unit">°F</span>
            </div>
            <div class="weather-meta">
                <div class="condition" id="weather-condition">PARTLY CLOUDY</div>
                <div class="feels-like">FEELS LIKE: <span id="feels-like">75°F</span></div>
            </div>
        </section>

        <!-- Weather Stats Grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>HUMIDITY</h3>
                <div class="stat-value" id="humidity">65%</div>
            </div>
            <div class="stat-card">
                <h3>WIND</h3>
                <div class="stat-value" id="wind-speed">8 MPH</div>
                <div class="wind-direction" id="wind-direction"></div>
            </div>
            <div class="stat-card">
                <h3>PRESSURE</h3>
                <div class="stat-value" id="pressure">30.12 IN</div>
            </div>
            <div class="stat-card">
                <h3>VISIBILITY</h3>
                <div class="stat-value" id="visibility">10 MI</div>
            </div>
        </section>

        <!-- Hourly Forecast -->
        <section class="hourly-section">
            <h2>HOURLY FORECAST</h2>
            <div class="hourly-table-container">
                <table class="hourly-table" id="hourly-table">
                    <thead>
                        <tr>
                            <th>TIME</th>
                            <th>TEMP</th>
                            <th>COND</th>
                            <th>PRECIP</th>
                        </tr>
                    </thead>
                    <tbody id="hourly-body">
                        <!-- Generated by JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Alert Section -->
        <section class="alert-section" id="alert-section">
            <div class="alert-banner" id="alert-banner">
                <span class="alert-text" id="alert-text">SEVERE THUNDERSTORM WARNING UNTIL 6PM</span>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="last-updated">LAST UPDATED: <span id="update-time">10:42 AM</span></div>
            <div class="data-source">DATA FROM NATIONAL WEATHER SERVICE</div>
        </footer>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
