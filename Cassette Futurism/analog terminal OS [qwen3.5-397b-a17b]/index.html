<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS-70 // ANALOG INTERFACE</title>
    <!-- Importing fonts for that 70s tech look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Link to CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- The Physical Monitor Casing -->
    <div class="monitor-casing">
        
        <!-- The Screen Container (Curved) -->
        <div class="crt-screen">
            
            <!-- Visual Effects Layer (Scanlines, Flicker, Vignette) -->
            <div class="crt-overlay"></div>
            
            <!-- The Actual Content -->
            <div class="screen-content">
                
                <!-- Top Status Bar -->
                <header class="system-header">
                    <div class="brand">
                        <span class="blink">█</span> NEXUS-70
                    </div>
                    <div class="status-indicators">
                        <div class="indicator active">PWR</div>
                        <div class="indicator">REC</div>
                        <div class="indicator active">NET</div>
                    </div>
                    <div class="clock" id="system-clock">00:00:00</div>
                </header>

                <!-- Main Viewport: The Reel-to-Reel File Manager -->
                <main class="viewport">
                    <div class="viewport-label">DATA REEL STORAGE // UNIT A</div>
                    
                    <div class="reel-deck" id="reel-deck">
                        <!-- Reels will be injected here by JS, but here is the structure -->
                        <div class="reel-slot empty">
                            <div class="reel-hub"></div>
                            <div class="tape-label">EMPTY</div>
                        </div>
                        <div class="reel-slot empty">
                            <div class="reel-hub"></div>
                            <div class="tape-label">EMPTY</div>
                        </div>
                        <div class="reel-slot empty">
                            <div class="reel-hub"></div>
                            <div class="tape-label">EMPTY</div>
                        </div>
                    </div>

                    <div class="file-info-panel">
                        <div class="info-row">
                            <span class="label">SELECTED:</span>
                            <span class="value" id="info-name">--</span>
                        </div>
                        <div class="info-row">
                            <span class="label">SIZE:</span>
                            <span class="value" id="info-size">-- KB</span>
                        </div>
                        <div class="info-row">
                            <span class="label">TYPE:</span>
                            <span class="value" id="info-type">--</span>
                        </div>
                    </div>
                </main>

                <!-- Bottom Control Deck -->
                <footer class="control-deck">
                    
                    <!-- Rotary Navigation -->
                    <div class="control-group nav-controls">
                        <div class="rotary-dial" id="rotary-dial">
                            <div class="dial-marker"></div>
                            <div class="dial-center">NAV</div>
                        </div>
                        <div class="control-label">SELECT</div>
                    </div>

                    <!-- Toggle Switches -->
                    <div class="control-group toggle-controls">
                        <div class="switch-row">
                            <label class="switch-label">POWER</label>
                            <div class="toggle-switch active" data-action="power"></div>
                        </div>
                        <div class="switch-row">
                            <label class="switch-label">LOCK</label>
                            <div class="toggle-switch" data-action="lock"></div>
                        </div>
                        <div class="switch-row">
                            <label class="switch-label">EJECT</label>
                            <div class="toggle-switch" data-action="eject"></div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="control-group action-controls">
                        <button class="chunky-btn" data-action="load">LOAD</button>
                        <button class="chunky-btn" data-action="run">RUN</button>
                        <button class="chunky-btn" data-action="stop">STOP</button>
                    </div>

                    <!-- Ticker Tape Console -->
                    <div class="console-log" id="console-log">
                        <div class="log-entry">SYSTEM INITIALIZED...</div>
                        <div class="log-entry">WAITING FOR INPUT...</div>
                    </div>

                </footer>

            </div>
        </div>
    </div>

    <!-- Audio Context for UI Sounds (Optional placeholder) -->
    <div id="audio-context"></div>

    <!-- Link to JavaScript -->
    <script src="scripts.js"></script>
</body>
</html>
