<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM // 1974</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CRT Screen Container -->
    <div class="crt-container">
        <!-- CRT Overlay Effects (Scanlines, Flicker, Vignette) -->
        <div class="crt-overlay"></div>
        <div class="scanlines"></div>
        <div class="screen-flicker"></div>

        <!-- Main Interface Wrapper -->
        <div class="interface-wrapper">
            
            <!-- Top Status Bar -->
            <header class="status-bar">
                <div class="system-clock" id="clock">00:00:00</div>
                <div class="system-status">
                    <span class="indicator active">PWR</span>
                    <span class="indicator">MEM: 64K</span>
                    <span class="indicator blink">IO: READY</span>
                </div>
            </header>

            <!-- Main Workspace -->
            <main class="workspace">
                
                <!-- Left: Navigation (Rotary Dial Metaphor) -->
                <aside class="nav-panel">
                    <div class="panel-header">
                        <span class="label-text">DIRECTORY SELECTOR</span>
                        <div class="vumeter">
                            <div class="vu-bar" style="height: 40%;"></div>
                        </div>
                    </div>
                    
                    <div class="rotary-dial-container">
                        <div class="rotary-dial" id="rotaryDial">
                            <div class="dial-knob"></div>
                            <div class="dial-markers">
                                <span>0</span><span>1</span><span>2</span><span>3</span>
                                <span>4</span><span>5</span><span>6</span><span>7</span>
                                <span>8</span><span>9</span>
                            </div>
                        </div>
                        <div class="dial-indicator">▼</div>
                    </div>

                    <div class="nav-list">
                        <button class="nav-btn active" data-dir="root">ROOT</button>
                        <button class="nav-btn" data-dir="sys">SYSTEM</button>
                        <button class="nav-btn" data-dir="usr">USERS</button>
                        <button class="nav-btn" data-dir="log">LOGS</button>
                    </div>

                    <div class="hardware-controls">
                        <label class="toggle-switch">
                            <input type="checkbox" id="glowToggle">
                            <span class="slider"></span>
                            <span class="label-text">BLOOM</span>
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="colorToggle">
                            <span class="slider"></span>
                            <span class="label-text">AMBER</span>
                        </label>
                    </div>
                </aside>

                <!-- Center: File Manager (Reel-to-Reel Aesthetic) -->
                <section class="file-manager">
                    <div class="manager-header">
                        <div class="tape-reel left-reel">
                            <div class="spool"></div>
                            <div class="tape-layer"></div>
                        </div>
                        <div class="tape-path">
                            <div class="tape-head"></div>
                        </div>
                        <div class="tape-reel right-reel">
                            <div class="spool"></div>
                            <div class="tape-layer"></div>
                        </div>
                        <div class="transport-controls">
                            <button class="transport-btn" id="btnRewind">⏪</button>
                            <button class="transport-btn" id="btnPlay">▶</button>
                            <button class="transport-btn" id="btnStop">■</button>
                            <button class="transport-btn" id="btnEject">⏏</button>
                        </div>
                    </div>

                    <div class="file-display" id="fileDisplay">
                        <!-- Files injected via JS -->
                    </div>
                </section>

                <!-- Right: Console / Output -->
                <aside class="console-panel">
                    <div class="panel-header">
                        <span class="label-text">TERMINAL OUTPUT</span>
                        <div class="paper-feed">
                            <div class="feed-roller"></div>
                        </div>
                    </div>
                    <div class="console-content" id="consoleLog">
                        <div class="log-entry">> SYSTEM BOOT SEQUENCE INITIATED...</div>
                        <div class="log-entry">> LOADING KERNEL v1.0.4</div>
                        <div class="log-entry">> MOUNTING VOLUMES...</div>
                        <div class="log-entry success">> READY.</div>
                    </div>
                    <div class="console-input-line">
                        <span class="prompt">></span>
                        <input type="text" id="commandInput" autocomplete="off" autofocus>
                    </div>
                </aside>

            </main>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
