<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS/70 · terminal analog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- main CRT cabinet -->
  <main class="crt-cabinet" role="main" aria-label="OS/70 terminal interface">

    <!-- CRT glass with phosphor glow -->
    <div class="crt-glass" data-theme="amber">
      <div class="phosphor-scanlines"></div>
      <div class="phosphor-bloom"></div>
      <div class="barrel-overlay"></div>

      <!-- desktop workspace -->
      <div class="workspace">

        <!-- reel-to-reel tape deck (file system status) -->
        <section class="tape-deck" aria-label="tape drives">
          <div class="reel left-reel">
            <div class="reel-spool">
              <div class="tape-wind" style="--wind: 0deg;"></div>
            </div>
            <span class="reel-label">TAPE A</span>
          </div>
          <div class="tape-counter">
            <span class="counter-digits" id="tapeCounter">0000</span>
            <span class="counter-unit">FT</span>
          </div>
          <div class="reel right-reel">
            <div class="reel-spool">
              <div class="tape-wind" style="--wind: 180deg;"></div>
            </div>
            <span class="reel-label">TAPE B</span>
          </div>
        </section>

        <!-- file manager panel – analog instrument style -->
        <section class="file-manager" aria-label="file manager">
          <div class="panel-header">
            <span class="panel-title">▼ FILE DIRECTORY</span>
            <div class="toggle-group">
              <label class="toggle-switch" aria-label="directory mode">
                <input type="checkbox" id="dirToggle">
                <span class="toggle-slider"></span>
                <span class="toggle-label">DIR</span>
              </label>
            </div>
          </div>

          <div class="file-list" id="fileList">
            <!-- file entries rendered by JS -->
          </div>

          <!-- rotary dial navigation (directory depth) -->
          <div class="rotary-nav" role="slider" tabindex="0" aria-label="directory depth dial" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
            <div class="dial-body">
              <div class="dial-knob" id="dialKnob">
                <div class="dial-notch"></div>
              </div>
              <div class="dial-marks">
                <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
              </div>
            </div>
            <span class="dial-value" id="dialValue">0</span>
          </div>
        </section>

        <!-- ticker-tape console (printout log) -->
        <section class="ticker-console" aria-label="system log">
          <div class="ticker-header">
            <span class="ticker-title">» TTY LOG</span>
            <span class="ticker-clear" id="clearLog" role="button" tabindex="0">CLR</span>
          </div>
          <div class="ticker-paper" id="tickerPaper">
            <div class="ticker-line">* OS/70 BOOT SEQUENCE INITIATED</div>
            <div class="ticker-line">* TAPE A: VOLUME "FUTURE" MOUNTED</div>
            <div class="ticker-line">* READY.</div>
          </div>
        </section>

        <!-- chunky toggle switches (settings) -->
        <section class="switch-bank" aria-label="system switches">
          <div class="switch-item">
            <label class="chunky-switch">
              <input type="checkbox" id="powerGlow" checked>
              <span class="switch-lever"></span>
            </label>
            <span class="switch-label">PWR</span>
          </div>
          <div class="switch-item">
            <label class="chunky-switch">
              <input type="checkbox" id="bloomToggle" checked>
              <span class="switch-lever"></span>
            </label>
            <span class="switch-label">BLOOM</span>
          </div>
          <div class="switch-item">
            <label class="chunky-switch">
              <input type="checkbox" id="scanToggle" checked>
              <span class="switch-lever"></span>
            </label>
            <span class="switch-label">SCAN</span>
          </div>
          <div class="switch-item">
            <label class="chunky-switch">
              <input type="checkbox" id="amberToggle" checked>
              <span class="switch-lever"></span>
            </label>
            <span class="switch-label">AMBER</span>
          </div>
        </section>

      </div> <!-- /workspace -->
    </div> <!-- /crt-glass -->

    <!-- cabinet frame / bezel -->
    <div class="crt-bezel">
      <div class="brand-badge">OS/70</div>
      <div class="bezel-corner top-left"></div>
      <div class="bezel-corner top-right"></div>
      <div class="bezel-corner bottom-left"></div>
      <div class="bezel-corner bottom-right"></div>
    </div>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
