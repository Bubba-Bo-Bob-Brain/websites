<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID_PROTOCOL // SYSTEM_CORRUPTION_DETECTED</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- The Grain/Noise Overlay (Visual Texture) -->
    <div class="noise-overlay"></div>
    <div class="scanlines"></div>

    <!-- The Main OS Container -->
    <main id="os-container">
        
        <!-- Top Bar: Fake System Status -->
        <header class="system-bar">
            <div class="system-info">
                <span class="status-dot pulse"></span>
                <span class="system-text">KERNEL_VERSION: 0.0.1_BETA_DECAY</span>
            </div>
            <div class="system-clock" id="clock">00:00:00</div>
        </header>

        <!-- Desktop Area: Where the "Labyrinth" lives -->
        <section id="desktop">
            
            <!-- Desktop Icons (Entry points to the labyrinth) -->
            <div class="icon-grid">
                <div class="icon" data-target="sector-01" role="button" tabindex="0">
                    <div class="icon-image">📁</div>
                    <span class="icon-label">RECOVERY_LOGS</span>
                </div>
                <div class="icon" data-target="sector-02" role="button" tabindex="0">
                    <div class="icon-image">💾</div>
                    <span class="icon-label">DB_LEAK_09</span>
                </div>
                <div class="icon" data-target="sector-03" role="button" tabindex="0">
                    <div class="icon-image">⚠️</div>
                    <span class="icon-label">CRITICAL_ERR</span>
                </div>
                <div class="icon" data-target="sector-04" role="button" tabindex="0">
                    <div class="icon-image">🖼️</div>
                    <span class="icon-label">LOST_ASSETS</span>
                </div>
            </div>

            <!-- Floating Window Manager Container -->
            <div id="window-layer">
                <!-- Windows will be dynamically injected here by JS to simulate opening files -->
            </div>

        </section>

        <!-- Terminal Interface (Bottom Dock) -->
        <footer class="terminal-dock">
            <div class="terminal-line">
                <span class="prompt">></span>
                <span class="command-output">INITIALIZING DEEP_SCAN...</span>
            </div>
            <div class="terminal-line">
                <span class="prompt">></span>
                <span class="command-output error">ERROR: SECTOR_404_NOT_FOUND</span>
            </div>
            <div class="terminal-line">
                <span class="prompt">></span>
                <span class="command-output">STABILITY: <span class="low-health">14%</span></span>
            </div>
        </footer>
    </main>

    <!-- Global Glitch Overlays (Hidden by default, triggered by JS) -->
    <div id="glitch-overlay-container"></div>

    <!-- The "Hidden Content" - A pristine fragment hidden behind the chaos -->
    <div id="the-core" class="hidden">
        <div class="core-content">
            <h1 class="aesthetic-title">Memory of a Digital Garden</h1>
            <p class="aesthetic-text">You found the center. Everything was once beautiful.</p>
            <div class="garden-artifact"></div>
            <button id="reset-btn">REBOOT SYSTEM</button>
        </div>
    </div>

    <!-- Audio context (for future implementation) -->
    <audio id="glitch-snd" src="" preload="auto"></audio>

    <script src="scripts.js"></script>
</body>
</html>
