<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Gaming Hub | 90s Pixel Paradise</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- CRT Screen Overlay -->
    <div class="crt-screen">
        <div class="scanlines"></div>
        <div class="vhs-noise"></div>

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>RETRO<span class="glitch" data-text="GAME">GAME</span>HUB</h1>
            </div>
            <nav class="nav">
                <button class="nav-btn">HOME</button>
                <button class="nav-btn">GAMES</button>
                <button class="nav-btn">HIGH SCORES</button>
                <button class="nav-btn">ABOUT</button>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="hero">
            <div class="mascot">
                <div class="pixel-mascot"></div>
            </div>
            <h2 class="hero-text">PRESS <span class="start-btn">START</span> TO BEGIN</h2>
        </section>

        <!-- Game Collection -->
        <section class="game-collection">
            <h2>GAME LIBRARY</h2>
            <div class="games-grid">
                <div class="game-card" data-game="mario">
                    <div class="cartridge">
                        <div class="cartridge-label">SUPER MARIO</div>
                    </div>
                </div>
                <div class="game-card" data-game="sonic">
                    <div class="cartridge">
                        <div class="cartridge-label">SONIC</div>
                    </div>
                </div>
                <div class="game-card" data-game="zelda">
                    <div class="cartridge">
                        <div class="cartridge-label">ZELDA</div>
                    </div>
                </div>
                <div class="game-card" data-game="street-fighter">
                    <div class="cartridge">
                        <div class="cartridge-label">STREET FIGHTER</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- High Score Leaderboard -->
        <section class="leaderboard">
            <h2>HIGH SCORES</h2>
            <table class="score-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>PLAYER</th>
                        <th>SCORE</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>PLAYER1</td>
                        <td class="flicker-score">99990</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>PLAYER2</td>
                        <td class="flicker-score">85200</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>PLAYER3</td>
                        <td class="flicker-score">72100</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Cheat Code Input (Hidden) -->
        <div class="cheat-input" id="cheatInput"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>© 1999 RETRO GAME HUB | ALL RIGHTS RESERVED</p>
            <div class="social-icons">
                <div class="pixel-icon"></div>
                <div class="pixel-icon"></div>
                <div class="pixel-icon"></div>
            </div>
        </footer>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
