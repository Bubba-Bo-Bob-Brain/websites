<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMAND CENTER | OPERATION IRON AEGIS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Atmospheric Overlays -->
    <div class="film-grain"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="flicker-overlay"></div>

    <main class="war-room-container">
        
        <!-- Header: Command Status & Propaganda -->
        <header class="command-header">
            <div class="propaganda-frame">
                <div class="propaganda-slide" id="propaganda-display">
                    <!-- Content injected via JS -->
                </div>
            </div>
            <div class="command-status">
                <h1 class="stencil-text">STRATEGIC COMMAND: SECTOR 7</h1>
                <div class="status-indicator">
                    <span class="dot"></span> DEFCON 2
                </div>
            </div>
        </header>

        <div class="console-layout">
            
            <!-- Left Column: Radio Intercepts -->
            <aside class="side-panel intercept-panel">
                <div class="panel-header">
                    <span class="rivet"></span>
                    <h2 class="panel-title">RADIO INTERCEPTS</h2>
                    <span class="rivet"></span>
                </div>
                <div class="intercept-feed" id="intercept-feed">
                    <!-- Text lines will scroll here -->
                </div>
                <div class="panel-footer">
                    <div class="frequency-dial">
                        <div class="dial-needle"></div>
                    </div>
                    <span class="frequency-readout">142.8 MHz</span>
                </div>
            </aside>

            <!-- Center Column: The War Table -->
            <section class="main-stage">
                <div class="war-table-frame">
                    <div class="map-container">
                        <div class="map-grid" id="map-grid"></div>
                        <div class="map-paper">
                            <!-- Topographical details and unit markers -->
                            <div class="map-overlay"></div>
                            <div id="unit-layer">
                                <!-- Unit markers will be placed here -->
                            </div>
                        </div>
                    </div>
                    <div class="table-controls">
                        <button class="mechanical-btn" id="btn-deploy">DEPLOY UNIT</button>
                        <button class="mechanical-btn" id="btn-reset">CLEAR MAP</button>
                    </div>
                </div>
            </section>

            <!-- Right Column: Production & Resources -->
            <aside class="side-panel production-panel">
                <div class="panel-header">
                    <span class="rivet"></span>
                    <h2 class="panel-title">LOGISTICS</h2>
                    <span class="rivet"></span>
                </div>
                
                <div class="gauge-cluster">
                    <div class="gauge-item">
                        <label>STEEL QUOTA</label>
                        <div class="analog-gauge">
                            <div class="gauge-arc"></div>
                            <div class="gauge-needle" id="gauge-steel"></div>
                        </div>
                    </div>
                    <div class="gauge-item">
                        <label>FUEL RESERVE</label>
                        <div class="analog-gauge">
                            <div class="gauge-arc"></div>
                            <div class="gauge-needle" id="gauge-fuel"></div>
                        </div>
                    </div>
                    <div class="gauge-item">
                        <label>AMMO STOCK</label>
                        <div class="analog-gauge">
                            <div class="gauge-arc"></div>
                            <div class="gauge-needle" id="gauge-ammo"></div>
                        </div>
                    </div>
                </div>

                <div class="production-list">
                    <div class="quota-row">
                        <span>TANK PRODUCTION</span>
                        <span class="quota-val">84%</span>
                    </div>
                    <div class="quota-row">
                        <span>AIRCRAFT ASSEMBLY</span>
                        <span class="quota-val">62%</span>
                    </div>
                    <div class="quota-row">
                        <span>RADAR UPGRADE</span>
                        <span class="quota-val">12%</span>
                    </div>
                </div>
            </aside>

        </div>

        <!-- Footer: Clock and System Info -->
        <footer class="command-footer">
            <div class="system-clock" id="clock">00:00:00</div>
            <div class="footer-info">
                <span>TOP SECRET // EYES ONLY</span>
                <span>PROPERTY OF MINISTRY OF DEFENSE</span>
            </div>
        </footer>

    </main>

    <script src="scripts.js"></script>
</body>
</html>
