<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR ROOM COMMAND // SECTOR 4</title>
    <!-- Importing Fonts for that 1940s Industrial/Typewriter look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- Link to CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Ambient Noise & Grain Overlay -->
    <div class="noise-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Main Command Interface -->
    <main class="war-room-container">
        
        <!-- Header: Riveted Steel Bar -->
        <header class="command-header">
            <div class="rivet"></div>
            <h1 class="brand-title">STRATEGIC COMMAND <span class="blink">_</span></h1>
            <div class="date-display" id="current-date">LOADING...</div>
            <div class="rivet"></div>
        </header>

        <!-- Main Grid Layout -->
        <div class="dashboard-grid">
            
            <!-- LEFT COLUMN: Communications -->
            <aside class="panel radio-panel">
                <div class="panel-header">
                    <span class="panel-title">ENCRYPTION BREAKER</span>
                    <div class="status-light active"></div>
                </div>
                <div class="radio-content">
                    <div class="frequency-dial">
                        <div class="dial-face">
                            <div class="needle" id="radio-needle"></div>
                            <span class="freq-label">MHZ</span>
                        </div>
                    </div>
                    <div class="message-log" id="message-log">
                        <!-- Messages injected via JS -->
                        <div class="log-entry static">INITIALIZING UPLINK...</div>
                    </div>
                    <div class="radio-controls">
                        <button class="toggle-btn" id="toggle-scan">SCAN FREQ</button>
                        <button class="toggle-btn" id="clear-log">PURGE</button>
                    </div>
                </div>
                <div class="rivet bottom-left"></div>
                <div class="rivet bottom-right"></div>
            </aside>

            <!-- CENTER: The War Map -->
            <section class="panel map-panel">
                <div class="map-overlay-grid"></div>
                <div class="map-lamp-effect" id="lamp-effect"></div>
                
                <!-- Topographical Map Background Placeholder -->
                <div class="topo-map">
                    <!-- SVG Map Content would go here, simulated with CSS patterns for now -->
                    <div class="terrain-mountain"></div>
                    <div class="terrain-river"></div>
                    <div class="terrain-forest"></div>
                </div>

                <!-- Interactive Zone -->
                <div class="tactical-grid" id="tactical-grid">
                    <!-- Unit Markers injected via JS -->
                </div>

                <div class="map-coordinates">
                    <span id="coord-x">LAT: 00.00</span>
                    <span id="coord-y">LNG: 00.00</span>
                </div>
            </section>

            <!-- RIGHT COLUMN: Production & Intel -->
            <aside class="panel intel-panel">
                <div class="panel-header">
                    <span class="panel-title">LOGISTICS & OUTPUT</span>
                </div>
                
                <div class="gauges-container">
                    <!-- Gauge 1: Steel -->
                    <div class="gauge-wrapper">
                        <div class="gauge">
                            <div class="gauge-fill" id="gauge-steel" style="--fill: 75%"></div>
                            <div class="gauge-cover"></div>
                        </div>
                        <span class="gauge-label">STEEL</span>
                        <span class="gauge-value" id="val-steel">75%</span>
                    </div>

                    <!-- Gauge 2: Fuel -->
                    <div class="gauge-wrapper">
                        <div class="gauge">
                            <div class="gauge-fill" id="gauge-fuel" style="--fill: 40%"></div>
                            <div class="gauge-cover"></div>
                        </div>
                        <span class="gauge-label">FUEL</span>
                        <span class="gauge-value" id="val-fuel">40%</span>
                    </div>

                    <!-- Gauge 3: Manpower -->
                    <div class="gauge-wrapper">
                        <div class="gauge">
                            <div class="gauge-fill" id="gauge-man" style="--fill: 90%"></div>
                            <div class="gauge-cover"></div>
                        </div>
                        <span class="gauge-label">MANPWR</span>
                        <span class="gauge-value" id="val-man">90%</span>
                    </div>
                </div>

                <div class="propaganda-poster">
                    <div class="poster-frame">
                        <div class="poster-content">
                            <h3>PRODUCE OR PERISH</h3>
                            <p>THE FRONT LINES WAIT FOR NO ONE</p>
                            <div class="poster-graphic"></div>
                        </div>
                    </div>
                </div>

                <div class="rivet bottom-left"></div>
                <div class="rivet bottom-right"></div>
            </aside>

        </div>

        <!-- Footer Controls -->
        <footer class="command-footer">
            <div class="control-group">
                <label class="switch-label">GRID OVERLAY</label>
                <button class="mechanical-switch" id="grid-toggle"></button>
            </div>
            <div class="control-group">
                <label class="switch-label">UNIT DEPLOY</label>
                <button class="mechanical-switch active" id="deploy-toggle"></button>
            </div>
            <div class="rivet"></div>
            <div class="rivet"></div>
        </footer>

    </main>

    <!-- Audio Elements (Placeholder paths) -->
    <audio id="snd-static" loop></audio>
    <audio id="snd-click"></audio>

    <!-- Link to JS -->
    <script src="scripts.js"></script>
</body>
</html>
