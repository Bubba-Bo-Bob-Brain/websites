<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABYSS WATCH - Deep Sea Research Station</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="viewport-container">
        <div class="viewport-frame">
            <div class="viewport-glass"></div>
            
            <!-- Hull rivets -->
            <div class="rivet rivet-tl"></div>
            <div class="rivet rivet-tr"></div>
            <div class="rivet rivet-bl"></div>
            <div class="rivet rivet-br"></div>
            
            <!-- Top status bar -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">STATION</span>
                    <span class="status-value">ABYSS-7</span>
                </div>
                <div class="status-item">
                    <span class="status-label">DEPTH</span>
                    <span class="status-value depth-readout">3,842<span class="unit">m</span></span>
                </div>
                <div class="status-item">
                    <span class="status-label">PRESSURE</span>
                    <span class="status-value pressure-readout">386<span class="unit">atm</span></span>
                </div>
                <div class="status-item">
                    <span class="status-label">O2 LEVEL</span>
                    <span class="status-value o2-readout">98.2<span class="unit">%</span></span>
                </div>
            </div>

            <!-- Main dashboard grid -->
            <div class="dashboard-grid">
                <!-- Sonar Panel -->
                <div class="panel panel-sonar">
                    <div class="panel-header">
                        <span class="panel-title">SONAR ARRAY</span>
                        <span class="panel-indicator active"></span>
                    </div>
                    <div class="sonar-display">
                        <canvas id="sonarCanvas"></canvas>
                        <div class="sonar-overlay">
                            <div class="sonar-ring ring-1"></div>
                            <div class="sonar-ring ring-2"></div>
                            <div class="sonar-ring ring-3"></div>
                            <div class="sonar-ring ring-4"></div>
                            <div class="sonar-blip" style="left: 45%; top: 35%;"></div>
                            <div class="sonar-blip" style="left: 62%; top: 55%;"></div>
                            <div class="sonar-blip" style="left: 30%; top: 65%;"></div>
                        </div>
                    </div>
                </div>

                <!-- Pressure & Hull Integrity -->
                <div class="panel panel-pressure">
                    <div class="panel-header">
                        <span class="panel-title">HULL INTEGRITY</span>
                        <span class="panel-indicator warning"></span>
                    </div>
                    <div class="hull-visual">
                        <div class="hull-diagram">
                            <div class="hull-section" data-section="1">
                                <span class="hull-label">BOW</span>
                                <div class="hull-bar integrity-high"></div>
                            </div>
                            <div class="hull-section" data-section="2">
                                <span class="hull-label">MID</span>
                                <div class="hull-bar integrity-high"></div>
                            </div>
                            <div class="hull-section" data-section="3">
                                <span class="hull-label">STERN</span>
                                <div class="hull-bar integrity-mid"></div>
                            </div>
                            <div class="hull-section" data-section="4">
                                <span class="hull-label">KEEL</span>
                                <div class="hull-bar integrity-critical"></div>
                            </div>
                        </div>
                        <div class="pressure-gauge">
                            <svg viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" class="gauge-bg"/>
                                <circle cx="50" cy="50" r="45" class="gauge-fill" 
                                        stroke-dasharray="283" stroke-dashoffset="85"/>
                                <circle cx="50" cy="50" r="40" class="gauge-inner"/>
                                <text x="50" y="55" class="gauge-text" text-anchor="middle">386</text>
                                <text x="50" y="70" class="gauge-unit" text-anchor="middle">atm</text>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Bioluminescent Fauna Tracker -->
                <div class="panel panel-fauna">
                    <div class="panel-header">
                        <span class="panel-title">FAUNA TRACKER</span>
                        <span class="panel-indicator active"></span>
                    </div>
                    <div class="fauna-grid">
                        <div class="fauna-species">
                            <div class="species-indicator bio-1"></div>
                            <span class="species-name">Anglerfish</span>
                            <span class="species-count">12</span>
                        </div>
                        <div class="fauna-species">
                            <div class="species-indicator bio-2"></div>
                            <span class="species-name">Jellyfish</span>
                            <span class="species-count">47</span>
                        </div>
                        <div class="fauna-species">
                            <div class="species-indicator bio-3"></div>
                            <span class="species-name">Gulper Eel</span>
                            <span class="species-count">3</span>
                        </div>
                        <div class="fauna-species">
                            <div class="species-indicator bio-4"></div>
                            <span class="species-name">Vampire Squid</span>
                            <span class="species-count">8</span>
                        </div>
                        <div class="fauna-species">
                            <div class="species-indicator bio-5"></div>
                            <span class="species-name">Giant Isopod</span>
                            <span class="species-count">23</span>
                        </div>
                    </div>
                    <div class="fauna-visualization">
                        <canvas id="faunaCanvas"></canvas>
                    </div>
                </div>

                <!-- Current Flow -->
                <div class="panel panel-current">
                    <div class="panel-header">
                        <span class="panel-title">DEEP CURRENT</span>
                        <span class="panel-indicator active"></span>
                    </div>
                    <div class="current-display">
                        <div class="current-arrow">
                            <svg viewBox="0 0 40 60">
                                <path d="M20 5 L20 55 M5 40 L20 55 L35 40" 
                                      stroke="#00ffaa" stroke-width="2" fill="none"/>
                            </svg>
                        </div>
                        <div class="current-data">
                            <div class="current-item">
                                <span class="current-label">VELOCITY</span>
                                <span class="current-value">2.4 kn</span>
                            </div>
                            <div class="current-item">
                                <span class="current-label">DIRECTION</span>
                                <span class="current-value">NE</span>
                            </div>
                            <div class="current-item">
                                <span class="current-label">TEMP</span>
                                <span class="current-value">2.1°C</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Warning Klaxon -->
                <div class="klaxon-bar" id="klaxonBar">
                    <span class="klaxon-text">⚠ PRESSURE WARNING: KEEL SECTION STRESS</span>
                    <span class="klaxon-blink">⚠</span>
                </div>
            </div>

            <!-- Bottom control bar -->
            <div class="control-bar">
                <button class="control-btn" data-action="scan">
                    <span class="btn-icon">⟐</span>
                    DEEP SCAN
                </button>
                <button class="control-btn" data-action="lights">
                    <span class="btn-icon">◉</span>
                    FLOOD LIGHTS
                </button>
                <button class="control-btn" data-action="sampling">
                    <span class="btn-icon">⏏</span>
                    SAMPLE
                </button>
                <button class="control-btn emergency" data-action="emergency">
                    <span class="btn-icon">⚠</span>
                    EMERGENCY
                </button>
            </div>

            <!-- Bioluminescent particles container -->
            <div class="particle-container" id="particleContainer"></div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
