<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HADAL-OS // Deep Sea Command</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Atmospheric Layer: Marine Snow/Particles -->
    <div id="particle-container"></div>

    <!-- The Submarine Viewport Frame -->
    <div class="viewport-frame">
        <div class="viewport-glass">
            <div class="glass-reflections"></div>
            <div class="glass-scratches"></div>
            
            <!-- MAIN HUD OVERLAY -->
            <main class="dashboard-interface">
                
                <!-- Top Bar: Station Status & Time -->
                <header class="station-header">
                    <div class="station-identity">
                        <span class="glitch-text" data-text="STATION: ABYSS-07">STATION: ABYSS-07</span>
                        <span class="status-indicator"><span class="pulse-dot"></span> SYSTEM: NOMINAL</span>
                    </div>
                    <div class="environment-stats">
                        <div class="stat-item">
                            <label>DEPTH</label>
                            <span id="depth-readout">10,924</span><small>m</small>
                        </div>
                        <div class="stat-item">
                            <label>TEMP</label>
                            <span id="temp-readout">1.2</span><small>°C</small>
                        </div>
                        <div class="stat-item">
                            <label>EXT_PRESS</label>
                            <span id="pressure-readout">1092</span><small>atm</small>
                        </div>
                    </div>
                </header>

                <!-- Center: Sonar & Visual Feed -->
                <section class="central-view">
                    <div class="sonar-module">
                        <div class="sonar-sweep"></div>
                        <div class="sonar-grid"></div>
                        <div id="sonar-pings"></div>
                        <div class="sonar-label">SONAR FEED // ACTIVE</div>
                    </div>
                    
                    <!-- Floating Data Overlays (The 'HUD' elements) -->
                    <div class="hud-overlay-element hud-top-left">
                        <div class="module-label">HULL INTEGRITY</div>
                        <div class="integrity-meter">
                            <div class="integrity-fill" style="width: 98%;"></div>
                        </div>
                        <div class="integrity-status">98.4%</div>
                    </div>

                    <div class="hud-overlay-element hud-bottom-right">
                        <div class="module-label">CURRENT VELOCITY</div>
                        <div class="current-viz">
                            <canvas id="current-canvas"></canvas>
                        </div>
                    </div>
                </section>

                <!-- Bottom Panel: Bioluminescence & Fauna -->
                <footer class="data-footer">
                    <div class="fauna-tracker">
                        <div class="module-header">
                            <span class="module-title">BIOLUMINESCENCE TRACKER</span>
                            <span class="scan-line"></span>
                        </div>
                        <div class="fauna-grid" id="fauna-grid">
                            <!-- Fauna entries injected by JS -->
                            <div class="fauna-card">
                                <div class="fauna-icon"></div>
                                <div class="fauna-info">
                                    <span class="fauna-name">Unknown Specimen</span>
                                    <span class="fauna-signal">SIGNAL: LOW</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="emergency-klaxon-bar">
                        <div class="klaxon-status">NO CRITICAL ALERTS</div>
                        <div class="klaxon-visual-bar"></div>
                    </div>
                </footer>

            </main>
        </div>
    </div>

    <!-- Audio/Ambience context (visualized via JS) -->
    <div class="audio-visualizer">
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
