<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Abyssal Station – Deep‑Sea Ops Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ════════════════════════════════════════════════════════
         MAIN VIEWPORT – simulates a submarine observation port
         ════════════════════════════════════════════════════════ -->
    <div id="viewport">
        <canvas id="viewportCanvas"></canvas>
        <div id="viewportOverlay">
            <svg viewBox="0 0 100 100" id="viewportFrame">
                <!-- Outer bezel -->
                <circle cx="50" cy="50" r="48" stroke="#2a3a4a" stroke-width="0.6" fill="none"/>
                <!-- Inner glass ring -->
                <circle cx="50" cy="50" r="44" stroke="#1a2a3a" stroke-width="0.3" fill="none"/>
                <!-- Cross‑hair -->
                <line x1="50" y1="40" x2="50" y2="60" stroke="#4a6a8a" stroke-width="0.2"/>
                <line x1="40" y1="50" x2="60" y2="50" stroke="#4a6a8a" stroke-width="0.2"/>
            </svg>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════
         TOP BAR – station name, mission clock, depth & pressure
         ════════════════════════════════════════════════════════ -->
    <header id="topBar">
        <div id="stationName">ABYSSAL STATION <span class="accent">Ω‑9</span></div>
        <div id="missionClock">00:00:00</div>
        <div id="depthBar">
            <label>Depth</label>
            <div id="depthGaugeWrap">
                <canvas id="depthGauge" width="180" height="180"></canvas>
                <span id="depthValue">0 m</span>
            </div>
        </div>
        <div id="pressureBar">
            <label>Ambient Pressure</label>
            <div id="pressureGaugeWrap">
                <canvas id="pressureGauge" width="180" height="180"></canvas>
                <span id="pressureValue">0 atm</span>
            </div>
        </div>
    </header>

    <!-- ════════════════════════════════════════════════════════
         MAIN GRID – sonar, fauna tracker, hull integrity, systems
         ════════════════════════════════════════════════════════ -->
    <main id="dashboard">
        <!-- ────── Sonar Feed ────── -->
        <section class="panel" id="sonarPanel">
            <h2>SONAR FEED</h2>
            <canvas id="sonarCanvas" width="400" height="400"></canvas>
            <div id="sonarInfo">
                <span>Range: <strong id="sonarRange">500 m</strong></span>
                <span>Pulse: <strong id="sonarPulse">0.8 s</strong></span>
            </div>
        </section>

        <!-- ────── Bioluminescent Fauna Tracker ────── -->
        <section class="panel" id="faunaPanel">
            <h2>BIOLUMINESCENT FAUNA</h2>
            <canvas id="faunaCanvas" width="400" height="400"></canvas>
            <ul id="faunaList"></ul>
        </section>

        <!-- ────── Hull Integrity ────── -->
        <section class="panel" id="hullPanel">
            <h2>HULL INTEGRITY</h2>
            <svg id="hullDiagram" viewBox="0 0 200 200">
                <!-- Simplified hull cross‑section -->
                <circle cx="100" cy="100" r="85" stroke="#3a5a7a" stroke-width="2" fill="none"/>
                <circle cx="100" cy="100" r="78" stroke="#2a3a4a" stroke-width="1" fill="none"/>
                <text x="100" y="105" text-anchor="middle" fill="#6a9ab5" font-size="12" font-family="'Orbitron',sans-serif">HULL</text>
                <!-- Stress points will be added dynamically -->
            </svg>
            <div id="hullStatus">
                <span>Overall: <strong id="hullOverall">100%</strong></span>
                <span>Breach Risk: <strong id="hullRisk">LOW</strong></span>
            </div>
        </section>

        <!-- ────── Systems & Alerts ────── -->
        <section class="panel" id="systemsPanel">
            <h2>SYSTEMS &amp; ALERTS</h2>
            <div id="systemBars">
                <div class="sysBar"><label>Power</label><div class="bar"><div id="powerBar" class="fill"></div></div></div>
                <div class="sysBar"><label>O₂ Recycler</label><div class="bar"><div id="o2Bar" class="fill"></div></div></div>
                <div class="sysBar"><label>Thermal Control</label><div class="bar"><div id="tempBar" class="fill"></div></div></div>
                <div class="sysBar"><label>Communications</label><div class="bar"><div id="commBar" class="fill"></div></div></div>
            </div>
            <ul id="alertLog"></ul>
        </section>
    </main>

    <!-- ════════════════════════════════════════════════════════
         BOTTOM BAR – current, temperature, klaxon, time‑stamp
         ════════════════════════════════════════════════════════ -->
    <footer id="bottomBar">
        <div id="currentInfo">
            <label>Current</label>
            <canvas id="currentCanvas" width="250" height="60"></canvas>
        </div>
        <div id="tempInfo">
            <label>Water Temp</label>
            <span id="tempValue">2.1 °C</span>
        </div>
        <div id="klaxonWrap">
            <button id="klaxonBtn" title="Activate warning klaxon">⚠ KLAXON</button>
            <div id="klaxonBar"></div>
        </div>
        <div id="timeStamp">2025‑07‑22 03:14:07 UTC</div>
    </footer>

    <!-- Particle container for bioluminescent drift -->
    <div id="particleField"></div>

    <script src="scripts.js"></script>
</body>
</html>
