<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABYSSAL WATCH // DEEP-SEA RESEARCH STATION</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient effects layer (background) -->
  <div class="ambient-effects">
    <canvas id="bioluminescent-particles"></canvas>
    <div class="current-flow"></div>
  </div>

  <!-- Submarine viewport frame -->
  <div class="viewport-container">
    <div class="viewport-frame">
      <div class="viewport-glass">
        <!-- Dashboard panels -->
        <div class="dashboard">

          <!-- Top Bar: System Status -->
          <div class="panel top-bar">
            <div class="depth-gauge">
              <span class="label">DEPTH</span>
              <span class="value" id="depth-value">3,280</span>
              <span class="unit">METERS</span>
              <input type="range" id="depth-slider" min="0" max="11000" value="3280">
            </div>
            <div class="time-clock">
              <span class="label">MISSION TIME</span>
              <span class="value" id="time-value">04:27:18</span>
            </div>
            <div class="hull-integrity">
              <span class="label">HULL INTEGRITY</span>
              <div class="integrity-bar">
                <div class="integrity-fill" id="integrity-fill"></div>
              </div>
              <span class="value" id="integrity-value">98%</span>
            </div>
            <div class="pressure-warning">
              <span class="label">PRESSURE WARNING</span>
              <div class="klaxon-bar" id="klaxon-bar"></div>
            </div>
          </div>

          <!-- Left Panel: Pressure & Environment -->
          <div class="panel left-panel">
            <div class="analog-gauge pressure-gauge">
              <div class="gauge-face">
                <div class="gauge-needle" id="pressure-needle"></div>
                <div class="gauge-center"></div>
              </div>
              <div class="gauge-labels">
                <span class="label">PRESSURE</span>
                <span class="value" id="pressure-value">32.8</span>
                <span class="unit">ATM</span>
              </div>
            </div>
            <div class="analog-gauge temperature-gauge">
              <div class="gauge-face">
                <div class="gauge-needle" id="temperature-needle"></div>
                <div class="gauge-center"></div>
              </div>
              <div class="gauge-labels">
                <span class="label">TEMPERATURE</span>
                <span class="value" id="temperature-value">4</span>
                <span class="unit">°C</span>
              </div>
            </div>
            <div class="environment-readouts">
              <div class="readout">
                <span class="label">SALINITY</span>
                <span class="value" id="salinity-value">34.5</span>
                <span class="unit">PSU</span>
              </div>
              <div class="readout">
                <span class="label">O₂</span>
                <span class="value" id="oxygen-value">6.2</span>
                <span class="unit">MG/L</span>
              </div>
            </div>
          </div>

          <!-- Center Panel: Sonar & Fauna -->
          <div class="panel center-panel">
            <div class="sonar-container">
              <div class="sonar-display" id="sonar-display">
                <div class="sonar-ping" id="sonar-ping"></div>
                <div class="sonar-grid"></div>
                <div class="sonar-fauna" id="sonar-fauna"></div>
              </div>
              <button class="sonar-ping-button" id="ping-button">PING</button>
              <div class="sonar-labels">
                <span class="label">SONAR FEED</span>
                <span class="value" id="sonar-range">500m</span>
              </div>
            </div>
            <div class="fauna-tracker">
              <div class="fauna-header">
                <span class="label">BIOLUMINESCENT FAUNA TRACKING</span>
                <span class="value" id="fauna-count">8</span>
              </div>
              <div class="fauna-list" id="fauna-list">
                <!-- Dynamically populated -->
              </div>
            </div>
          </div>

          <!-- Right Panel: System Logs & Spectrograph -->
          <div class="panel right-panel">
            <div class="system-logs">
              <div class="logs-header">
                <span class="label">SYSTEM LOGS</span>
                <div class="log-filter">
                  <button class="filter-btn active" data-filter="all">ALL</button>
                  <button class="filter-btn" data-filter="alerts">ALERTS</button>
                  <button class="filter-btn" data-filter="sonar">SONAR</button>
                </div>
              </div>
              <div class="logs-container" id="logs-container">
                <!-- Dynamically populated -->
              </div>
            </div>
            <div class="bioluminescence-spectrograph">
              <canvas id="spectrograph-canvas"></canvas>
              <div class="spectrograph-labels">
                <span class="label">BIOLUMINESCENCE SPECTRUM</span>
                <span class="value" id="spectrograph-value">480nm</span>
              </div>
            </div>
          </div>

          <!-- Emergency Actions -->
          <div class="emergency-actions">
            <button class="emergency-button" id="pressure-release">
              <span class="label">PRESSURE RELEASE</span>
              <div class="button-glow"></div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
