<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Research Station | Depth Monitor</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background: Underwater current flow + bioluminescent particles -->
    <div class="ocean-background">
        <div class="current-flow"></div>
        <div class="bioluminescent-particles" id="particles"></div>
    </div>

    <!-- Main Viewport Frame (Submarine window effect) -->
    <div class="viewport-frame">
        <div class="viewport-glass">
            <!-- Sonar Feed (Center) -->
            <div class="sonar-container">
                <div class="sonar-ring" id="sonar-ring"></div>
                <div class="sonar-ping" id="sonar-ping"></div>
                <div class="sonar-targets" id="sonar-targets"></div>
            </div>

            <!-- Depth & Pressure Gauges (Left Panel) -->
            <div class="control-panel left-panel">
                <div class="panel-glass">
                    <h2>Depth Monitor</h2>
                    <div class="gauge depth-gauge">
                        <div class="gauge-face">
                            <div class="gauge-needle" id="depth-needle"></div>
                        </div>
                        <div class="gauge-readout">
                            <span id="depth-value">0</span>
                            <span class="unit">M</span>
                        </div>
                    </div>
                    <div class="status-bar">
                        <span class="label">Hull Stress</span>
                        <div class="bar" id="hull-stress-bar">
                            <div class="fill" id="hull-stress-fill"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Fauna Tracking (Right Panel) -->
            <div class="control-panel right-panel">
                <div class="panel-glass">
                    <h2>Bioluminescent Tracking</h2>
                    <div class="fauna-grid" id="fauna-grid">
                        <!-- Dynamically populated by JS -->
                    </div>
                    <div class="status-bar">
                        <span class="label">Species Detected</span>
                        <span id="species-count">0</span>
                    </div>
                </div>
            </div>

            <!-- Pressure Warning Klaxon (Top) -->
            <div class="klaxon-bar" id="klaxon-bar">
                <div class="klaxon-light" id="klaxon-light"></div>
                <span class="klaxon-text" id="klaxon-text">SYSTEM NOMINAL</span>
            </div>

            <!-- Bottom Status Bar (Time, Alerts) -->
            <div class="status-footer">
                <div class="time-display" id="time-display">00:00:00</div>
                <div class="alerts" id="alerts-container">
                    <!-- Alerts injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Ambient Light Overlay (Affected by depth) -->
    <div class="ambient-overlay" id="ambient-overlay"></div>

    <script src="scripts.js"></script>
</body>
</html>
