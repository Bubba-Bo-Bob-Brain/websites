<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire of the Unseen | Slavic Bestiary</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing characterful fonts: IM Fell English for that old print feel and Almendra for the gothic touch -->
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Ambient Overlays -->
    <div class="grain-overlay"></div>
    <div class="hearth-glow"></div>
    <div class="forest-canopy"></div>

    <main class="book-wrapper">
        <!-- Leather Binding / Spine -->
        <div class="book-spine"></div>
        
        <div class="book-container">
            
            <!-- Left Page: The Index (The Birch Bark Ledger) -->
            <section class="index-page">
                <header class="index-header">
                    <h1>Bestiary of the <br><span>Deep Wilds</span></h1>
                    <p class="subtitle">Cataloged by the Hermit of the Black Marshes</p>
                    <div class="decorative-divider"></div>
                </header>

                <nav class="creature-nav">
                    <ul id="creature-list">
                        <li class="nav-item active" data-creature="leshy">
                            <span class="nav-symbol">🌿</span>
                            <span class="nav-name">The Leshy</span>
                            <span class="nav-danger" data-level="3">ᛈ</span>
                        </li>
                        <li class="nav-item" data-creature="rusalka">
                            <span class="nav-symbol">💧</span>
                            <span class="nav-name">The Rusalka</span>
                            <span class="nav-danger" data-level="4">ᛊ</span>
                        </li>
                        <li class="nav-item" data-creature="baba-yaga">
                            <span class="nav-symbol">🧹</span>
                            <span class="nav-name">Baba Yaga</span>
                            <span class="nav-danger" data-level="5">ᚦ</span>
                        </li>
                        <li class="nav-item" data-creature="zmey">
                            <span class="nav-symbol">🔥</span>
                            <span class="nav-name">The Zmey</span>
                            <span class="nav-danger" data-level="5">ᛗ</span>
                        </li>
                        <li class="nav-item" data-creature="domovoy">
                            <span class="nav-symbol">🏠</span>
                            <span class="nav-name">The Domovoy</span>
                            <span class="nav-danger" data-level="1">ᚱ</span>
                        </li>
                        <li class="nav-item" data-creature="vodyanoy">
                            <span class="nav-symbol">🌀</span>
                            <span class="nav-name">The Vodyanoy</span>
                            <span class="nav-danger" data-level="4">ᚢ</span>
                        </li>
                    </ul>
                </nav>

                <footer class="index-footer">
                    <p>"Trust not the silence of the pines."</p>
                </footer>
            </section>

            <!-- Right Page: The Folio (The Parchment Entry) -->
            <section class="folio-page">
                <div class="page-texture"></div>
                
                <!-- This content will be dynamically updated by JS -->
                <article id="creature-display" class="creature-entry">
                    <div class="woodcut-frame">
                        <div class="illustration-container">
                            <img src="" alt="Creature Illustration" id="creature-img" class="woodcut-img">
                            <div class="image-overlay"></div>
                        </div>
                        
                        <div class="content-body">
                            <h2 id="creature-name" class="display-title">The Leshy</h2>
                            
                            <div class="meta-info">
                                <span class="habitat" id="creature-habitat">Ancient Taiga</span>
                                <span class="danger-sigil" id="creature-danger">ᛈ</span>
                            </div>

                            <div class="description-text">
                                <p class="drop-cap-text" id="creature-desc">
                                    <!-- Content injected via JS -->
                                </p>
                            </div>

                            <div class="lore-grid">
                                <div class="lore-block">
                                    <h3>Traits</h3>
                                    <ul id="creature-traits">
                                        <!-- Content injected via JS -->
                                    </ul>
                                </div>
                                <div class="lore-block">
                                    <h3>Warding</h3>
                                    <p id="creature-warding">
                                        <!-- Content injected via JS -->
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>

                <!-- Decorative Corner Elements -->
                <div class="corner-ornament tl"></div>
                <div class="corner-ornament tr"></div>
                <div class="corner-ornament bl"></div>
                <div class="corner-ornament br"></div>
            </section>
        </div>
    </main>

    <div class="custom-cursor"></div>

    <script src="scripts.js"></script>
</body>
</html>
