<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Ages: A Pixel Medieval Journey</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pixel-art background overlay -->
    <div class="pixel-grid-overlay"></div>

    <!-- Tolling Bell (Animated) -->
    <div class="tolling-bell">
        <div class="bell"></div>
        <div class="bell-rope"></div>
    </div>

    <!-- Header with Illuminated Manuscript Border -->
    <header class="manuscript-header">
        <div class="manuscript-border">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
            <h1 class="pixel-title">DARK AGES</h1>
            <p class="subtitle">A Pixel Medieval Journey</p>
        </div>
    </header>

    <!-- Hero Section with Plague Doctor -->
    <section class="hero">
        <div class="plague-doctor">
            <div class="doctor-body"></div>
            <div class="doctor-mask"></div>
            <div class="doctor-hat"></div>
            <div class="doctor-staff"></div>
        </div>
        <div class="hero-text">
            <h2 class="pixel-text">The Black Death Stalketh...</h2>
            <p class="old-english">
                In the year of our Lord 1347, a great pestilence swept across the land.
                The people cried out in terror as the shadow of the plague doctor loomed.
            </p>
            <button class="medieval-button">Enter the Kingdom</button>
        </div>
    </section>

    <!-- Village Map (Interactive) -->
    <section class="village-map-container">
        <h2 class="section-title">The Kingdom of Eldermere</h2>
        <div class="map-controls">
            <button class="cycle-toggle" id="dayNightToggle">🌙 Night</button>
        </div>
        <div class="village-map">
            <!-- SVG-based pixel-art map -->
            <svg class="kingdom-map" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                <!-- Map background (dirt/grass texture) -->
                <rect width="600" height="400" fill="#5a3e2b" class="map-ground"/>

                <!-- Rivers -->
                <path d="M50,200 Q200,150 350,200 Q400,250 550,200" stroke="#4a90d9" stroke-width="8" fill="none" class="river"/>

                <!-- Village (pixel-art buildings) -->
                <rect x="100" y="100" width="40" height="40" fill="#8b4513" class="building"/>
                <rect x="150" y="100" width="40" height="40" fill="#8b4513" class="building"/>
                <rect x="200" y="100" width="40" height="40" fill="#8b4513" class="building"/>
                <polygon points="120,80 160,80 140,60" fill="#654321" class="roof"/>

                <!-- Castle -->
                <rect x="400" y="50" width="100" height="100" fill="#708090" class="castle"/>
                <rect x="420" y="30" width="60" height="20" fill="#708090" class="castle-tower"/>
                <polygon points="400,50 450,20 500,50" fill="#556b7d" class="castle-roof"/>

                <!-- Trees (pixel-art) -->
                <circle cx="50" cy="300" r="15" fill="#228b22" class="tree"/>
                <rect x="45" y="300" width="10" height="20" fill="#8b4513" class="tree-trunk"/>
                <circle cx="550" cy="320" r="15" fill="#228b22" class="tree"/>
                <rect x="545" y="320" width="10" height="20" fill="#8b4513" class="tree-trunk"/>

                <!-- Interactive hotspots (hidden, revealed on hover) -->
                <circle cx="120" cy="120" r="30" fill="transparent" class="map-hotspot" data-location="Village"/>
                <circle cx="450" cy="100" r="30" fill="transparent" class="map-hotspot" data-location="Castle"/>
                <circle cx="50" cy="300" r="30" fill="transparent" class="map-hotspot" data-location="Forest"/>
                <circle cx="550" cy="320" r="30" fill="transparent" class="map-hotspot" data-location="Dark Woods"/>
            </svg>
            <div class="location-tooltip" id="locationTooltip"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="medieval-footer">
        <div class="footer-border">
            <p class="footer-text">✠ Scrolled upon parchment in the Year of Our Lord 2024 ✠</p>
        </div>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
