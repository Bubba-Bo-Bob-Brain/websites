<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles of the Long Night</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IM+Fell+English+SC&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Parchment aging overlay -->
        <div class="parchment-overlay"></div>
        
        <!-- Custom pixel cursor follower -->
        <div class="cursor-torch" id="cursorTorch"></div>
        
        <!-- Main illuminated manuscript frame -->
        <div class="manuscript-frame">
            <!-- Corner ornaments -->
            <div class="corner-ornament corner-tl">
                <div class="vine vine-tl"></div>
                <div class="glow-flower flower-tl"></div>
            </div>
            <div class="corner-ornament corner-tr">
                <div class="vine vine-tr"></div>
                <div class="glow-flower flower-tr"></div>
            </div>
            <div class="corner-ornament corner-bl">
                <div class="vine vine-bl"></div>
                <div class="glow-flower flower-bl"></div>
            </div>
            <div class="corner-ornament corner-br">
                <div class="vine vine-br"></div>
                <div class="glow-flower flower-br"></div>
            </div>
            
            <!-- Side borders with running vines -->
            <div class="side-border border-left">
                <div class="vine-segment"></div>
                <div class="vine-segment"></div>
                <div class="vine-segment"></div>
            </div>
            <div class="side-border border-right">
                <div class="vine-segment"></div>
                <div class="vine-segment"></div>
                <div class="vine-segment"></div>
            </div>
            <div class="side-border border-top">
                <div class="vine-segment-h"></div>
                <div class="vine-segment-h"></div>
                <div class="vine-segment-h"></div>
            </div>
            <div class="side-border border-bottom">
                <div class="vine-segment-h"></div>
                <div class="vine-segment-h"></div>
                <div class="vine-segment-h"></div>
            </div>
            
            <!-- Inner content viewport -->
            <div class="viewport">
                
                <!-- Sky layer with day-night cycle -->
                <div class="sky-layer" id="skyLayer">
                    <div class="celestial-body" id="celestialBody"></div>
                    <div class="stars" id="stars"></div>
                    <div class="clouds" id="clouds"></div>
                </div>
                
                <!-- Mountain parallax layer -->
                <div class="parallax-layer mountains" id="mountains">
                    <div class="mountain-peak peak-1"></div>
                    <div class="mountain-peak peak-2"></div>
                    <div class="mountain-peak peak-3"></div>
                </div>
                
                <!-- Forest parallax layer -->
                <div class="parallax-layer forest-back" id="forestBack">
                    <div class="pine-tree tree-b1"></div>
                    <div class="pine-tree tree-b2"></div>
                    <div class="pine-tree tree-b3"></div>
                    <div class="pine-tree tree-b4"></div>
                </div>
                
                <!-- Village ground layer -->
                <div class="ground-layer" id="groundLayer">
                    <!-- The Church with tolling bell -->
                    <div class="building church" id="church">
                        <div class="church-body">
                            <div class="church-roof"></div>
                            <div class="church-wall">
                                <div class="stained-window window-1"></div>
                                <div class="stained-window window-2"></div>
                                <div class="stained-window window-3"></div>
                            </div>
                            <div class="church-door"></div>
                        </div>
                        <div class="bell-tower" id="bellTower">
                            <div class="tower-body">
                                <div class="tower-window"></div>
                            </div>
                            <div class="belfry" id="belfry">
                                <div class="bell-arch arch-left"></div>
                                <div class="bell-arch arch-right"></div>
                                <div class="bell" id="bell">
                                    <div class="bell-top"></div>
                                    <div class="bell-mid"></div>
                                    <div class="bell-lip"></div>
                                    <div class="bell-clapper" id="bellClapper"></div>
                                </div>
                            </div>
                            <div class="tower-spire">
                                <div class="spire-point"></div>
                                <div class="weather-vane" id="weatherVane"></div>
                            </div>
                        </div>
                        <!-- Bell sound waves -->
                        <div class="sound-waves" id="soundWaves"></div>
                    </div>
                    
                    <!-- The Plague Doctor -->
                    <div class="character plague-doctor" id="plagueDoctor">
                        <div class="doctor-body">
                            <div class="doctor-coat"></div>
                            <div class="doctor-belt"></div>
                        </div>
                        <div class="doctor-head" id="doctorHead">
                            <div class="beak-mask" id="beakMask">
                                <div class="beak-top"></div>
                                <div class="beak-mid"></div>
                                <div class="beak-tip"></div>
                                <div class="eye-glass glass-left"></div>
                                <div class="eye-glass glass-right"></div>
                                <div class="glass-shine shine-left" id="shineLeft"></div>
                                <div class="glass-shine shine-right" id="shineRight"></div>
                            </div>
                            <div class="doctor-hat">
                                <div class="hat-brim"></div>
                                <div class="hat-top"></div>
                            </div>
                        </div>
                        <div class="doctor-staff" id="doctorStaff">
                            <div class="staff-pole"></div>
                            <div class="staff-top">
                                <div class="staff-wing wing-left"></div>
                                <div class="staff-wing wing-right"></div>
                            </div>
                        </div>
                        <div class="doctor-cape" id="doctorCape"></div>
                    </div>
                    
                    <!-- Village houses -->
                    <div class="building house house-1" id="house1">
                        <div class="house-roof"></div>
                        <div class="house-body">
                            <div class="house-window">
                                <div class="window-light" id="light1"></div>
                            </div>
                            <div class="house-door"></div>
                        </div>
                        <div class="house-chimney">
                            <div class="smoke" id="smoke1"></div>
                        </div>
                    </div>
                    
                    <div class="building house house-2" id="house2">
                        <div class="house-roof"></div>
                        <div class="house-body">
                            <div class="house-window">
                                <div class="window-light" id="light2"></div>
                            </div>
                            <div class="house-door"></div>
                        </div>
                        <div class="house-chimney">
                            <div class="smoke" id="smoke2"></div>
                        </div>
                    </div>
                    
                    <div class="building house house-3" id="house3">
                        <div class="house-roof"></div>
                        <div class="house-body">
                            <div class="house-window">
                                <div class="window-light" id="light3"></div>
                            </div>
                            <div class="house-door"></div>
                        </div>
                    </div>
                    
                    <!-- The well -->
                    <div class="building well" id="well">
                        <div class="well-base"></div>
                        <div class="well-rim"></div>
                        <div class="well-roof"></div>
                        <div class="well-bucket" id="wellBucket">
                            <div class="bucket-rope" id="bucketRope"></div>
                            <div class="bucket-body"></div>
                        </div>
                    </div>
                    
                    <!-- Trees with seasonal states -->
                    <div class="tree tree-1" id="tree1">
                        <div class="trunk"></div>
                        <div class="foliage" id="foliage1"></div>
                    </div>
                    <div class="tree tree-2" id="tree2">
                        <div class="trunk"></div>
                        <div class="foliage" id="foliage2"></div>
                    </div>
                    <div class="tree tree-3" id="tree3">
                        <div class="trunk"></div>
                        <div class="foliage" id="foliage3"></div>
                    </div>
                    
                    <!-- Ground details -->
                    <div class="ground-texture"></div>
                    <div class="path-stones">
                        <div class="stone stone-1"></div>
                        <div class="stone stone-2"></div>
                        <div class="stone stone-3"></div>
                        <div class="stone stone-4"></div>
                        <div class="stone stone-5"></div>
                    </div>
                    
                    <!-- Crows -->
                    <div class="crow crow-1" id="crow1">
                        <div class="crow-body"></div>
                        <div class="crow-wing" id="crowWing1"></div>
                    </div>
                    <div class="crow crow-2" id="crow2">
                        <div class="crow-body"></div>
                        <div class="crow-wing" id="crowWing2"></div>
                    </div>
                </div>
                
                <!-- Fog layer -->
                <div class="fog-layer" id="fogLayer"></div>
                
                <!-- Rain layer -->
                <div class="rain-layer" id="rainLayer"></div>
                
            </div>
        </div>
        
        <!-- UI Controls Panel -->
        <div class="controls-panel" id="controlsPanel">
            <h2 class="panel-title">CHRONICLES</h2>
            
            <div class="control-group">
                <label class="control-label">Time of Day</label>
                <div class="time-slider-container">
                    <input type="range" class="time-slider" id="timeSlider" min="0" max="24" value="12" step="0.1">
                    <div class="time-marks">
                        <span>Midnight</span>
                        <span>Dawn</span>
                        <span>Noon</span>
                        <span>Dusk</span>
                        <span>Midnight</span>
                    </div>
                    <div class="time-display" id="timeDisplay">12:00</div>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Season</label>
                <div class="season-buttons" id="seasonButtons">
                    <button class="season-btn active" data-season="spring" id="btnSpring">Spring</button>
                    <button class="season-btn" data-season="summer" id="btnSummer">Summer</button>
                    <button class="season-btn" data-season="autumn" id="btnAutumn">Autumn</button>
                    <button class="season-btn" data-season="winter" id="btnWinter">Winter</button>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Weather</label>
                <div class="weather-buttons" id="weatherButtons">
                    <button class="weather-btn active" data-weather="clear" id="btnClear">Clear</button>
                    <button class="weather-btn" data-weather="rain" id="btnRain">Rain</button>
                    <button class="weather-btn" data-weather="fog" id="btnFog">Fog</button>
                </div>
            </div>
            
            <div class="control-group">
                <button class="action-btn" id="btnTollBell">Toll the Bell</button>
                <button class="action-btn" id="btnVisitDoctor">Seek the Doctor</button>
            </div>
        </div>
        
        <!-- Interactive Map Overlay -->
        <div class="map-overlay" id="mapOverlay">
            <div class="map-panel" id="mapPanel">
                <h3 class="map-title">Village of Ashmire</h3>
                <div class="pixel-map" id="pixelMap">
                    <div class="map-location loc-church" data-loc="church">
                        <div class="map-icon church-icon"></div>
                        <span class="map-label">Church</span>
                    </div>
                    <div class="map-location loc-well" data-loc="well">
                        <div class="map-icon well-icon"></div>
                        <span class="map-label">Well</span>
                    </div>
                    <div class="map-location loc-houses" data-loc="houses">
                        <div class="map-icon houses-icon"></div>
                        <span class="map-label">Homes</span>
                    </div>
                    <div class="map-location loc-forest" data-loc="forest">
                        <div class="map-icon forest-icon"></div>
                        <span class="map-label">Blackwood</span>
                    </div>
                    <div class="map-location loc-doctor" data-loc="doctor">
                        <div class="map-icon doctor-icon"></div>
                        <span class="map-label">Plague Doctor</span>
                    </div>
                    <div class="map-player" id="mapPlayer"></div>
                </div>
                <button class="map-close" id="mapClose">Return</button>
            </div>
        </div>
        
        <!-- Info popup for locations -->
        <div class="info-popup" id="infoPopup">
            <div class="popup-frame">
                <h4 class="popup-title" id="popupTitle"></h4>
                <p class="popup-text" id="popupText"></p>
                <div class="popup-divider"></div>
                <button class="popup-close" id="popupClose">Close</button>
            </div>
        </div>
        
        <!-- Narrative text scroller -->
        <div class="narrative-bar" id="narrativeBar">
            <p class="narrative-text" id="narrativeText">The year of our Lord 1348. The pestilence walks among us...</p>
        </div>
        
        <!-- Screen shake container -->
        <div class="screen-shake" id="screenShake"></div>
        
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
