<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dark Ages Codex | A Pixel Art Journey</title>
  <meta name="description" content="Explore the Dark Ages through pixel art and interactive storytelling.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Day/Night Cycle Toggle -->
  <div class="cycle-toggle">
    <button id="toggle-cycle" aria-label="Toggle day and night">
      <span class="icon-sun">☀</span>
      <span class="icon-moon">☽</span>
    </button>
  </div>

  <!-- Seasonal Decorations (e.g., autumn leaves) -->
  <div class="seasonal-decorations" id="seasonal-decor"></div>

  <!-- Parchment Container -->
  <div class="parchment-container">
    <!-- Illuminated Manuscript Header -->
    <header class="manuscript-header">
      <div class="illuminated-border">
        <div class="border-top"></div>
        <div class="border-left"></div>
        <div class="border-right"></div>
        <div class="border-bottom"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
      </div>
      <h1 class="title">The Dark Ages Codex</h1>
      <p class="subtitle">Anno Domini 800–1400</p>
    </header>

    <!-- Hero Section: Tolling Bell -->
    <section class="hero-section">
      <div class="bell-container">
        <div class="bell" id="bell">
          <div class="bell-rope"></div>
          <div class="bell-body"></div>
          <div class="bell-clapper"></div>
        </div>
        <p class="bell-caption">Ring the bell to summon the village...</p>
      </div>
    </section>

    <!-- Interactive Kingdom Map -->
    <section class="kingdom-map">
      <div class="map-container">
        <div class="map-frame">
          <div class="map" id="map">
            <!-- Villages, castles, and landmarks (added via JS) -->
            <div class="map-location village" data-name="Blackford" data-type="village" style="top: 20%; left: 30%;"></div>
            <div class="map-location castle" data-name="Castle Grimhold" data-type="castle" style="top: 40%; left: 60%;"></div>
            <div class="map-location forest" data-name="Whispering Woods" data-type="forest" style="top: 70%; left: 20%;"></div>
            <div class="map-location river" data-name="River Styx" data-type="river" style="top: 50%; left: 80%;"></div>
            <!-- Plague doctor path (animated via JS) -->
            <div class="plague-doctor-path"></div>
          </div>
        </div>
        <div class="map-legend">
          <div class="legend-item"><span class="icon-village"></span> Village</div>
          <div class="legend-item"><span class="icon-castle"></span> Castle</div>
          <div class="legend-item"><span class="icon-forest"></span> Forest</div>
          <div class="legend-item"><span class="icon-river"></span> River</div>
        </div>
      </div>
    </section>

    <!-- Plague Doctor NPCs -->
    <div class="plague-doctor" id="doctor-1">
      <div class="doctor-mask"></div>
      <div class="doctor-robe"></div>
      <div class="doctor-staff"></div>
    </div>
    <div class="plague-doctor" id="doctor-2">
      <div class="doctor-mask"></div>
      <div class="doctor-robe"></div>
      <div class="doctor-staff"></div>
    </div>

    <!-- Parchment Footer -->
    <footer class="manuscript-footer">
      <div class="illuminated-border">
        <div class="border-top"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
      </div>
      <p>Written in the Year of Our Lord <span id="current-year">2023</span></p>
      <p>By a humble scribe</p>
    </footer>
  </div>

  <!-- Audio for bell and ambiance -->
  <audio id="bell-audio" src="https://assets.mixkit.co/sfx/preview/mixkit-medieval-show-bell-1904.mp3" preload="auto"></audio>
  <audio id="ambiance-audio" src="https://assets.mixkit.co/sfx/preview/mixkit-medieval-crowd-and-market-place-1488.mp3" loop preload="auto"></audio>

  <script src="scripts.js"></script>
</body>
</html>
