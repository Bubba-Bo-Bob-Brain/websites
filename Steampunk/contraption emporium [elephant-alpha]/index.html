<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victorian Curiosities & Mechanical Wonders</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cinzel+Decorative:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="steampunk-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <div class="gear-icon"></div>
                <span>Victorian Curiosities</span>
                <div class="gear-icon small"></div>
            </div>
            <div class="nav-menu">
                <a href="#shop" class="nav-link">Shop</a>
                <a href="#cart" class="nav-link">Cart</a>
                <a href="#about" class="nav-link">About</a>
            </div>
            <div class="cart-trigger" id="cartTrigger">
                <div class="cart-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        <path d="M6 5c0 0-3 2-3 7s2.9-3 3-3"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Mechanical Marvels</h1>
            <p class="hero-subtitle">Where Brass Meets Magic</p>
            <div class="hero-divider"></div>
        </div>
        <div class="hero-gear"></div>
    </header>

    <!-- Shop Section -->
    <main id="shop" class="shop-section">
        <div class="section-header">
            <h2>Catalog of Curiosities</h2>
            <div class="section-divider"></div>
            <p>Discover our collection of arcane devices and mechanical wonders</p>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be populated by JavaScript -->
        </div>
    </main>

    <!-- Cart Section -->
    <aside class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h3>Arcane Ledger</h3>
            <div class="close-cart" id="closeCart">&times;</div>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Cart items will be populated by JavaScript -->
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>Subtotal:</span>
                <span id="subtotal">0 gp</span>
            </div>
            <div class="total-row">
                <span>Tax (10%):</span>
                <span id="tax">0 gp</span>
            </div>
            <div class="total-row grand-total">
                <span>Total:</span>
                <span id="total">0 gp</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Complete Transaction</button>
        </div>
    </aside>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Pneumatic Tube Animation Container -->
    <div class="pneumatic-tube" id="pneumaticTube">
        <div class="tube-ball" id="tubeBall"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
