<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldritch Auction House</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Gothic:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="playfair-display:display=swap">
</head>
<body>
    <!-- Ambient Background Effects -->
    <div class="ambient-effects">
        <div class="candle-flame" id="candle1"></div>
        <div class="candle-flame" id="candle2"></div>
        <div class="candle-flame" id="candle3"></div>
        <div class="candle-flame" id="candle4"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="seal-container">
                <div class="cursed-seal" id="mainSeal">
                    <div class="seal-symbol">☠</div>
                    <div class="seal-text">FORBIDDEN</div>
                </div>
            </div>
            <h1 class="title">Eldritch Auction House</h1>
            <div class="subtitle">Where Souls Are Traded</div>
        </header>

        <!-- Live Auction Section -->
        <section class="live-auction">
            <h2 class="section-title">LIVE AUCTION</h2>
            <div class="auction-items" id="auctionItems">
                <!-- Items will be populated by JavaScript -->
            </div>
        </section>

        <!-- Bidding History -->
        <section class="bidding-history">
            <h2 class="section-title">BID HISTORY</h2>
            <div class="history-container">
                <div class="bid-stream" id="bidStream">
                    <!-- Bids will appear here -->
                </div>
                <div class="whispering-text">
                    "The items remember their previous owners... and their screams"
                </div>
            </div>
        </section>

        <!-- Spectral Bidders -->
        <section class="spectral-bidders">
            <h2 class="section-title">SPECTRAL BIDDERS</h2>
            <div class="bidders-list" id="biddersList">
                <!-- Spectral bidders will appear here -->
            </div>
        </section>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
