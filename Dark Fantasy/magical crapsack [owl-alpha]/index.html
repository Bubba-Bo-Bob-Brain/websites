<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crapsack Codex - Ledger of Sorrows</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <header class="main-header">
        <div class="header-content">
            <h1 class="site-title">The Crapsack Codex</h1>
            <p class="subtitle">Documenting the Inevitable Decline of All Things</p>
        </div>
        <div class="misery-container">
            <span class="misery-label">Current Suffering Level</span>
            <div class="misery-bar">
                <div class="misery-fill" id="miseryFill"></div>
            </div>
            <span class="misery-value" id="miseryValue">78%</span>
        </div>
    </header>

    <main class="codex-container">
        <nav class="codex-tabs">
            <button class="tab-button active" data-tab="afflictions">Afflictions</button>
            <button class="tab-button" data-tab="artifacts">Cursed Artifacts</button>
            <button class="tab-button" data-tab="prophecies">Prophecies</button>
            <button class="tab-button" data-tab="realms">Blighted Realms</button>
        </nav>

        <section id="afflictions" class="tab-content active">
            <h2 class="section-title">Catalog of Afflictions</h2>
            <div class="affliction-grid">
                <!-- Content will be populated by JS -->
            </div>
        </section>

        <section id="artifacts" class="tab-content">
            <h2 class="section-title">Relics of Ruin</h2>
            <div class="artifact-grid">
                <!-- Content will be populated by JS -->
            </div>
        </section>

        <section id="prophecies" class="tab-content">
            <h2 class="section-title">Whispers of the Void</h2>
            <div class="prophecy-scroll">
                <!-- Content will be populated by JS -->
            </div>
        </section>

        <section id="realms" class="tab-content">
            <h2 class="section-title">The Blighted Lands</h2>
            <div class="realm-map">
                <!-- Content will be populated by JS -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>"In the end, only the Codex remains."</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
