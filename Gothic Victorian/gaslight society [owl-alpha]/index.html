<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Obsidian Circle - Members Directory</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Gaslight Ambient Glow -->
    <div class="gaslight-glow"></div>

    <!-- Sealed Invitation Overlay -->
    <div id="invitation-overlay" class="invitation-overlay">
        <div class="invitation-envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-body">
                <div class="wax-seal" id="wax-seal">
                    <i class="fas fa-stamp"></i>
                </div>
                <div class="invitation-text">
                    <p>You have been summoned...</p>
                    <button id="open-invitation" class="btn-parchment">Break the Seal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="site-header">
        <div class="header-ornament header-ornament-left"></div>
        <div class="header-content">
            <h1 class="site-title">The Obsidian Circle</h1>
            <p class="site-subtitle">Est. 1847 · London</p>
        </div>
        <div class="header-ornament header-ornament-right"></div>
        
        <!-- Grandfather Clock -->
        <div class="grandfather-clock">
            <div class="clock-case">
                <div class="clock-face">
                    <div class="clock-hand hour-hand" id="hour-hand"></div>
                    <div class="clock-hand minute-hand" id="minute-hand"></div>
                    <div class="clock-hand second-hand" id="second-hand"></div>
                    <div class="clock-center"></div>
                </div>
                <div class="clock-pendulum">
                    <div class="pendulum-bob"></div>
                </div>
            </div>
            <div class="clock-sound-indicator" id="clock-sound">
                <i class="fas fa-volume-mute"></i>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav">
        <ul class="nav-list">
            <li><a href="#members" class="nav-link active"><i class="fas fa-users"></i> Members</a></li>
            <li><a href="#seances" class="nav-link"><i class="fas fa-moon"></i> Séances</a></li>
            <li><a href="#hierarchy" class="nav-link"><i class="fas fa-sitemap"></i> Hierarchy</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Members Directory Section -->
        <section id="members" class="content-section active-section">
            <h2 class="section-title"><i class="fas fa-users"></i> Members Directory</h2>
            <div class="members-grid" id="members-grid">
                <!-- Member cards will be injected here by JS -->
            </div>
        </section>

        <!-- Séance Schedule Section -->
        <section id="seances" class="content-section">
            <h2 class="section-title"><i class="fas fa-moon"></i> Séance Schedule</h2>
            <div class="seance-calendar" id="seance-calendar">
                <!-- Calendar will be generated by JS -->
            </div>
        </section>

        <!-- Hierarchy Section -->
        <section id="hierarchy" class="content-section">
            <h2 class="section-title"><i class="fas fa-sitemap"></i> Inner Circles</h2>
            <div class="hierarchy-container" id="hierarchy-container">
                <!-- Hierarchy visualization will be generated by JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 1847 The Obsidian Circle. All rights reserved.</p>
        <p class="footer-quote">"In darkness, we find the light."</p>
    </footer>

    <!-- Member Detail Modal -->
    <div id="member-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            <div class="modal-body" id="modal-body">
                <!-- Modal content will be injected by JS -->
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="clock-tick" loop>
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleQo6l9/Ss2QdBz2Y3dKyaB8F" type="audio/wav">
    </audio>

    <script src="scripts.js"></script>
</body>
</html>
