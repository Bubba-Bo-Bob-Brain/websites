<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnum Opus | The Alchemical Laboratory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Atmospheric Grain & Texture Overlay -->
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <!-- The Celestial Background (Stars, Constellations, Zodiac) -->
    <section class="celestial-sphere" aria-hidden="true">
        <div class="constellation-layer" id="constellations"></div>
        <div class="zodiac-ring"></div>
    </section>

    <!-- The Main Workbench Interface -->
    <main class="workbench">
        
        <!-- The Codex: A living manuscript on the side -->
        <aside class="codex" id="codex">
            <div class="parchment-texture"></div>
            <header class="codex-header">
                <h1 class="latin-title">Opus Magnum</h1>
                <p class="subtitle">Liber Secretorum</p>
            </header>
            <div class="codex-content">
                <div id="stage-description" class="manuscript-text">
                    <!-- Content injected via JS based on stage -->
                    <p class="initial-cap">I</p>
                    <p class="text-body">The descent into the darkness of the soul. Dissolve the ego to find the essence.</p>
                </div>
                <div class="marginalia">
                    <span class="latin-note">Solve et Coagula</span>
                    <svg class="sigil-small" viewBox="0 0 100 100">
                        <path d="M50 10 L90 90 L10 90 Z" fill="none" stroke="currentColor" stroke-width="1"/>
                    </svg>
                </div>
            </div>
            <div class="codex-footer">
                <div class="ink-stain"></div>
            </div>
        </aside>

        <!-- The Central Ritual Area -->
        <section class="ritual-chamber">
            
            <!-- The Great Transmutation Circle -->
            <div class="transmutation-circle-container" id="circle-engine">
                <div class="outer-ring ring-1">
                    <div class="sigil" data-symbol="sun">☉</div>
                    <div class="sigil" data-symbol="moon">☾</div>
                    <div class="sigil" data-symbol="mars">♂</div>
                    <div class="sigil" data-symbol="jupiter">♃</div>
                </div>
                <div class="middle-ring ring-2">
                    <div class="geometry-pattern"></div>
                </div>
                <div class="inner-ring ring-3">
                    <div class="core-element" id="philosophers-stone-core"></div>
                </div>
                <!-- Decorative geometric lines connecting rings -->
                <svg class="geometry-overlay" viewBox="0 0 500 500">
                    <circle cx="250" cy="250" r="200" class="geo-line" />
                    <circle cx="250" cy="250" r="150" class="geo-line" />
                    <path d="M250 50 L250 450 M50 250 L450 250" class="geo-line" />
                </svg>
            </div>

            <!-- The Crucible & Elemental Interaction Area -->
            <div class="alchemical-tools">
                <div class="crucible-container">
                    <div class="crucible-liquid" id="crucible-liquid"></div>
                    <div class="crucible-vessel"></div>
                    <div class="steam-particles" id="steam-container"></div>
                </div>

                <div class="control-panel">
                    <button id="transmute-btn" class="alchemical-button">
                        <span class="btn-text">Perform Transmutation</span>
                        <div class="btn-glow"></div>
                    </button>
                    <div class="stage-indicator">
                        <span class="current-stage-label">Current Phase:</span>
                        <span id="stage-name" class="stage-name">Nigredo</span>
                    </div>
                </div>
            </div>

        </section>

        <!-- Floating Ritual Elements (Interactions) -->
        <div class="floating-elements">
            <div class="element-item" data-type="sulfur" title="Sulfur">🜍</div>
            <div class="element-item" data-type="mercury" title="Mercury">☿</div>
            <div class="element-item" data-type="salt" title="Salt">🜔</div>
        </div>

    </main>

    <!-- Audio elements (Visualized through UI, actual audio handled in JS) -->
    <div class="audio-status" aria-hidden="true">
        <div class="sound-wave"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
