<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Wayfinder | The Art of Polynesian Navigation</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing a distinctive serif and a display-style font via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Grainy Texture Overlay for Tapa feel -->
    <div class="texture-overlay"></div>
    <div class="vignette"></div>

    <!-- Custom Cursor -->
    <div id="custom-cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-ring"></div>
    </div>

    <!-- Main Immersive Container -->
    <main id="wayfinder-app">
        
        <!-- The Celestial Sphere (Background/Parallax) -->
        <div id="star-field">
            <div class="star-layer layer-1"></div>
            <div class="star-layer layer-2"></div>
            <div class="star-layer layer-3"></div>
            <div class="nebula"></div>
        </div>

        <!-- The Navigational Map Canvas -->
        <div id="map-canvas">
            <!-- Ocean Swell Patterns (SVG) -->
            <svg class="ocean-swells" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
                <path class="wave" d="M0,500 Q250,400 500,500 T1000,500" />
                <path class="wave" d="M0,600 Q250,500 500,600 T1000,600" />
                <path class="wave" d="M0,400 Q250,300 500,400 T1000,400" />
            </svg>

            <!-- Wayfinding Elements -->
            <div class="map-elements">
                <!-- Star Houses / Compass Rose -->
                <div class="star-house-container" id="compass-rose">
                    <!-- Generated via JS, but structural placeholder here -->
                    <div class="house-label" style="--angle: 0deg">East</div>
                    <div class="house-label" style="--angle: 90deg">North</div>
                    <div class="house-label" style="--angle: 180deg">West</div>
                    <div class="house-label" style="--angle: 270deg">South</div>
                </div>

                <!-- Interactive Nav-Points (Islands & Stars) -->
                <div class="nav-point" data-type="island" data-name="Hawaiki" style="top: 20%; left: 30%;">
                    <div class="tiki-marker"></div>
                    <span class="point-label">Hawaiki</span>
                </div>
                <div class="nav-point" data-type="island" data-name="Aotearoa" style="top: 60%; left: 15%;">
                    <div class="tiki-marker"></div>
                    <span class="point-label">Aotearoa</span>
                </div>
                <div class="nav-point" data-type="island" data-name="Tahiti" style="top: 40%; left: 60%;">
                    <div class="tiki-marker"></div>
                    <span class="point-label">Tahiti</span>
                </div>
                <div class="nav-point" data-type="star" data-name="Hokule'a" style="top: 15%; left: 50%;">
                    <div class="star-glow"></div>
                    <span class="point-label">Hokule'a</span>
                </div>
                <div class="nav-point" data-type="star" data-name="Southern Cross" style="top: 80%; left: 45%;">
                    <div class="star-glow"></div>
                    <span class="point-label">Southern Cross</span>
                </div>

                <!-- SVG for drawing the paths (connect-the-dots) -->
                <svg id="path-overlay">
                    <polyline id="voyage-path" points="" />
                </svg>
            </div>
        </div>

        <!-- HUD / User Interface -->
        <nav class="hud">
            <div class="hud-top">
                <div class="brand">
                    <h1>Celestial<span>Voyager</span></h1>
                    <p>The Sacred Art of Wayfinding</p>
                </div>
                <div class="nav-controls">
                    <button class="hud-btn" data-action="stars">Star Houses</button>
                    <button class="hud-btn" data-action="currents">Ocean Currents</button>
                    <button class="hud-btn" data-action="islands">Island Chains</button>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="info-panel" id="info-panel">
                    <div class="panel-content">
                        <h2 id="panel-title">Welcome, Navigator</h2>
                        <p id="panel-text">Hover over the stars or carved markers to reveal the secrets of the Pacific. Follow the swells and the celestial houses to find your way home.</p>
                    </div>
                    <div class="tapa-decoration"></div>
                </div>
            </div>
        </nav>

    </main>

    <script src="scripts.js"></script>
</body>
</html>
