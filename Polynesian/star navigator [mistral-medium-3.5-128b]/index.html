<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polynesian Celestial Wayfinding</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Playfair+Display:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Layers -->
  <div class="background">
    <div class="tapa-cloth"></div>
    <div class="ocean">
      <div class="wave-layer wave-layer-1"></div>
      <div class="wave-layer wave-layer-2"></div>
      <div class="wave-layer wave-layer-3"></div>
    </div>
    <div class="star-field">
      <div class="star" data-constellation="maui-hook"></div>
      <div class="star" data-constellation="maui-hook"></div>
      <div class="star" data-constellation="maui-hook"></div>
      <div class="star" data-constellation="maui-hook"></div>
      <div class="star" data-constellation="te-potiki"></div>
      <div class="star" data-constellation="te-potiki"></div>
      <div class="star" data-constellation="te-potiki"></div>
      <div class="star" data-constellation="te-iki"></div>
      <div class="star" data-constellation="te-iki"></div>
      <div class="star" data-constellation="te-iki"></div>
      <div class="star" data-constellation="te-iki"></div>
      <div class="star" data-constellation="whale"></div>
      <div class="star" data-constellation="whale"></div>
      <div class="star" data-constellation="whale"></div>
      <div class="star" data-constellation="whale"></div>
      <div class="star" data-constellation="whale"></div>
    </div>
    <div class="bioluminescent-trail"></div>
  </div>

  <!-- Main Content -->
  <main class="wayfinding-chart">
    <!-- Tiki Compass (Center) -->
    <div class="tiki-compass">
      <div class="compass-ring"></div>
      <div class="compass-center">
        <div class="tiki-motif tiki-north"></div>
        <div class="tiki-motif tiki-east"></div>
        <div class="tiki-motif tiki-south"></div>
        <div class="tiki-motif tiki-west"></div>
      </div>
      <div class="compass-arm north"></div>
      <div class="compass-arm east"></div>
      <div class="compass-arm south"></div>
      <div class="compass-arm west"></div>
    </div>

    <!-- Island Chains -->
    <div class="island-chain hawaii">
      <div class="island" data-island="hawaii"></div>
      <div class="island-label">Hawaiʻi</div>
    </div>
    <div class="island-chain tahiti">
      <div class="island" data-island="tahiti"></div>
      <div class="island-label">Tahiti</div>
    </div>
    <div class="island-chain rapa-nui">
      <div class="island" data-island="rapa-nui"></div>
      <div class="island-label">Rapa Nui</div>
    </div>
    <div class="island-chain aotearoa">
      <div class="island" data-island="aotearoa"></div>
      <div class="island-label">Aotearoa</div>
    </div>
    <div class="island-chain fiji">
      <div class="island" data-island="fiji"></div>
      <div class="island-label">Fiji</div>
    </div>

    <!-- Constellation Lines (Hidden by Default) -->
    <svg class="constellation-lines" width="100%" height="100%">
      <line class="constellation-line maui-hook" x1="0" y1="0" x2="0" y2="0" />
      <line class="constellation-line te-potiki" x1="0" y1="0" x2="0" y2="0" />
      <line class="constellation-line te-iki" x1="0" y1="0" x2="0" y2="0" />
      <line class="constellation-line whale" x1="0" y1="0" x2="0" y2="0" />
    </svg>

    <!-- Ocean Currents (Animated Paths) -->
    <div class="ocean-current current-1"></div>
    <div class="ocean-current current-2"></div>
    <div class="ocean-current current-3"></div>
  </main>

  <!-- UI Controls -->
  <div class="controls">
    <button class="btn-toggle-constellations">Show Star Paths</button>
    <button class="btn-reset">Reset View</button>
    <div class="legend">
      <div class="legend-item">
        <span class="legend-color star-path"></span>
        <span>Star Paths</span>
      </div>
      <div class="legend-item">
        <span class="legend-color ocean-current"></span>
        <span>Currents</span>
      </div>
      <div class="legend-item">
        <span class="legend-color island"></span>
        <span>Islands</span>
      </div>
    </div>
  </div>

  <!-- Decorative Elements -->
  <div class="tapa-border top-left"></div>
  <div class="tapa-border top-right"></div>
  <div class="tapa-border bottom-left"></div>
  <div class="tapa-border bottom-right"></div>
  <div class="carved-frame"></div>

  <!-- Title & Description -->
  <header class="chart-header">
    <h1 class="chart-title">Te Ara o ngā Whetū</h1>
    <p class="chart-subtitle">The Path of the Stars</p>
    <p class="chart-description">
      Ancient Polynesian navigators crossed vast oceans using the stars, waves, and winds.
      Hover over the stars to reveal constellations, and follow the paths of the ancestors.
    </p>
  </header>

  <script src="scripts.js"></script>
</body>
</html>
