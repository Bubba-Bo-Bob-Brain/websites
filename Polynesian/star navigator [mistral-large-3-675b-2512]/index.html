<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polynesian Celestial Wayfinding Chart</title>
  <meta name="description" content="An interactive recreation of ancient Polynesian navigation charts, blending star paths, ocean currents, and tapa cloth aesthetics.">
  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts (unique, characterful typography) -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=IM+ Fell+English+SC&family=UnifrakturMaguntia&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background: Deep space gradient with layered stars -->
  <div class="background">
    <div class="stars" id="stars-layer-1"></div>
    <div class="stars" id="stars-layer-2"></div>
    <div class="stars" id="stars-layer-3"></div>
  </div>

  <!-- Main Chart Container: Tapa cloth texture with navigation elements -->
  <div class="chart-container">
    <!-- Tapa cloth canvas with grid lines -->
    <div class="tapa-canvas">
      <div class="tapa-grid"></div>

      <!-- Ocean currents (SVG paths) -->
      <svg class="ocean-currents" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="wave-pattern" patternUnits="userSpaceOnUse" width="50" height="50">
            <path d="M0 25 Q 12.5 12.5 25 25 T 50 25" stroke="rgba(100, 200, 255, 0.4)" stroke-width="0.5" fill="none" />
          </pattern>
        </defs>
        <path class="current" d="M100 100 Q 300 200 500 150 T 900 100" />
        <path class="current" d="M800 600 Q 600 500 400 550 T 200 600" />
        <path class="current" d="M200 400 Q 400 300 600 350 T 1000 400" />
        <rect width="100%" height="100%" fill="url(#wave-pattern)" opacity="0.1" />
      </svg>

      <!-- Star paths (SVG paths) -->
      <svg class="star-paths" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <path class="star-path" d="M150 200 L 300 150 L 450 250 L 600 200" data-constellation="Manaiakalani (The Fishhook)" />
        <path class="star-path" d="M800 100 L 900 200 L 1000 150 L 1100 250" data-constellation="Hōkūleʻa (Arcturus)" />
        <path class="star-path" d="M200 500 L 350 450 L 500 500 L 650 450" data-constellation="Hikianalia (Spica)" />
      </svg>

      <!-- Islands (Tiki markers) -->
      <div class="island-markers">
        <div class="island" style="--x: 10%; --y: 20%;" data-name="Hawaiʻi" data-lore="Birthplace of the navigator Hawaiʻiloa."></div>
        <div class="island" style="--x: 40%; --y: 30%;" data-name="Tahiti" data-lore="Sacred to the god Oro."></div>
        <div class="island" style="--x: 70%; --y: 15%;" data-name="Sāmoa" data-lore="Center of Polynesian voyaging."></div>
        <div class="island" style="--x: 85%; --y: 40%;" data-name="Aotearoa" data-lore="Land of the Long White Cloud."></div>
        <div class="island" style="--x: 25%; --y: 60%;" data-name="Rapa Nui" data-lore="Easter Island moai gaze at the stars."></div>
      </div>

      <!-- Constellations (interactive) -->
      <div class="constellations">
        <div class="constellation" data-name="Manaiakalani" style="--x: 150; --y: 200;">
          <div class="star" style="--x: 0; --y: 0;"></div>
          <div class="star" style="--x: 150; --y: -50;"></div>
          <div class="star" style="--x: 300; --y: 50;"></div>
          <div class="star" style="--x: 450; --y: 0;"></div>
        </div>
        <div class="constellation" data-name="Hōkūleʻa" style="--x: 800; --y: 100;">
          <div class="star" style="--x: 0; --y: 0;"></div>
          <div class="star" style="--x: 100; --y: 100;"></div>
          <div class="star" style="--x: 200; --y: 50;"></div>
        </div>
      </div>

      <!-- Tiki-style legend/controls -->
      <div class="controls">
        <button class="tiki-button" id="toggle-constellations" title="Toggle constellations">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L8 8H4L8 14L12 8L16 14L20 8H16L12 2Z" fill="currentColor" />
          </svg>
        </button>
        <button class="tiki-button" id="toggle-ocean" title="Toggle ocean currents">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12C1 12 3 8 6 8C9 8 11 12 14 12C17 12 19 8 22 8C22 8 24 12 24 12" stroke="currentColor" stroke-width="2" fill="none" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Star Dome (rotating parallax) -->
  <div class="star-dome">
    <div class="dome-layer" id="dome-layer-1"></div>
    <div class="dome-layer" id="dome-layer-2"></div>
    <div class="dome-layer" id="dome-layer-3"></div>
  </div>

  <!-- Bioluminescent wake trail (canvas) -->
  <canvas class="wake-trail" id="wake-trail"></canvas>

  <!-- Tooltip for islands/constellations -->
  <div class="tooltip" id="tooltip"></div>

  <script src="scripts.js"></script>
</body>
</html>
