<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te Poutama o te Moana Nui — Polynesian Celestial Wayfinding Chart</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Star Field Canvas -->
  <canvas id="starCanvas"></canvas>

  <!-- Main Chart Container -->
  <main class="chart">

    <!-- Header: Canoe Prow -->
    <header class="chart-header">
      <div class="header-tiki left-tiki"></div>
      <h1 class="chart-title">Te Poutama<br><span class="subtitle">o te Moana Nui</span></h1>
      <div class="header-tiki right-tiki"></div>
    </header>

    <!-- Navigation Toolbar -->
    <nav class="nav-bar">
      <button class="nav-btn active" data-mode="stars">&#9733; Stars</button>
      <button class="nav-btn" data-mode="currents">&#8768; Currents</button>
      <button class="nav-btn" data-mode="waves">&#8769; Swells</button>
      <button class="nav-btn" data-mode="islands">&#127754; Islands</button>
    </nav>

    <!-- Central Wayfinding Chart Area -->
    <section class="chart-area">
      <!-- Star Dome (SVG-based) -->
      <svg class="star-dome" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="domeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255, 215, 150, 0.06)"/>
            <stop offset="100%" stop-color="rgba(0, 20, 60, 0)"/>
          </radialGradient>
        </defs>
        <circle cx="400" cy="400" r="380" fill="url(#domeGlow)" class="dome-base"/>
        <g class="star-constellations" id="constellationGroup"></g>
        <g class="star-points" id="starGroup"></g>
        <!-- Navigator's Path Lines -->
        <g class="wayfinding-lines" id="wayfindingGroup"></g>
        <!-- Island Markers -->
        <g class="island-markers" id="islandGroup"></g>
        <!-- Ocean Currents (animated paths) -->
        <g class="ocean-currents" id="currentGroup"></g>
        <!-- Wave Swell Patterns -->
        <g class="wave-swells" id="waveGroup"></g>
        <!-- Carved Navigation Markers (tiki poles) -->
        <g class="nav-markers" id="markerGroup"></g>
      </svg>

      <!-- Bioluminescent Wake Trail Overlay -->
      <canvas id="wakeCanvas" class="wake-overlay"></canvas>
    </section>

    <!-- Legend Panel -->
    <aside class="legend-panel">
      <h3 class="legend-title">Wayfinder's Legend</h3>
      <ul class="legend-list">
        <li><span class="legend-icon star-icon"></span> Guiding Stars</li>
        <li><span class="legend-icon current-icon"></span> Ocean Currents</li>
        <li><span class="legend-icon swell-icon"></span> Wave Swells</li>
        <li><span class="legend-icon island-icon"></span> Island Chains</li>
        <li><span class="legend-icon marker-icon"></span> Navigation Markers</li>
      </ul>
      <div class="compass-rose">
        <div class="compass-needle"></div>
        <span class="compass-label n">N</span>
        <span class="compass-label s">S</span>
        <span class="compass-label e">E</span>
        <span class="compass-label w">W</span>
      </div>
    </aside>

    <!-- Footer: Carved Wood Panel -->
    <footer class="chart-footer">
      <div class="footer-carving left-carving"></div>
      <p class="footer-text">&#9996; Navigate by the stars, feel the swell, read the ocean.</p>
      <div class="footer-carving right-carving"></div>
    </footer>

  </main>

  <script src="scripts.js"></script>
</body>
</html>
