<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLYNESIAN CELESTIAL WAYFINDING CHART</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main navigation chart container -->
    <div class="wayfinding-chart">
        <!-- Star field background -->
        <div class="star-field">
            <div class="stars"></div>
            <div class="constellation-lines"></div>
        </div>
        
        <!-- Ocean layer with wave patterns -->
        <div class="ocean-layer">
            <div class="ocean-swells">
                <div class="swell-1"></div>
                <div class="swell-2"></div>
                <div class="swell-3"></div>
            </div>
        </div>
        
        <!-- Island chains -->
        <div class="island-chain">
            <div class="island main-island">
                <div class="tiki-carving tiki-1"></div>
                <div class="island-name">Hawaiki</div>
            </div>
            <div class="island secondary-island">
                <div class="tiki-carving tiki-2"></div>
                <div class="island-name">Rarotonga</div>
            </div>
            <div class="island tertiary-island">
                <div class="tiki-carving tiki-3"></div>
                <div class="island-name">Aotearoa</div>
            </div>
            <div class="island quaternary-island">
                <div class="tiki-carving tiki-4"></div>
                <div class="island-name">Tahiti</div>
            </div>
        </div>
        
        <!-- Star paths and navigation routes -->
        <div class="navigation-routes">
            <div class="star-path path-1"></div>
            <div class="star-path path-2"></div>
            <div class="star-path path-3"></div>
            <div class="star-point active-star-point"></div>
        </div>
        
        <!-- Bioluminescent wake effect -->
        <div class="bioluminescent-wake">
            <div class="wake-particle particle-1"></div>
            <div class="wake-particle particle-2"></div>
            <div class="wake-particle particle-3"></div>
        </div>
        
        <!-- Carved wooden navigation markers -->
        <div class="navigation-markers">
            <div class="marker marker-1">
                <div class="marker-symbol">♦</div>
            </div>
            <div class="marker marker-2">
                <div class="marker-symbol">♦</div>
            </div>
            <div class="marker marker-3">
                <div class="marker-symbol">♦</div>
            </div>
        </div>
        
 <!-- Rotating star dome overlay -->
        <div class="star-dome-overlay">
            <div class="star-dome">
                <div class="dome-star star-1"></div>
                <div class="dome-star star-2"></div>
                <div class="dome-star star-3"></div>
                <div class="dome-star star-4"></div>
                <div class="dome-star star-5"></div>
            </div>
        </div>
        
        <!-- Information panel -->
        <div class="info-panel">
            <h1 class="title">POLYNESIAN WAYFINDING CHART</h1>
            <p class="subtitle">Ancient Navigation Knowledge of the Pacific</p>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color star-color"></div>
                    <span>Star Paths</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color wave-color"></div>
                    <span>Ocean Currents</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color island-color"></div>
                    <span>Island Chains</span>
                </div>
            </div>
        </div>
        
        <!-- Interactive constellation dots -->
        <div class="constellation-dots">
            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="dot dot-3"></div>
            <div class="dot dot-4"></div>
            <div class="dot dot-5"></div>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
