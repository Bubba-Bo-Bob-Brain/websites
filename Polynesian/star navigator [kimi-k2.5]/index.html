<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hōkūleʻa - Celestial Wayfinding Chart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Sans+Tagalog&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Initial Loading Screen -->
    <div id="loading-screen" class="loading-overlay">
        <div class="tapa-loader">
            <div class="loader-pattern"></div>
            <span class="loading-text">Charting the Heavens...</span>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="wayfinding-app" class="app-container">
        
        <!-- Layer 1: Celestial Star Dome -->
        <div id="celestial-dome" class="celestial-layer">
            <div class="star-field" id="star-field"></div>
            <div class="milky-way" id="milky-way"></div>
            <div class="celestial-equator"></div>
        </div>

        <!-- Layer 2: Deep Ocean Background -->
        <div id="ocean-depths" class="ocean-layer">
            <div class="water-gradient"></div>
            <div class="bioluminescent-layer" id="bio-layer"></div>
        </div>

        <!-- Layer 3: Animated Ocean Swells -->
        <div id="swell-container" class="swell-layer">
            <svg class="swell-waves" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <pattern id="wavePattern" x="0" y="0" width="100" height="20" patternUnits="userSpaceOnUse">
                        <path d="M0,10 Q25,0 50,10 T100,10" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
                    </pattern>
                </defs>
                <g id="swell-group-1" class="swell-group">
                    <path class="swell-line" d="M0,400 Q300,350 600,400 T1200,400" />
                    <path class="swell-line" d="M0,420 Q300,370 600,420 T1200,420" />
                    <path class="swell-line" d="M0,440 Q300,390 600,440 T1200,440" />
                </g>
                <g id="swell-group-2" class="swell-group" transform="translate(0, 100)">
                    <path class="swell-line" d="M0,400 Q400,360 800,400 T1200,380" />
                    <path class="swell-line" d="M0,430 Q400,390 800,430 T1200,410" />
                </g>
            </svg>
        </div>

        <!-- Layer 4: Navigation Chart Canvas -->
        <div id="chart-container" class="chart-layer">
            <svg id="wayfinding-chart" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <!-- Tapa Cloth Texture Filter -->
                    <filter id="tapaTexture" x="0%" y="0%" width="100%" height="100%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
                        <feDiffuseLighting in="noise" lighting-color="#d4a574" surfaceScale="2" result="diffLight">
                            <feDistantLight azimuth="45" elevation="60"/>
                        </feDiffuseLighting>
                        <feComposite in="SourceGraphic" in2="diffLight" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"/>
                    </filter>
                    
                    <!-- Wood Carving Filter -->
                    <filter id="woodCarve">
                        <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turbulence"/>
                        <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
                        <feGaussianBlur stdDeviation="0.5"/>
                        <feSpecularLighting surfaceScale="2" specularConstant="0.8" specularExponent="15" lighting-color="#8b6914" result="specular">
                            <fePointLight x="100" y="100" z="200"/>
                        </feSpecularLighting>
                        <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular"/>
                        <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
                    </filter>

                    <!-- Glow Effect -->
                    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>

                    <!-- Gradient for Islands -->
                    <radialGradient id="islandGradient" cx="50%" cy="50%">
                        <stop offset="0%" stop-color="#2d5016" />
                        <stop offset="70%" stop-color="#1a3009" />
                        <stop offset="100%" stop-color="#0d1a04" />
                    </radialGradient>
                </defs>

                <!-- Chart Background with Tapa Pattern -->
                <rect x="0" y="0" width="1000" height="1000" fill="#1a1a2e" opacity="0.4" />
                <rect x="50" y="50" width="900" height="900" fill="#f4e4c1" opacity="0.05" filter="url(#tapaTexture)" />

                <!-- Ocean Current Arrows -->
                <g id="currents-layer" class="currents">
                    <path class="current-path" d="M 100,800 Q 300,700 500,750 T 900,600" marker-end="url(#arrowhead)"/>
                    <path class="current-path" d="M 200,200 Q 400,300 600,250 T 800,300" marker-end="url(#arrowhead)"/>
                    <path class="current-path" d="M 800,100 Q 700,300 750,500 T 700,800" marker-end="url(#arrowhead)"/>
                </g>

                <!-- Star Paths (Navigation Lines) -->
                <g id="star-paths" class="navigation-lines">
                    <!-- Hōkūleʻa (Arcturus) Path -->
                    <path class="star-line" id="path-arcturus" d="M 500,200 L 480,350 L 460,500 L 440,650" />
                    <!-- Hikianalia (Spica) Path -->
                    <path class="star-line" id="path-spica" d="M 600,180 L 580,320 L 560,460 L 540,600" />
                    <!-- Keāli'iokonaikalewa (Canopus) Path -->
                    <path class="star-line" id="path-canopus" d="M 300,800 L 320,650 L 340,500 L 360,350" />
                    <!-- Manaiakalani (Scorpio) Path -->
                    <path class="star-line" id="path-scorpio" d="M 700,300 L 680,450 L 660,600 L 640,750" />
                    <!-- Kaheka (Southern Cross) Path -->
                    <path class="star-line" id="path-cross" d="M 800,700 L 750,600 L 700,500 L 650,400" />
                </g>

                <!-- Islands -->
                <g id="islands-layer" class="islands">
                    <!-- Hawai'i -->
                    <g class="island-group" data-name="Hawai'i" data-info="Northernmost archipelago, home of the navigators">
                        <circle cx="480" cy="350" r="15" class="island-dot" />
                        <circle cx="480" cy="350" r="25" class="island-ripple" />
                        <text x="480" y="340" class="island-label">Hawai'i</text>
                    </g>
                    
                    <!-- Tahiti -->
                    <g class="island-group" data-name="Tahiti" data-info="Society Islands, the center of the Polynesian triangle">
                        <circle cx="560" cy="460" r="18" class="island-dot" />
                        <circle cx="560" cy="460" r="30" class="island-ripple" />
                        <text x="560" y="445" class="island-label">Tahiti</text>
                    </g>
                    
                    <!-- Rapa Nui -->
                    <g class="island-group" data-name="Rapa Nui" data-info="Easternmost point, the land of the moai">
                        <circle cx="800" cy="600" r="12" class="island-dot" />
                        <circle cx="800" cy="600" r="20" class="island-ripple" />
                        <text x="800" y="590" class="island-label">Rapa Nui</text>
                    </g>
                    
                    <!-- Aotearoa -->
                    <g class="island-group" data-name="Aotearoa" data-info="Southernmost land, the long white cloud">
                        <circle cx="300" cy="750" r="20" class="island-dot" />
                        <circle cx="300" cy="750" r="35" class="island-ripple" />
                        <text x="300" y="735" class="island-label">Aotearoa</text>
                    </g>
                    
                    <!-- Sāmoa -->
                    <g class="island-group" data-name="Sāmoa" data-info="Heart of Polynesia, navigator's homeland">
                        <circle cx="700" cy="300" r="14" class="island-dot" />
                        <circle cx="700" cy="300" r="22" class="island-ripple" />
                        <text x="700" y="290" class="island-label">Sāmoa</text>
                    </g>
                </g>

                <!-- Constellations (Interactive) -->
                <g id="constellations" class="constellation-layer">
                    <!-- Southern Cross -->
                    <g class="constellation" id="southern-cross" data-stars="4">
                        <line class="constellation-line" x1="750" y1="700" x2="770" y2="720" />
                        <line class="constellation-line" x1="770" y1="720" x2="790" y2="700" />
                        <line class="constellation-line" x1="790" y1="700" x2="770" y2="680" />
                        <line class="constellation-line" x1="770" y1="680" x2="750" y2="700" />
                        <circle cx="750" cy="700" r="4" class="star-point" data-star="acux" />
                        <circle cx="770" cy="720" r="4" class="star-point" data-star="becrux" />
                        <circle cx="790" cy="700" r="4" class="star-point" data-star="gacrux" />
                        <circle cx="770" cy="680" r="4" class="star-point" data-star="decux" />
                    </g>

                    <!-- Scorpio -->
                    <g class="constellation" id="scorpio" data-stars="7">
                        <polyline class="constellation-line" points="680,280 690,320 685,360 670,400 650,430 630,450 610,460" fill="none"/>
                        <circle cx="680" cy="280" r="5" class="star-point" data-star="antares" />
                        <circle cx="690" cy="320" r="3" class="star-point" />
                        <circle cx="685" cy="360" r="3" class="star-point" />
                        <circle cx="670" cy="400" r="3" class="star-point" />
                        <circle cx="650" cy="430" r="3" class="star-point" />
                        <circle cx="630" cy="450" r="3" class="star-point" />
                        <circle cx="610" cy="460" r="4" class="star-point" />
                    </g>

                    <!-- Navigation Star Points -->
                    <g class="nav-stars">
                        <circle cx="500" cy="200" r="6" class="nav-star" id="star-arcturus" data-name="Hōkūleʻa" />
                        <circle cx="600" cy="180" r="5" class="nav-star" id="star-spica" data-name="Hikianalia" />
                        <circle cx="300" cy="800" r="6" class="nav-star" id="star-canopus" data-name="Keāli'iokonaikalewa" />
                        <circle cx="700" cy="300" r="5" class="nav-star" id="star-scorpio" data-name="Manaiakalani" />
                    </g>
                </g>

                <!-- Wave Pattern Indicators (Traditional) -->
                <g id="wave-indicators" class="wave-patterns">
                    <path class="wave-symbol" d="M 100,100 Q 110,90 120,100 T 140,100" transform="rotate(45, 120, 100)"/>
                    <path class="wave-symbol" d="M 850,150 Q 860,140 870,150 T 890,150" transform="rotate(-30, 870, 150)"/>
                    <path class="wave-symbol" d="M 150,850 Q 160,840 170,850 T 190,850" transform="rotate(60, 170, 850)"/>
                    <path class="wave-symbol" d="M 900,850 Q 910,840 920,850 T 940,850" transform="rotate(-45, 920, 850)"/>
                </g>

                <!-- Markers -->
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2" opacity="0.6"/>
                    </marker>
                </defs>
            </svg>
        </div>

        <!-- Layer 5: Wooden Navigation Markers (Tiki/Carved) -->
        <div id="wooden-markers" class="markers-layer">
            <div class="nav-marker" id="marker-north" data-direction="N">
                <div class="carved-pattern"></div>
                <span class="marker-symbol">↑</span>
            </div>
            <div class="nav-marker" id="marker-east" data-direction="E">
                <div class="carved-pattern"></div>
                <span class="marker-symbol">→</span>
            </div>
            <div class="nav-marker" id="marker-south" data-direction="S">
                <div class="carved-pattern"></div>
                <span class="marker-symbol">↓</span>
            </div>
            <div class="nav-marker" id="marker-west" data-direction="W">
                <div class="carved-pattern"></div>
                <span class="marker-symbol">←</span>
            </div>
        </div>

        <!-- Layer 6: Tapa Cloth Texture Overlay -->
        <div id="tapa-overlay" class="texture-layer"></div>

        <!-- UI Layer: Controls and Information -->
        <div id="ui-layer" class="interface-layer">
            <!-- Header -->
            <header class="chart-header">
                <h1 class="title-main">Hōkūleʻa</h1>
                <h2 class="title-sub">Star of Gladness</h2>
                <p class="title-description">Ancient Polynesian Celestial Navigation</p>
            </header>

            <!-- Navigation Controls -->
            <nav class="control-panel">
                <button class="control-btn" id="btn-rotate" aria-label="Toggle Star Rotation">
                    <span class="btn-icon">⟲</span>
                    <span class="btn-text">Stars</span>
                </button>
                <button class="control-btn" id="btn-currents" aria-label="Toggle Ocean Currents">
                    <span class="btn-icon">~</span>
                    <span class="btn-text">Currents</span>
                </button>
                <button class="control-btn" id="btn-constellations" aria-label="Show Constellations">
                    <span class="btn-icon">✦</span>
                    <span class="btn-text">Stars</span>
                </button>
                <button class="control-btn" id="btn-reset" aria-label="Reset View">
                    <span class="btn-icon">⌂</span>
                    <span class="btn-text">Home</span>
                </button>
            </nav>

            <!-- Information Panel (Hidden by default) -->
            <aside id="info-panel" class="info-card hidden">
                <div class="tapa-border">
                    <h3 id="info-title" class="info-heading">Navigation Point</h3>
                    <div id="info-content" class="info-body">
                        <p>Hover over stars, islands, or paths to learn ancient wayfinding knowledge.</p>
                    </div>
                    <div class="carved-ornament"></div>
                </div>
            </aside>

            <!-- Compass Rose -->
            <div class="compass-container">
                <div class="compass-rose" id="compass-rose">
                    <div class="compass-inner">
                        <div class="compass-star"></div>
                    </div>
                </div>
            </div>

            <!-- Coordinates Display -->
            <div class="coords-display">
                <span id="lat-display">00° 00' N</span>
                <span id="lon-display">000° 00' W</span>
            </div>
        </div>

        <!-- Cursor Trail Container -->
        <div id="cursor-trail" class="trail-layer"></div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
