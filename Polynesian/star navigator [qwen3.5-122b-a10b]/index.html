<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayfinder: The Celestial Path</title>
    
    <!-- Fonts: 'Cinzel Decorative' for that carved/ancient feel, 'Cormorant Garamond' for elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">

    <!-- CSS Link -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Ambient Background Elements -->
    <div class="tapa-overlay"></div>
    <div class="vignette"></div>

    <!-- The Main Interactive Canvas (Stars, Swells, Paths) -->
    <canvas id="wayfinder-canvas"></canvas>

    <!-- UI Overlay -->
    <main class="interface-layer">
        
        <!-- Header / Compass Rose -->
        <header class="hud-header">
            <div class="compass-rose">
                <div class="compass-ring"></div>
                <div class="compass-needle"></div>
                <div class="compass-center"></div>
            </div>
            <div class="title-block">
                <h1 class="main-title">WAYFINDER</h1>
                <p class="subtitle">Celestial Navigation System</p>
            </div>
            <div class="status-block">
                <span class="status-indicator active"></span>
                <span class="status-text">SIGNAL: STABLE</span>
            </div>
        </header>

        <!-- Navigation Controls (Wooden Stick Chart Style) -->
        <nav class="stick-chart-nav">
            <button class="nav-btn active" data-target="stars">
                <span class="icon">★</span>
                <span class="label">Stellar</span>
            </button>
            <button class="nav-btn" data-target="swells">
                <span class="icon">〰</span>
                <span class="label">Swell</span>
            </button>
            <button class="nav-btn" data-target="islands">
                <span class="icon">●</span>
                <span class="label">Land</span>
            </button>
        </nav>

        <!-- Information Panel (Hidden by default, slides in) -->
        <aside class="info-panel" id="info-panel">
            <div class="panel-border"></div>
            <div class="panel-content">
                <h2 id="panel-title">Select a Star</h2>
                <div class="divider"></div>
                <p id="panel-desc">Hover over the celestial dome to reveal navigational paths. Ancient knowledge encoded in light.</p>
                <div class="data-grid">
                    <div class="data-item">
                        <span class="label">Azimuth</span>
                        <span class="value" id="panel-azimuth">0°</span>
                    </div>
                    <div class="data-item">
                        <span class="label">Declination</span>
                        <span class="value" id="panel-dec">0°</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Decorative Corner Motifs -->
        <div class="motif top-left">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M0,0 L40,0 L40,40 M10,10 L30,10 L30,30 M20,20 L20,20" />
            </svg>
        </div>
        <div class="motif bottom-right">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M100,100 L60,100 L60,60 M90,90 L70,90 L70,70 M80,80 L80,80" />
            </svg>
        </div>

    </main>

    <!-- JavaScript Link -->
    <script src="scripts.js"></script>
</body>
</html>
