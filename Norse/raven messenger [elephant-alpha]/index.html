<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin's Raven Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Odin's Ravens -->
        <header class="header">
            <div class="raven-container">
                <div class="raven raven-1">
                    <div class="raven-body"></div>
                    <div class="raven-wing"></div>
                    <div class="raven-eye"></div>
                </div>
                <div class="raven raven-2">
                    <div class="raven-body"></div>
                    <div class="raven-wing"></div>
                    <div class="raven-eye"></div>
                </div>
            </div>
            <h1 class="title">ODIN'S MESSENGER</h1>
            <div class="realm-selector">
                <div class="yggdrasil-icon">
                    <div class="trunk"></div>
                    <div class="roots"></div>
                    <div class="branches"></div>
                </div>
                <select id="realmSelect" class="realm-dropdown">
                    <option value="asgard">Asgard</option>
                    <option value="midgard">Midgard</option>
                    <option value="helheim">Helheim</option>
                    <option value="alfheim">Alfheim</option>
                    <option value="jotunheim">Jotunheim</option>
                    <option value="muspelheim">Muspelheim</option>
                    <option value="niflheim">Niflheim</option>
                    <option value="valhalla">Valhalla</option>
                </select>
                <span class="realm-name" id="currentRealm">Asgard</span>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-history" id="chatHistory">
                <div class="system-message">
                    <span class="rune-icon">ᚠ</span>
                    <span class="message-text">The realms are aligned. Speak through the ravens.</span>
                    <span class="rune-icon">ᚢ</span>
                </div>
            </div>
            
            <!-- Runic Transliteration Toggle -->
            <div class="toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="runeToggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">ᚱᚢᚾᛁᚳ</span>
            </div>

            <!-- Message Input -->
            <div class="input-container">
                <textarea id="messageInput" placeholder="ᛁᛋᛚᛖ ᛗᛖᛋᛋᚨᚷᛖ ᛏᛟ ᛋᛖᚾᛞ... (Write your message in runes or text)"></textarea>
                <button id="sendButton" class="send-button">
                    <span class="send-icon">ᛋ</span>
                    Send
                </button>
            </div>
        </main>

        <!-- Bifrost Effect -->
        <div class="bifrost-overlay" id="bifrostOverlay"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
