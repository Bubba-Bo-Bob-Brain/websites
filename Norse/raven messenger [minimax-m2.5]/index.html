<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valhalla Messages | Odin's Raven Network</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Sans+Runic:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar - Yggdrasil Realm Selector -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="raven-icon">
                        <svg viewBox="0 0 100 100" class="raven-svg">
                            <path class="raven-body" d="M20,55 Q30,45 45,50 Q55,35 70,40 Q85,35 90,50 Q95,55 90,60 L85,65 Q80,70 70,65 Q60,75 45,70 Q30,75 20,65 Z" fill="#1a1a1a"/>
                            <path class="raven-wing" d="M45,55 Q50,45 60,48 Q70,42 75,50 Q65,55 55,58 Q48,60 45,55" fill="#2d2d2d"/>
                            <circle class="raven-eye" cx="75" cy="48" r="2" fill="#D4AF37"/>
                            <path class="raven-beak" d="M85,50 L95,53 L85,56 Z" fill="#D4AF37"/>
                        </svg>
                    </div>
                    <h1 class="logo-text">VALHALLA<br><span class="logo-sub">MESSENGERS</span></h1>
                </div>
            </div>
            
            <div class="yggdrasil-container">
                <h2 class="section-title">⟨ ᚱ ᛖ ᛊ ᚢ ᚢ ᛖ ᛊ ⟩</h2>
                <div class="yggdrasil-tree">
                    <!-- Yggdrasil branches as realm selectors -->
                    <button class="realm-btn realm-asgard active" data-realm="asgard" title="Asgard - Realm of the Aesir">
                        <span class="rune">ᚨ</span>
                        <span class="realm-name">Asgard</span>
                        <span class="realm-status"></span>
                    </button>
                    <button class="realm-btn realm-midgard" data-realm="midgard" title="Midgard - Realm of Humans">
                        <span class="rune">ᛗ</span>
                        <span class="realm-name">Midgard</span>
                        <span class="realm-status"></span>
                    </button>
                    <button class="realm-btn realm-jotunheim" data-realm="jotunheim" title="Jotunheim - Realm of Giants">
                        <span class="rune">ᛃ</span>
                        <span class="realm-name">Jotunheim</span>
                        <span class="realm-status"></span>
                    </button>
                    <button class="realm-btn realm-vanaheim" data-realm="vanaheim" title="Vanaheim - Realm of Vanir">
                        <span class="rune">ᚠ</span>
                        <span class="realm-name">Vanaheim</span>
                        <span class="realm-status"></span>
                    </button>
                    <button class="realm-btn realm-alfheim" data-realm="alfheim" title="Alfheim - Realm of Light Elves">
                        <span class="rune">ᛚ</span>
                        <span class="realm-name">Alfheim</span>
                        <span class="realm-status"></span>
                    </button>
                    <button class="realm-btn realm-helheim" data-realm="helheim" title="Helheim - Realm of the Dead">
                        <span class="rune">ᚺ</span>
                        <span class="realm-name">Helheim</span>
                        <span class="realm-status"></span>
                    </button>
                    <button class="realm-btn realm-niflheim" data-realm="niflheim" title="Niflheim - Realm of Ice Mist">
                        <span class="rune">ᚾ</span>
                        <span class="realm-name">Niflheim</span>
                        <span class="realm-status"></span>
                    </button>
                </div>
            </div>
            
            <div class="settings-panel">
                <h2 class="section-title">⟨ ᛋ ᛖ ᛏ ᚢ ᛈ ᛊ ⟩</h2>
                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="toggle-text">Runic Transliteration</span>
                        <input type="checkbox" id="runicToggle" class="runic-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="toggle-text">Raven Animations</span>
                        <input type="checkbox" id="ravenToggle" class="raven-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="toggle-text">Mystical Ambiance</span>
                        <input type="checkbox" id="ambianceToggle" class="ambiance-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="chat-container">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="realm-indicator">
                    <div class="bifrost-ring"></div>
                    <div class="current-realm-display">
                        <span class="current-rune" id="currentRune">ᚨ</span>
                        <div class="realm-info">
                            <h2 class="current-realm-name" id="realmName">Asgard</h2>
                            <span class="realm-description" id="realmDesc">The sacred realm of the Aesir gods</span>
                        </div>
                    </div>
                </div>
                <div class="header-ornament left">
                    <svg viewBox="0 0 50 50" class="ornament-svg">
                        <path d="M25,5 L25,45 M15,15 Q25,25 15,35 M35,15 Q25,25 35,35" stroke="#8B7355" stroke-width="2" fill="none"/>
                        <circle cx="25" cy="25" r="3" fill="#D4AF37"/>
                    </svg>
                </div>
                <div class="header-ornament right">
                    <svg viewBox="0 0 50 50" class="ornament-svg">
                        <path d="M25,5 L25,45 M15,15 Q25,25 15,35 M35,15 Q25,25 35,35" stroke="#8B7355" stroke-width="2" fill="none"/>
                        <circle cx="25" cy="25" r="3" fill="#D4AF37"/>
                    </svg>
                </div>
                <div class="online-counter">
                    <span class="online-dot"></span>
                    <span id="onlineCount">12</span> online in Asgard
                </div>
            </header>
            
            <!-- Chat Messages Area -->
            <div class="chat-messages" id="chatMessages">
                <div class="messages-container">
                    <!-- Messages will be populated by JavaScript -->
                    <!-- Sample messages showing the style -->
                </div>
                
                <!-- Raven Delivery Animation Container -->
                <div class="raven-delivery" id="ravenDelivery"></div>
            </div>
            
            <!-- Message Input Area -->
            <footer class="chat-input-area">
                <div class="input-frame">
                    <div class="input-ornament top-left"></div>
                    <div class="input-ornament top-right"></div>
                    <div class="input-ornament bottom-left"></div>
                    <div class="input-ornament bottom-right"></div>
                    
                    <div class="input-row">
                        <button class="rune-keyboard-btn" title="Runic Keyboard">
                            <span>ᚱ</span>
                        </button>
                        <input type="text" id="messageInput" class="message-input" placeholder="Scribe your message..." autocomplete="off">
                        <button class="send-btn" id="sendBtn" title="Send via Raven">
                            <svg viewBox="0 0 40 40" class="send-icon">
                                <path d="M5,20 L35,20 M25,10 L35,20 L25,30" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="input-footer">
                        <span class="runic-hint">Press Enter to send • ᚱ for runic input</span>
                    </div>
                </div>
            </footer>
        </main>
    </div>
    
    <!-- Floating Particles Container -->
    <div class="particles-container" id="particles"></div>
    
    <!-- Bifrost Transition Overlay -->
    <div class="bifrost-overlay" id="bifrostOverlay"></div>
    
    <script src="scripts.js"></script>
</body>
</html>
