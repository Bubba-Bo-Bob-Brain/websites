<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugin & Munin | The Divine Network</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing fonts for the mythic feel -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Ambient Overlays -->
    <div class="grain-overlay"></div>
    <div class="vignette"></div>
    <div class="bifrost-flash"></div>

    <main class="artifact-container">
        <!-- Decorative Outer Frame -->
        <div class="knotwork-border top"></div>
        <div class="knotwork-border bottom"></div>
        <div class="knotwork-border left"></div>
        <div class="knotwork-border right"></div>

        <!-- Sidebar: The Yggdrasil Navigator -->
        <aside class="yggdrasil-sidebar">
            <div class="sidebar-header">
                <img src="https://cdn-icons-png.flaticon.com/512/3504/3504058.png" alt="Odin's Eye" class="odin-eye">
                <h1>World Tree</h1>
            </div>
            
            <nav class="realm-tree">
                <div class="tree-node active" data-realm="asgard">
                    <span class="node-label">Asgard</span>
                    <div class="node-glow"></div>
                </div>
                <div class="tree-branch"></div>
                <div class="tree-node" data-realm="midgard">
                    <span class="node-label">Midgard</span>
                    <div class="node-glow"></div>
                </div>
                <div class="tree-branch"></div>
                <div class="tree-node" data-realm="helheim">
                    <span class="node-label">Helheim</span>
                    <div class="node-glow"></div>
                </div>
                <div class="tree-branch"></div>
                <div class="tree-node" data-realm="jotunheim">
                    <span class="node-label">Jotunheim</span>
                    <div class="node-glow"></div>
                </div>
                <div class="tree-branch"></div>
                <div class="tree-node" data-realm="vanaheim">
                    <span class="node-label">Vanaheim</span>
                    <div class="node-glow"></div>
                </div>
            </nav>

            <div class="sidebar-footer">
                <label class="rune-toggle">
                    <input type="checkbox" id="rune-switch">
                    <span class="slider"></span>
                    <span class="toggle-text">Runic Sight</span>
                </label>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <section class="divine-chat">
            <header class="chat-header">
                <div class="realm-info">
                    <h2 id="current-realm-name">Asgard</h2>
                    <p id="realm-description">The Golden Realm of the Aesir</p>
                </div>
                <div class="raven-status">
                    <div class="raven-indicator">
                        <span class="raven-name">Hugin</span>
                        <div class="status-dot pulse"></div>
                    </div>
                    <div class="raven-indicator">
                        <span class="raven-name">Munin</span>
                        <div class="status-dot pulse"></div>
                    </div>
                </div>
            </header>

            <div class="message-scroll" id="message-scroll">
                <!-- Example Messages -->
                <div class="message-plaque incoming" data-sender="Thor">
                    <div class="plaque-decoration"></div>
                    <div class="message-content">
                        <span class="sender-name">Thor</span>
                        <p class="text-content" data-latin="Who dares challenge the thunder in this realm?">Who dares challenge the thunder in this realm?</p>
                    </div>
                </div>

                <div class="message-plaque outgoing" data-sender="User">
                    <div class="plaque-decoration"></div>
                    <div class="message-content">
                        <span class="sender-name">You</span>
                        <p class="text-content" data-latin="Just seeking wisdom from the All-Father, Son of Odin.">Just seeking wisdom from the All-Father, Son of Odin.</p>
                    </div>
                </div>

                <div class="message-plaque incoming" data-sender="Loki">
                    <div class="plaque-decoration"></div>
                    <div class="message-content">
                        <span class="sender-name">Loki</span>
                        <p class="text-content" data-latin="Wisdom is a fickle thing... almost as fickle as my loyalty.">Wisdom is a fickle thing... almost as fickle as my loyalty.</p>
                    </div>
                </div>
            </div>

            <footer class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Carve your message into the void..."></textarea>
                    <button id="send-btn" class="raven-send-btn">
                        <span class="btn-text">Dispatch</span>
                        <div class="raven-icon"></div>
                    </button>
                </div>
            </footer>
        </section>
    </main>

    <!-- Raven Animation Layer -->
    <div id="raven-animation-container"></div>

    <script src="scripts.js"></script>
</body>
</html>
