<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yggdrasil Link | Odin's Eye</title>
    
    <!-- Fonts: Cinzel for headers (majestic), Cormorant Garamond for body (ancient text), and a Runic font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Background Elements -->
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <div class="bifrost-arc"></div>

    <!-- Main Layout -->
    <main class="app-container">
        
        <!-- Sidebar: The Roots of Yggdrasil -->
        <aside class="sidebar">
            <div class="brand">
                <div class="raven-icon">
                    <svg viewBox="0 0 100 100" fill="currentColor">
                        <path d="M50 20 C30 20 10 40 10 60 C10 80 30 90 50 90 C70 90 90 80 90 60 C90 40 70 20 50 20 Z M40 50 L60 50 M40 60 L60 60" />
                    </svg>
                </div>
                <h1>Yggdrasil<br><span class="sub">Link</span></h1>
            </div>

            <nav class="realm-nav">
                <div class="nav-header">Realms</div>
                <ul class="channel-list">
                    <li class="channel active" data-realm="asgard">
                        <span class="rune-glyph">ᚨ</span>
                        <span class="name">Asgard</span>
                        <span class="status-dot"></span>
                    </li>
                    <li class="channel" data-realm="midgard">
                        <span class="rune-glyph">ᛗ</span>
                        <span class="name">Midgard</span>
                        <span class="status-dot"></span>
                    </li>
                    <li class="channel" data-realm="jotunheim">
                        <span class="rune-glyph">ᛃ</span>
                        <span class="name">Jotunheim</span>
                        <span class="status-dot"></span>
                    </li>
                    <li class="channel" data-realm="alfheim">
                        <span class="rune-glyph">ᚫ</span>
                        <span class="name">Alfheim</span>
                        <span class="status-dot"></span>
                    </li>
                    <li class="channel" data-realm="helheim">
                        <span class="rune-glyph">ᚺ</span>
                        <span class="name">Helheim</span>
                        <span class="status-dot"></span>
                    </li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="avatar-frame">
                    <div class="avatar">OD</div>
                </div>
                <div class="user-info">
                    <span class="username">Odin</span>
                    <span class="title">All-Father</span>
                </div>
            </div>
        </aside>

        <!-- Chat Area: The Great Hall -->
        <section class="chat-interface">
            
            <!-- Header -->
            <header class="chat-header">
                <div class="header-content">
                    <h2 id="current-realm-name">Asgard</h2>
                    <p class="realm-desc">The Golden Realm • Divine Council</p>
                </div>
                <div class="header-actions">
                    <button id="runic-toggle" class="icon-btn" title="Toggle Runic Cipher">
                        <span class="rune-text">ᚠᚢᚦᚨᚱᚲ</span>
                        <span class="label">Cipher</span>
                    </button>
                    <button class="icon-btn" title="Settings">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4 1.65 1.65 0 0 0 7.17 19.7l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages Scroll Area -->
            <div class="messages-container" id="messages-container">
                <!-- Messages will be injected here by JS -->
            </div>

            <!-- Input Area -->
            <footer class="input-area">
                <div class="input-wrapper">
                    <div class="knotwork-border top"></div>
                    <textarea id="message-input" placeholder="Speak into the void..." rows="1"></textarea>
                    <div class="knotwork-border bottom"></div>
                </div>
                <button id="send-btn" class="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </footer>

        </section>
    </main>

    <!-- Raven Delivery Animation Container -->
    <div id="raven-overlay"></div>

    <script src="scripts.js"></script>
</body>
</html>
