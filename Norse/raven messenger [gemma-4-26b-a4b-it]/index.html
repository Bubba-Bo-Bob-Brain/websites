<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugin & Munin's Chronicle | Divine Messaging</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for a mythic feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Ambient Background Elements -->
    <div class="grain-overlay"></div>
    <div class="embers-container" id="embers"></div>
    <div class="bifrost-shimmer" id="bifrost"></div>

    <div class="app-container">
        
        <!-- Sidebar: Yggdrasil Realm Navigator -->
        <aside class="yggdrasil-sidebar">
            <div class="tree-root">
                <div class="root-icon">᛫</div>
                <nav class="realm-nav">
                    <div class="realm-item active" data-realm="asgard">
                        <span class="realm-rune">ᚦ</span>
                        <span class="realm-name">Asgard</span>
                        <div class="realm-glow"></div>
                    </div>
                    <div class="realm-item" data-realm="midgard">
                        <span class="realm-rune">ᛗ</span>
                        <span class="realm-name">Midgard</span>
                        <div class="realm-glow"></div>
                    </div>
                    <div class="realm-item" data-realm="jotunheim">
                        <span class="realm-rune">ᛃ</span>
                        <span class="realm-name">Jotunheim</span>
                        <div class="realm-glow"></div>
                    </div>
                    <div class="realm-item" data-realm="helheim">
                        <span class="realm-rune">ᚼ</span>
                        <span class="realm-name">Helheim</span>
                        <div class="realm-glow"></div>
                    </div>
                </nav>
                <div class="tree-canopy">
                    <div class="branch"></div>
                    <div class="branch"></div>
                </div>
            </div>
        </aside>

        <!-- Main Interface -->
        <section class="main-interface">
            
            <!-- Header: Divine Controls -->
            <header class="mythic-header">
                <div class="brand">
                    <h1 class="logo">Hugin & Munin's <span class="accent">Chronicle</span></h1>
                    <p class="subtitle">Whispers from the Nine Realms</p>
                </div>
                
                <div class="controls">
                    <button id="rune-toggle" class="btn-runic" title="Toggle Runic Transliteration">
                        <span class="rune-icon">ᚠ</span>
                        <span class="btn-text">Runic Sight</span>
                    </button>
                </div>
            </header>

            <!-- Chat Area: The Great Scroll -->
            <div class="chat-scroll" id="chat-scroll">
                <!-- Messages will be injected here by JS -->
                <div class="message system-message">
                    <p>The ravens have returned. The winds of destiny carry new whispers...</p>
                </div>
            </div>

            <!-- Input Area: The Carved Trough -->
            <footer class="input-area">
                <form id="message-form" class="input-container">
                    <div class="knotwork-border"></div>
                    <input type="text" id="message-input" placeholder="Speak your truth to the gods..." autocomplete="off">
                    <button type="submit" class="send-btn">
                        <span class="send-icon">ᛑ</span>
                        <span class="send-text">Send</span>
                    </button>
                </form>
            </footer>

        </section>
    </div>

    <!-- Raven Delivery Animation Element -->
    <div id="raven-messenger" class="hidden">
        <div class="raven-silhouette"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
