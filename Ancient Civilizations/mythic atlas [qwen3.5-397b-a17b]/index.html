<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Atlas of Aethelgard</title>
    
    <!-- Google Fonts for that Ancient/Modern blend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Fauna+One&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    
    <!-- Link to our CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="loader-screen">
        <div class="loader-symbol"></div>
        <p class="loader-text">Deciphering Ancient Scripts...</p>
    </div>

    <!-- Main App Container -->
    <main id="app" class="app-container">
        
        <!-- Background Texture Layer -->
        <div class="texture-overlay"></div>
        <div class="vignette-overlay"></div>

        <!-- The Map Canvas (SVG) -->
        <!-- We use a viewBox to create a coordinate system independent of screen size -->
        <svg id="world-map" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
            
            <!-- Definitions for filters and gradients -->
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <linearGradient id="ocean-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
                </linearGradient>
                <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- Base Ocean/Background -->
            <rect width="1200" height="800" fill="url(#ocean-grad)" />
            <rect width="1200" height="800" fill="url(#grid-pattern)" />

            <!-- Group: Landmasses -->
            <g id="land-group" class="map-layer">
                <!-- Continent: The Northern Wastes -->
                <path id="region-north" class="land-mass" 
                      d="M 100,100 L 400,80 L 500,200 L 300,350 L 150,300 Z" 
                      data-name="Frosthaven" 
                      data-era="all"
                      data-desc="A land of eternal ice and iron mines. The people here forge weapons of unparalleled sharpness."/>
                
                <!-- Continent: The Central Empires -->
                <path id="region-central" class="land-mass" 
                      d="M 450,250 L 800,200 L 900,400 L 600,500 L 400,400 Z" 
                      data-name="Aethelgard Core" 
                      data-era="all"
                      data-desc="The heart of civilization. Golden cities, bustling markets, and the seat of the Sun King."/>
                
                <!-- Continent: The Southern Isles -->
                <path id="region-south" class="land-mass" 
                      d="M 300,550 L 600,550 L 500,750 L 250,700 Z" 
                      data-name="Veridian Archipelago" 
                      data-era="all"
                      data-desc="Lush jungles and ancient ruins. Home to the mystic weavers and rare spices."/>

                <!-- Hidden Land (Only visible in specific eras) -->
                <path id="region-lost" class="land-mass hidden-era" 
                      d="M 850,100 L 1100,150 L 1050,300 L 900,250 Z" 
                      data-name="The Lost Kingdom" 
                      data-era="ancient"
                      data-desc="Once a mighty empire, now swallowed by the sea. Only visible during the alignment of stars."/>
            </g>

            <!-- Group: Trade Routes (Animated) -->
            <g id="route-group" class="map-layer">
                <!-- Route 1: North to Central -->
                <path id="route-1" class="trade-route" 
                      d="M 300,250 Q 400,300 550,350" 
                      fill="none" 
                      stroke="#d97706" 
                      stroke-width="2"
                      data-speed="20"/>
                <circle class="caravan" r="3" fill="#fbbf24">
                    <animateMotion dur="8s" repeatCount="indefinite" path="M 300,250 Q 400,300 550,350" />
                </circle>

                <!-- Route 2: Central to South -->
                <path id="route-2" class="trade-route" 
                      d="M 600,450 Q 500,600 400,650" 
                      fill="none" 
                      stroke="#d97706" 
                      stroke-width="2"
                      data-speed="20"/>
                <circle class="caravan" r="3" fill="#fbbf24">
                    <animateMotion dur="12s" repeatCount="indefinite" path="M 600,450 Q 500,600 400,650" />
                </circle>
            </g>

            <!-- Group: Cities/Points of Interest -->
            <g id="city-group" class="map-layer">
                <circle cx="300" cy="250" r="6" class="city-point" data-region="region-north" />
                <circle cx="550" cy="350" r="6" class="city-point" data-region="region-central" />
                <circle cx="400" cy="650" r="6" class="city-point" data-region="region-south" />
            </g>

            <!-- Decorative Compass -->
            <g transform="translate(1050, 100)" class="compass-rose">
                <circle r="40" fill="none" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1" />
                <path d="M 0,-30 L 5,0 L 0,30 L -5,0 Z" fill="rgba(217, 119, 6, 0.6)" />
                <path d="M -30,0 L 0,-5 L 30,0 L 0,5 Z" fill="rgba(217, 119, 6, 0.6)" />
                <text y="5" font-family="Cinzel" font-size="10" fill="#d97706" text-anchor="middle" dominant-baseline="middle">N</text>
            </g>

        </svg>

        <!-- UI Overlay Layer -->
        <div class="ui-layer">
            
            <!-- Header / Title -->
            <header class="map-header">
                <h1 class="title-text">Atlas of <span class="highlight">Aethelgard</span></h1>
                <div class="era-indicator">
                    <span class="era-label">Current Era:</span>
                    <span id="current-era-name" class="era-name">The Golden Age</span>
                </div>
            </header>

            <!-- Timeline Slider -->
            <div class="timeline-container">
                <div class="timeline-track"></div>
                <input type="range" id="era-slider" min="0" max="2" step="1" value="1">
                <div class="timeline-markers">
                    <span data-val="0">Mythic</span>
                    <span data-val="1" class="active">Golden</span>
                    <span data-val="2">Decay</span>
                </div>
            </div>

            <!-- Legend / Key -->
            <div class="legend-panel">
                <h3>Map Key</h3>
                <div class="legend-item">
                    <span class="dot gold"></span> <span>Capital</span>
                </div>
                <div class="legend-item">
                    <span class="line"></span> <span>Trade Route</span>
                </div>
                <div class="legend-item">
                    <span class="dot ice"></span> <span>Frontier</span>
                </div>
            </div>

        </div>

        <!-- Lore Modal (Hidden by default) -->
        <div id="lore-modal" class="lore-modal">
            <div class="modal-content">
                <button id="close-modal" class="close-btn">&times;</button>
                <h2 id="modal-title">Region Name</h2>
                <div class="modal-divider"></div>
                <p id="modal-desc">Region description goes here...</p>
                <div class="modal-stats">
                    <div class="stat">
                        <span class="stat-label">Population</span>
                        <span class="stat-value">2.4M</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Resource</span>
                        <span class="stat-value">Iron</span>
                    </div>
                </div>
            </div>
            <div class="modal-decoration-top"></div>
            <div class="modal-decoration-bottom"></div>
        </div>

    </main>

    <!-- Link to JS -->
    <script src="scripts.js"></script>
</body>
</html>
