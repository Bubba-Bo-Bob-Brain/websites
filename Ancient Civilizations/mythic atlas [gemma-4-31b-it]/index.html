<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archivist's Codex | Atlas of Aethelgard</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing Antique Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Atmospheric Grain & Lighting Overlay -->
    <div class="ambient-overlay"></div>
    <div class="candle-glow"></div>

    <!-- Main Interface -->
    <div class="codex-container">
        
        <!-- Header / Title -->
        <header class="atlas-header">
            <div class="decorative-line"></div>
            <h1>Atlas of Aethelgard</h1>
            <p class="subtitle">Chronicles of the First Three Eras</p>
            <div class="decorative-line"></div>
        </header>

        <!-- The Map Viewport -->
        <main class="map-viewport" id="mapViewport">
            <div class="map-canvas" id="mapCanvas">
                
                <!-- SVG Map Layer -->
                <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" class="world-map">
                    <defs>
                        <filter id="paper-texture">
                            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
                            <feDiffuseLighting in="noise" lighting-color="#f4e4bc" surfaceScale="2">
                                <feDistantLight azimuth="45" elevation="60" />
                            </feDiffuseLighting>
                        </filter>
                        
                        <!-- Gradient for Trade Routes -->
                        <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="transparent" />
                            <stop offset="50%" stop-color="rgba(197, 160, 82, 0.8)" />
                            <stop offset="100%" stop-color="transparent" />
                        </linearGradient>
                    </defs>

                    <!-- Continents / Regions -->
                    <g class="regions">
                        <!-- The Solar Empire -->
                        <path id="region-solar" class="region" d="M200,200 Q300,150 450,250 T600,300 L500,500 Q300,550 150,400 Z" />
                        <text x="320" y="330" class="region-label">The Solar Empire</text>

                        <!-- The Obsidian Wastes -->
                        <path id="region-obsidian" class="region" d="M650,100 Q800,50 950,150 T1000,300 L800,400 Q600,350 650,100 Z" />
                        <text x="750" y="220" class="region-label">Obsidian Wastes</text>

                        <!-- The Azure Archipelago -->
                        <path id="region-azure" class="region" d="M300,600 Q400,550 500,650 T600,700 L400,780 Q200,750 300,600 Z" />
                        <text x="380" y="680" class="region-label">Azure Archipelago</text>
                    </g>

                    <!-- Trade Routes Layer -->
                    <g class="trade-routes">
                        <path id="route-1" class="route-line" d="M400,350 C500,350 600,250 750,200" />
                        <path id="route-2" class="route-line" d="M450,500 C500,600 500,650 400,680" />
                        <path id="route-3" class="route-line" d="M750,200 C800,400 600,500 450,500" />
                    </g>

                    <!-- Interactive Cities/Markers -->
                    <g class="markers">
                        <circle cx="400" cy="350" r="6" class="city-marker" data-city="Solara" />
                        <circle cx="750" cy="200" r="6" class="city-marker" data-city="Kezreth" />
                        <circle cx="400" cy="680" r="6" class="city-marker" data-city="Thalassa" />
                        <circle cx="450" cy="500" r="6" class="city-marker" data-city="Oakhaven" />
                    </g>
                </svg>
            </div>
        </main>

        <!-- Side Lore Scroll -->
        <aside class="lore-scroll" id="loreScroll">
            <div class="scroll-content">
                <button class="close-scroll">&times;</button>
                <div id="loreDetails">
                    <h2 class="lore-title">Select a Region</h2>
                    <div class="lore-body">
                        <p>Touch the ancient lands to unveil their secrets...</p>
                    </div>
                    <div class="lore-footer">
                        <span class="glyph-decoration">𓁹 𓋹 𓅓</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Bottom UI Elements -->
        <footer class="atlas-ui">
            <!-- Legend Tablet -->
            <div class="legend-tablet">
                <h3>Map Legend</h3>
                <ul class="legend-list">
                    <li><span class="swatch gold"></span> Imperial Capitals</li>
                    <li><span class="swatch route"></span> Trade Arteries</li>
                    <li><span class="swatch waste"></span> Forbidden Zones</li>
                </ul>
            </div>

            <!-- Era Timeline Slider -->
            <div class="timeline-container">
                <span class="era-label">Age of Myth</span>
                <input type="range" id="eraSlider" min="1" max="3" step="1" value="1">
                <span class="era-label">Age of Iron</span>
            </div>
        </footer>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
