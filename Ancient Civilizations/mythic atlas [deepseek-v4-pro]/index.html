<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Chronicles of Aethelgard | Interactive Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievaSharp&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="parchment-overlay"></div>
  <div class="grain-texture"></div>

  <div class="main-container">
    <header class="cartouche-header">
      <div class="cartouche-left-wing"></div>
      <div class="cartouche-body">
        <h1 class="main-title">Chronicles of Aethelgard</h1>
        <p class="subtitle">An Atlas of the Five Kingdoms & The Shifting Veil</p>
      </div>
      <div class="cartouche-right-wing"></div>
    </header>

    <div class="map-wrapper">
      <div class="map-frame">
        <div class="map-outer-border">
          <div class="map-inner-border">
            <svg id="world-map" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
                  <feColorMatrix type="matrix" values="0.9 0 0 0 0.05  0 0.85 0 0 0.03  0 0 0.75 0 0.01  0 0 0 0.15 0" in="noise" result="coloredNoise" />
                  <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                  <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <marker id="caravan-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
                  <circle cx="5" cy="5" r="3" fill="#b8860b" />
                </marker>
                <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                  <path d="M0,0 L10,5 L0,10 Z" fill="#8b4513" />
                </marker>
              </defs>

              <g id="territories-group" filter="url(#paper-texture)">
                </g>

              <g id="routes-group">
                </g>

              <g id="annotations-group">
                </g>

              <g id="markers-group">
                </g>
            </svg>

            <div class="timeline-control">
              <div class="era-label left-era">Age of Whispers</div>
              <input type="range" id="era-slider" min="0" max="3" value="0" step="1" class="era-slider">
              <div class="era-label right-era">The Sundering</div>
              <div class="current-era-display" id="era-name">Era of the First Dawn</div>
            </div>
          </div>
        </div>
      </div>

      <div class="legend-panel stone-inscription">
        <h3 class="legend-title">Cartographic Key</h3>
        <div class="legend-item" data-type="capital">
          <span class="legend-icon capital-icon"></span> Imperial Capital
        </div>
        <div class="legend-item" data-type="city">
          <span class="legend-icon city-icon"></span> Trade City
        </div>
        <div class="legend-item" data-type="ruin">
          <span class="legend-icon ruin-icon"></span> Ancient Ruin
        </div>
        <div class="legend-item" data-type="route">
          <span class="legend-icon route-icon"></span> Trade Route
        </div>
        <div class="legend-divider"></div>
        <div class="legend-item realm-item" data-realm="valdris">
          <span class="realm-swatch valdris-swatch"></span> Valdris Empire
        </div>
        <div class="legend-item realm-item" data-realm="sylvan">
          <span class="realm-swatch sylvan-swatch"></span> Sylvan Enclave
        </div>
        <div class="legend-item realm-item" data-realm="kheth">
          <span class="realm-swatch kheth-swatch"></span> Kheth Dominion
        </div>
        <div class="legend-item realm-item" data-realm="north">
          <span class="realm-swatch north-swatch"></span> Northern Holds
        </div>
        <div class="legend-item realm-item" data-realm="sunken">
          <span class="realm-swatch sunken-swatch"></span> Sunken Realms
        </div>
      </div>
    </div>

    <div id="info-modal" class="modal-overlay hidden">
      <div class="modal-scroll">
        <div class="modal-content">
          <button class="modal-close" id="close-modal">&times;</button>
          <div class="modal-header">
            <h2 id="modal-title" class="modal-title"></h2>
            <span id="modal-subtitle" class="modal-subtitle"></span>
          </div>
          <div class="modal-body">
            <div class="modal-image-placeholder" id="modal-image"></div>
            <p id="modal-lore" class="modal-lore"></p>
            <div class="modal-details" id="modal-details"></div>
          </div>
          <div class="modal-footer">
            <span class="rune-decoration">ᛗᚨᛈ</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-controls">
      <button class="control-btn active" id="toggle-routes">Trade Routes</button>
      <button class="control-btn active" id="toggle-markers">Settlements</button>
      <button class="control-btn" id="toggle-myths">Mythological Sites</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
