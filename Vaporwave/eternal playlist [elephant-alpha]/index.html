<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON VAPOR | ネオンバップ</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Parallax Palm Tree Background -->
    <div class="parallax-bg">
        <div class="palm-tree tree-1"></div>
        <div class="palm-tree tree-2"></div>
        <div class="palm-tree tree-3"></div>
        <div class="gradient-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header with Neon Sign Effect -->
        <header class="header">
            <div class="neon-sign">
                <span class="glow-text">NEON</span>
                <span class="glow-text" style="--glow-color: #ff00ff;">VAPOR</span>
            </div>
            <div class="status-bar">
                <span class="status-item">LOFI</span>
                <span class="status-item">256kbps</span>
                <span class="status-item">HQ</span>
            </div>
        </header>

        <!-- Album Art Section -->
        <section class="album-section">
            <div class="album-rotation">
                <div class="album-cover">
                    <div class="album-spine"></div>
                    <div class="album-label">VK</div>
                    <div class="track-number">01</div>
                </div>
                <div class="album-rotation-ring"></div>
            </div>
            <div class="album-info">
                <h2 class="track-title">Digital Dreams</h2>
                <p class="artist-name">Cyber Synthwave</p>
                <div class="release-year">1987</div>
            </div>
        </section>

        <!-- Waveform Visualizer -->
        <section class="visualizer-section">
            <div class="visualizer-header">
                <span class="visualizer-label">WAVEFORM ANALYZER</span>
                <div class="led-indicator">
                    <span class="led active"></span>
                    <span class="led"></span>
                    <span class="led"></span>
                </div>
            </div>
            <canvas id="waveform" class="waveform-canvas"></canvas>
            <div class="visualizer-controls">
                <button class="vis-btn" id="fftToggle">FFT</button>
                <button class="vis-btn" id="scopeToggle">SCOPE</button>
            </div>
        </section>

        <!-- VHS Tracking Bar -->
        <section class="progress-section">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="vhs-track-container">
                <div class="vhs-track">
                    <div class="vhs-progress" id="vhsProgress"></div>
                    <div class="vhs-head" id="vhsHead"></div>
                    <div class="vhs-glow"></div>
                </div>
                <div class="track-markers">
                    <div class="marker"></div>
                    <div class="marker"></div>
                    <div class="marker"></div>
                    <div class="marker"></div>
                    <div class="marker"></div>
                </div>
            </div>
        </section>

        <!-- Playlist Section -->
        <section class="playlist-section">
            <div class="playlist-header">
                <span class="playlist-title">PLAYLIST プレイリスト</span>
                <div class="playlist-controls">
                    <button class="control-btn" id="addTrack">＋</button>
                    <button class="control-btn" id="clearPlaylist">クリア</button>
                </div>
            </div>
            <div class="playlist-items" id="playlistContainer">
                <!-- Playlist items will be added dynamically -->
            </div>
        </section>

        <!-- Player Controls -->
        <section class="controls-section">
            <div class="control-group">
                <button class="control-btn" id="shuffle">⟳</button>
                <button class="control-btn" id="prev">〈</button>
                <button class="control-btn play-btn" id="play">❚❚</button>
                <button class="control-btn" id="next">〉</button>
                <button class="control-btn" id="repeat">⟳</button>
            </div>
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
            </div>
        </section>

        <!-- Broken Windows 95 Dialog (Hidden by default) -->
        <div class="win95-dialog" id="trackInfoDialog">
            <div class="dialog-header">
                <span class="dialog-title">Track Information</span>
                <button class="close-btn" id="closeDialog">×</button>
            </div>
            <div class="dialog-content">
                <div class="dialog-field">
                    <label>Title:</label>
                    <span id="dialogTitle">Digital Dreams</span>
                </div>
                <div class="dialog-field">
                    <label>Artist:</label>
                    <span id="dialogArtist">Cyber Synthwave</span>
                </div>
                <div class="dialog-field">
                    <label>Album:</label>
                    <span id="dialogAlbum">Neon Vaporwave</span>
                </div>
                <div class="dialog-field">
                    <label>Year:</label>
                    <span id="dialogYear">1987</span>
                </div>
                <div class="dialog-field">
                    <label>Genre:</label>
                    <span id="dialogGenre">Synthwave</span>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="dialog-btn">OK</button>
            </div>
            <div class="dialog-glow"></div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
