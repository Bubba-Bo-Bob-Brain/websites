<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON DREAMING - Late Night Vaporwave Radio</title>
    
    <!-- Google Fonts for that aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=VT323&family=Noto+Sans+JP:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- CRT Scanline Overlay -->
    <div class="crt-overlay"></div>
    
    <!-- VHS Tracking Lines -->
    <div class="vhs-tracking" id="vhsTracking"></div>
    
    <!-- Floating Particles / Stars -->
    <div class="particles" id="particles"></div>
    
    <!-- Parallax Background Layers -->
    <div class="parallax-bg">
        <div class="gradient-sky"></div>
        <div class="grid-floor"></div>
        
        <div class="palm-tree palm-left">
            <div class="palm-trunk"></div>
            <div class="palm-leaves">
                <div class="palm-leaf leaf-1"></div>
                <div class="palm-leaf leaf-2"></div>
                <div class="palm-leaf leaf-3"></div>
                <div class="palm-leaf leaf-4"></div>
                <div class="palm-leaf leaf-5"></div>
            </div>
        </div>
        
        <div class="palm-tree palm-right">
            <div class="palm-trunk"></div>
            <div class="palm-leaves">
                <div class="palm-leaf leaf-1"></div>
                <div class="palm-leaf leaf-2"></div>
                <div class="palm-leaf leaf-3"></div>
                <div class="palm-leaf leaf-4"></div>
                <div class="palm-leaf leaf-5"></div>
            </div>
        </div>
        
        <div class="sun-glow"></div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="jp-text">深夜放送</span>
                <h1 class="logo">NEON<span class="logo-accent">夢境</span></h1>
            </div>
            <div class="header-center">
                <div class="broadcast-indicator">
                    <span class="live-dot"></span>
                    <span class="broadcast-text">ON AIR</span>
                    <span class="broadcast-time" id="broadcastTime">00:00:00</span>
                </div>
            </div>
            <div class="header-right">
                <span class="jp-text">ボリューム</span>
                <div class="volume-control">
                    <div class="volume-bar">
                        <div class="volume-fill" id="volumeFill" style="width: 75%"></div>
                    </div>
                    <span class="volume-text" id="volumeText">75%</span>
                </div>
            </div>
        </header>

        <!-- Main Player Area -->
        <div class="player-grid">
            <!-- Left Column - Visualizer -->
            <div class="player-left">
                <!-- Marble Bust Visualizer -->
                <div class="bust-container">
                    <div class="bust-glow"></div>
                    <div class="marble-bust" id="marbleBust">
                        <div class="bust-head"></div>
                        <div class="bust-hair"></div>
                        <div class="bust-face">
                            <div class="bust-eye left-eye"></div>
                            <div class="bust-eye right-eye"></div>
                            <div class="bust-nose"></div>
                            <div class="bust-mouth"></div>
                        </div>
                        <div class="bust-neck"></div>
                        <div class="bust-shoulders"></div>
                        <div class="bust-column">
                            <div class="column-top"></div>
                            <div class="column-middle"></div>
                            <div class="column-bottom"></div>
                        </div>
                    </div>
                    <!-- Audio Reactive Rings -->
                    <div class="audio-rings" id="audioRings">
                        <div class="ring ring-1"></div>
                        <div class="ring ring-2"></div>
                        <div class="ring ring-3"></div>
                    </div>
                </div>

                <!-- Waveform Visualizer -->
                <div class="waveform-container">
                    <canvas id="waveformCanvas" width="400" height="80"></canvas>
                    <div class="waveform-overlay"></div>
                </div>

                <!-- Album Art & Info -->
                <div class="album-section">
                    <div class="album-frame">
                        <div class="album-art" id="albumArt">
                            <div class="album-gradient"></div>
                            <div class="album-jp">夜のミュージック</div>
                            <div class="album-icon">💿</div>
                        </div>
                        <div class="album-reflection"></div>
                    </div>
                </div>
            </div>

            <!-- Center Column - Main Controls -->
            <div class="player-center">
                <!-- Windows 95 Dialog Box - Track Info -->
                <div class="win95-dialog">
                    <div class="win95-titlebar">
                        <div class="win95-titlebar-left">
                            <span class="win95-icon">🎵</span>
                            <span class="win95-title">now_playing.exe</span>
                        </div>
                        <div class="win95-buttons">
                            <button class="win95-btn win95-minimize">_</button>
                            <button class="win95-btn win95-maximize">□</button>
                            <button class="win95-btn win95-close">×</button>
                        </div>
                    </div>
                    <div class="win95-content">
                        <div class="win95-text">
                            <p class="track-title" id="trackTitle">Plastic Love</p>
                            <p class="track-artist" id="trackArtist">Mariya Takeuchi</p>
                            <p class="track-album" id="trackAlbum">Variety (1984)</p>
                        </div>
                        <div class="win95-info">
                            <span class="track-number" id="trackNumber">01</span>
                            <span class="track-duration" id="trackDuration">04:58</span>
                        </div>
                    </div>
                </div>

                <!-- VHS Seek Bar -->
                <div class="vhs-seek-container">
                    <div class="vhs-label">
                        <span class="vhs-time" id="currentTime">0:00</span>
                        <span class="vhs-rec">● REC</span>
                    </div>
                    <div class="vhs-seekbar" id="vhsSeekbar">
                        <div class="vhs-track">
                            <div class="vhs-progress" id="vhsProgress"></div>
                            <div class="vhs-glitch-bar" id="vhsGlitchBar"></div>
                            <div class="vhs-static"></div>
                        </div>
                        <div class="vhs-tracking-noise"></div>
                    </div>
                    <div class="vhs-label">
                        <span class="vhs-speed">SP</span>
                        <span class="vhs-time" id="totalTime">4:58</span>
                    </div>
                </div>

                <!-- Main Controls -->
                <div class="main-controls">
                    <button class="control-btn shuffle-btn" id="shuffleBtn" title="Shuffle">
                        <span class="btn-icon">🔀</span>
                    </button>
                    <button class="control-btn prev-btn" id="prevBtn" title="Previous">
                        <span class="btn-icon">⏮</span>
                    </button>
                    <button class="control-btn play-btn" id="playBtn" title="Play/Pause">
                        <span class="btn-icon">▶</span>
                        <div class="play-ring"></div>
                    </button>
                    <button class="control-btn next-btn" id="nextBtn" title="Next">
                        <span class="btn-icon">⏭</span>
                    </button>
                    <button class="control-btn repeat-btn" id="repeatBtn" title="Repeat">
                        <span class="btn-icon">🔁</span>
                    </button>
                </div>

                <!-- Equalizer -->
                <div class="equalizer">
                    <div class="eq-label">EQUALIZER</div>
                    <div class="eq-bars">
                        <div class="eq-band" data-freq="60">
                            <div class="eq-fill" style="height: 60%"></div>
                        </div>
                        <div class="eq-band" data-freq="170">
                            <div class="eq-fill" style="height: 80%"></div>
                        </div>
                        <div class="eq-band" data-freq="310">
                            <div class="eq-fill" style="height: 45%"></div>
                        </div>
                        <div class="eq-band" data-freq="600">
                            <div class="eq-fill" style="height: 70%"></div>
                        </div>
                        <div class="eq-band" data-freq="1k">
                            <div class="eq-fill" style="height: 55%"></div>
                        </div>
                        <div class="eq-band" data-freq="3k">
                            <div class="eq-fill" style="height: 90%"></div>
                        </div>
                        <div class="eq-band" data-freq="6k">
                            <div class="eq-fill" style="height: 65%"></div>
                        </div>
                        <div class="eq-band" data-freq="12k">
                            <div class="eq-fill" style="height: 75%"></div>
                        </div>
                        <div class="eq-band" data-freq="14k">
                            <div class="eq-fill" style="height: 50%"></div>
                        </div>
                        <div class="eq-band" data-freq="16k">
                            <div class="eq-fill" style="height: 40%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column - Playlist -->
            <div class="player-right">
                <div class="playlist-container">
                    <!-- Roman Column Divider -->
                    <div class="roman-column column-left">
                        <div class="column-capital"></div>
                        <div class="column-shaft"></div>
                        <div class="column-base"></div>
                    </div>

                    <div class="playlist-wrapper">
                        <div class="playlist-header">
                            <span class="playlist-jp">再生リスト</span>
                            <h2 class="playlist-title">PLAYLIST</h2>
                            <span class="playlist-count" id="playlistCount">12 tracks</span>
                        </div>

                        <div class="playlist-tracks" id="playlistTracks">
                            <!-- Track items will be generated by JS -->
                        </div>
                    </div>

                    <!-- Roman Column Divider -->
                    <div class="roman-column column-right">
                        <div class="column-capital"></div>
                        <div class="column-shaft"></div>
                        <div class="column-base"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Info Bar -->
        <footer class="footer">
            <div class="footer-left">
                <span class="signal-text">SIGNAL: STRONG</span>
                <span class="freq-text">FM 89.7 MHz</span>
            </div>
            <div class="footer-center">
                <span class="tagline-jp">夜の音楽は魂を癒やす</span>
                <span class="tagline">"Late night music heals the soul"</span>
            </div>
            <div class="footer-right">
                <span class="bitrate">320 kbps</span>
                <span class="stereo">STEREO</span>
            </div>
        </footer>
    </main>

    <!-- Glitch Effect Elements -->
    <div class="glitch-container" id="glitchContainer">
        <div class="glitch-slice"></div>
        <div class="glitch-slice"></div>
        <div class="glitch-slice"></div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script src="scripts.js"></script>
</body>
</html>
