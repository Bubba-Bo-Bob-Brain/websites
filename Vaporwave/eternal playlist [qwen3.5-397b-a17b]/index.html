<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N E O N // D R E A M S</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+JP:wght@300;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CRT Screen Effects Overlay -->
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>

    <!-- Background Elements -->
    <div class="bg-grid"></div>
    <div class="sun"></div>
    <div class="palm-silhouette left"></div>
    <div class="palm-silhouette right"></div>

    <!-- Main Interface Container -->
    <main class="interface-container">
        
        <!-- Header / Glitch Title -->
        <header class="main-header">
            <div class="japanese-vertical title-ja">仮想夢プラザ</div>
            <h1 class="glitch-text" data-text="VAPOR_WAVE_PLAYER">VAPOR_WAVE_PLAYER</h1>
            <div class="system-time" id="clock">00:00</div>
        </header>

        <!-- Content Grid -->
        <div class="content-grid">
            
            <!-- Left Column: Visualizer & Art -->
            <section class="visual-section">
                <div class="album-art-frame">
                    <div class="album-art">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop" alt="Album Art" id="album-art-img">
                        <div class="art-overlay"></div>
                    </div>
                    <div class="marble-bust">
                        <!-- CSS Marble Bust Representation -->
                        <div class="bust-shape"></div>
                    </div>
                </div>
                
                <canvas id="visualizer-canvas"></canvas>
            </section>

            <!-- Center Column: Player Controls -->
            <section class="player-section">
                <div class="track-info-box">
                    <h2 class="track-title" id="track-title">LOADING...</h2>
                    <p class="track-artist" id="track-artist">SYSTEM_IDLE</p>
                    <div class="windows-95-border"></div>
                </div>

                <!-- VHS Seek Bar -->
                <div class="seek-container">
                    <div class="vhs-tape-label">TAPE: SIDE A</div>
                    <input type="range" min="0" max="100" value="0" class="vhs-slider" id="seek-slider">
                    <div class="tracking-lines"></div>
                </div>

                <!-- Controls -->
                <div class="controls-wrapper">
                    <button class="control-btn" id="prev-btn" title="Previous">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="control-btn play-btn" id="play-btn" title="Play/Pause">
                        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="control-btn" id="next-btn" title="Next">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>

                <div class="volume-control">
                    <span class="vol-label">VOL</span>
                    <input type="range" min="0" max="100" value="50" class="vol-slider" id="vol-slider">
                </div>
            </section>

            <!-- Right Column: Playlist -->
            <section class="playlist-section">
                <div class="playlist-header">
                    <span class="ja-small">プレイリスト</span>
                    <h3>TRACK_LIST</h3>
                </div>
                
                <div class="roman-column"></div>
                
                <ul class="playlist-items" id="playlist">
                    <!-- Playlist items injected via JS -->
                </ul>

                <div class="roman-column"></div>
            </section>

        </div>

        <!-- Footer -->
        <footer class="main-footer">
            <div class="status-bar">
                <span>MEM: 64KB</span>
                <span>STEREO</span>
                <span class="blink">REC ●</span>
            </div>
        </footer>

    </main>

    <!-- Audio Element -->
    <audio id="audio-player"></audio>

    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
