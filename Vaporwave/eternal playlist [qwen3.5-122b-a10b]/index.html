<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON TOKYO // LATE NIGHT DRIFT</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;400;900&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CRT Overlay Effects -->
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Environment -->
    <div class="world-container">
        <div class="sky">
            <div class="sun"></div>
            <div class="clouds"></div>
        </div>
        <div class="grid-floor"></div>
        <div class="palm-tree left"></div>
        <div class="palm-tree right"></div>
        <div class="palm-tree center-back"></div>
    </div>

    <!-- Main Interface Wrapper -->
    <div class="interface-container">
        
        <!-- Header / Glitch Title -->
        <header class="main-header">
            <h1 class="glitch-title" data-text="NEON TOKYO">NEON TOKYO</h1>
            <div class="jp-subtitle">夜のドライブ</div>
        </header>

        <!-- Main Player Stage -->
        <main class="player-stage">
            
            <!-- Track Info (Broken Windows 95 Style) -->
            <div class="win95-dialog broken">
                <div class="win95-header">
                    <span class="win95-icon">📀</span>
                    <span class="win95-title">TRACK_INFO.EXE</span>
                    <div class="win95-controls">
                        <div class="btn-close">X</div>
                    </div>
                </div>
                <div class="win95-body">
                    <div class="track-status">
                        <span class="blink">PLAYING</span> :: <span id="track-time">00:00</span>
                    </div>
                    <h2 class="track-name" id="current-track-name">Loading...</h2>
                    <p class="track-artist" id="current-track-artist">System...</p>
                    <div class="jp-text-block">
                        音楽は魂の叫びです。<br>
                        未来へ飛び出そう。
                    </div>
                </div>
            </div>

            <!-- Visualizer Area -->
            <div class="visualizer-container">
                <!-- The Rotating Marble Bust -->
                <div class="bust-wrapper">
                    <div class="marble-bust">
                        <div class="bust-head"></div>
                        <div class="bust-shoulders"></div>
                        <div class="bust-base"></div>
                    </div>
                    <!-- Neon Halo -->
                    <div class="neon-halo"></div>
                </div>
                
                <!-- Canvas Waveform -->
                <canvas id="waveform-canvas"></canvas>
            </div>

            <!-- Controls -->
            <div class="controls-panel">
                <!-- VHS Tracking Slider -->
                <div class="seek-container">
                    <span class="vhs-label">TRACKING</span>
                    <input type="range" id="seek-slider" min="0" max="100" value="0">
                    <div class="tracking-bar">
                        <div class="tracking-noise"></div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button class="retro-btn" id="btn-prev">⏮</button>
                    <button class="retro-btn play-pause" id="btn-play">▶</button>
                    <button class="retro-btn" id="btn-next">⏭</button>
                    <button class="retro-btn" id="btn-shuffle">🔀</button>
                </div>
            </div>

        </main>

        <!-- Playlist (Cassette Tape Style) -->
        <aside class="playlist-container">
            <div class="playlist-header">
                <h3>PLAYLIST // SIDE A</h3>
                <div class="roman-divider">
                    <span class="col-left"></span>
                    <span class="col-right"></span>
                </div>
            </div>
            <ul class="track-list" id="playlist-list">
                <!-- Tracks injected via JS -->
            </ul>
        </aside>

        <!-- Footer / Status -->
        <footer class="system-status">
            <div class="status-line">
                <span>MEM: 640K OK</span>
                <span>NET: DISCONNECTED</span>
                <span id="clock">12:00 AM</span>
            </div>
        </footer>

    </div>

    <!-- Audio Element (Hidden) -->
    <audio id="audio-element"></audio>

    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
