<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON RETREAT | Vaporwave Music Player</title>
  <meta name="description" content="A lost cyber-retro music player for late-night vaporwave sessions.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Special+Elite&family=DotGothic16&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Parallax Background -->
  <div class="parallax">
    <div class="parallax__layer parallax__layer--back"></div>
    <div class="parallax__layer parallax__layer--mid"></div>
    <div class="parallax__layer parallax__layer--front"></div>
    <div class="crt-overlay"></div>
  </div>

  <!-- Player Container -->
  <div class="player-container">
    <!-- Album Art + Visualizer -->
    <div class="album-visualizer">
      <div class="album-art">
        <img src="https://via.placeholder.com/400x400/FF2EDF/000000?text=NEON+ALBUM" alt="Album Art" class="album-art__image">
        <div class="album-art__glitch" id="glitch-effect"></div>
      </div>
      <div class="visualizer">
        <div class="marble-bust" id="marble-bust"></div>
        <canvas class="waveform" id="waveform"></canvas>
      </div>
    </div>

    <!-- VHS Tracking Bar (Seek Slider) -->
    <div class="vhs-seek">
      <div class="vhs-seek__bar">
        <input type="range" min="0" max="100" value="0" class="vhs-seek__slider" id="seek-slider">
        <div class="vhs-seek__static"></div>
      </div>
      <div class="vhs-time">
        <span class="vhs-time__current" id="current-time">00:00</span>
        <span class="vhs-time__divider">/</span>
        <span class="vhs-time__total" id="total-time">00:00</span>
      </div>
    </div>

    <!-- Windows 95 Dialog (Track Info) -->
    <div class="windows-dialog" id="track-info">
      <div class="windows-dialog__title-bar">
        <span class="windows-dialog__title">Track Information</span>
        <button class="windows-dialog__close" id="close-dialog">×</button>
      </div>
      <div class="windows-dialog__content">
        <p class="windows-dialog__text">Now Playing: <span id="track-title">AQUA DREAMS</span></p>
        <p class="windows-dialog__text">Artist: <span id="track-artist">MACINTOSH PLUS</span></p>
        <p class="windows-dialog__text">Album: <span id="track-album">リサフランク420</span></p>
      </div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <button class="control-btn" id="prev-btn">
        <span class="control-btn__glow"></span>
        <span class="control-btn__label">PREV</span>
      </button>
      <button class="control-btn" id="play-btn">
        <span class="control-btn__glow"></span>
        <span class="control-btn__label">PLAY</span>
      </button>
      <button class="control-btn" id="next-btn">
        <span class="control-btn__glow"></span>
        <span class="control-btn__label">NEXT</span>
      </button>
      <div class="system-error" id="track-display">
        <span class="system-error__text">SYSTEM ERROR: ようこそ</span>
      </div>
    </div>
  </div>

  <!-- Playlist -->
  <div class="playlist-container">
    <div class="playlist-header">
      <div class="roman-column">
        <div class="roman-column__top"></div>
        <div class="roman-column__shaft">
          <span class="kanji">リスト</span>
        </div>
      </div>
      <h2 class="playlist-title">NEON ARCHIVE</h2>
    </div>
    <div class="playlist">
      <div class="playlist-item active" data-track="0">
        <div class="playlist-item__info">
          <span class="playlist-item__track">1</span>
          <span class="playlist-item__title">AQUA DREAMS</span>
          <span class="playlist-item__artist">MACINTOSH PLUS</span>
        </div>
        <div class="playlist-item__duration">4:20</div>
      </div>
      <div class="playlist-item" data-track="1">
        <div class="playlist-item__info">
          <span class="playlist-item__track">2</span>
          <span class="playlist-item__title">リサフランク420</span>
          <span class="playlist-item__artist">☯</span>
        </div>
        <div class="playlist-item__duration">6:17</div>
      </div>
      <div class="roman-column">
        <div class="roman-column__top"></div>
        <div class="roman-column__shaft">
          <span class="kanji">音楽</span>
        </div>
      </div>
      <div class="playlist-item" data-track="2">
        <div class="playlist-item__info">
          <span class="playlist-item__track">3</span>
          <span class="playlist-item__title">DREAMS OF A MEMORY</span>
          <span class="playlist-item__artist">2 8 1 4</span>
        </div>
        <div class="playlist-item__duration">8:03</div>
      </div>
      <!-- More tracks -->
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="audio-player" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script src="scripts.js"></script>
</body>
</html>
