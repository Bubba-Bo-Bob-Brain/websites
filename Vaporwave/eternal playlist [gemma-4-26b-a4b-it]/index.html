<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＮＥＯＮ // ＮＯＳＴＡＬＧＩＡ // ＭＵＳＩＣ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- VHS & Grain Overlays for Atmosphere -->
    <div class="vhs-overlay"></div>
    <div class="scanlines"></div>
    <div class="noise-texture"></div>

    <!-- Parallax Background Layers -->
    <div class="parallax-container">
        <div class="layer layer-stars"></div>
        <div class="layer layer-grid"></div>
        <div class="layer layer-mountains"></div>
        <div class="layer layer-sun"></div>
        <div class="layer layer-palms"></div>
    </div>

    <main id="app-container">
        
        <!-- Header / Decorative Typography -->
        <header class="aesthetic-header">
            <h1 class="glitch-text" data-text="ＶＡＰＯＲＷＡＶＥ">ＶＡＰＯＲＷＡＶＥ</h1>
            <p class="japanese-subtext">音楽の夢 — 音楽の夢</p>
        </header>

        <div class="interface-grid">
            
            <!-- Left Section: The Visual Experience -->
            <section class="visual-core">
                <div class="marble-bust-container">
                    <!-- The bust will be animated/manipulated via JS/CSS -->
                    <div class="marble-bust">
                        <div class="bust-glow"></div>
                    </div>
                </div>

                <div class="waveform-wrapper">
                    <canvas id="waveform-canvas"></canvas>
                </div>
            </section>

            <!-- Middle Section: Player Controls -->
            <section class="player-interface">
                
                <!-- Windows 95 Style Info Box -->
                <div class="win95-window" id="track-info-window">
                    <div class="win95-title-bar">
                        <span class="title">Track_Info.exe</span>
                        <div class="win95-controls">
                            <button class="min">_</button>
                            <button class="max">□</button>
                            <button class="close">×</button>
                        </div>
                    </div>
                    <div class="win95-content">
                        <h2 id="current-title">ＳＹＮＴＨ ＷＡＶＥ ＤＲＥＡＭＳ</h2>
                        <p id="current-artist">ＡＥＳＴＨＥＴＩＣ ＥＮＴＩＴＹ</p>
                        <div class="system-stats">
                            <span>STATUS: PLAYING</span>
                            <span>BPM: 120</span>
                        </div>
                    </div>
                </div>

                <!-- Main Playback Controls -->
                <div class="playback-controls">
                    <div class="vhs-seek-container">
                        <label for="seek-slider" class="vhs-label">TRACKING</label>
                        <input type="range" id="seek-slider" class="vhs-slider" value="0" min="0" max="100">
                        <div class="vhs-glitch-bar"></div>
                    </div>

                    <div class="button-row">
                        <button id="btn-prev" class="retro-btn">⏮</button>
                        <button id="btn-play" class="retro-btn play-main">▶</button>
                        <button id="btn-next" class="retro-btn">⏭</button>
                    </div>

                    <div class="volume-container">
                        <span>VOL</span>
                        <input type="range" id="volume-slider" class="retro-slider" min="0" max="1" step="0.01" value="0.7">
                    </div>
                </div>
            </section>

            <!-- Right Section: Playlist Management -->
            <aside class="playlist-sidebar">
                <div class="column-divider">
                    <span class="column-top">🏛</span>
                    <span class="column-bottom">🏛</span>
                </div>
                
                <div class="playlist-container">
                    <h3 class="playlist-title">ＰＬＡＹＬＩＳＴ</h3>
                    <ul id="playlist-items">
                        <!-- Dynamically populated -->
                        <li class="playlist-item active" data-src="track1.mp3">
                            <span class="track-num">01</span>
                            <span class="track-name">Midnight Cityscape</span>
                            <span class="track-duration">04:20</span>
                        </li>
                        <li class="playlist-item" data-src="track2.mp3">
                            <span class="track-num">02</span>
                            <span class="track-name">Digital Sunset</span>
                            <span class="track-duration">03:45</span>
                        </li>
                        <li class="playlist-item" data-src="track3.mp3">
                            <span class="track-num">03</span>
                            <span class="track-name">Marble Echoes</span>
                            <span class="track-duration">05:12</span>
                        </li>
                        <li class="playlist-item" data-src="track4.mp3">
                            <span class="track-num">04</span>
                            <span class="track-name">Neon Rain</span>
                            <span class="track-duration">02:58</span>
                        </li>
                    </ul>
                </div>
            </aside>

        </div>
    </main>

    <!-- Hidden Audio Element -->
    <audio id="audio-player" src=""></audio>

    <script src="scripts.js"></script>
</body>
</html>
