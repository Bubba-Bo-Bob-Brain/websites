<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CASE FILES - DETECTIVE ARCHIVE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Gothic:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Rain overlay effect -->
    <div class="rain-overlay" id="rainOverlay"></div>
    
    <!-- Main container -->
    <div class="case-file-container">
        <!-- Header -->
        <header class="noir-header">
            <div class="header-content">
                <h1 class="case-title">CASE FILES</h1>
                <div class="case-number">CASE #7342-B</div>
            </div>
            <div class="header-controls">
                <button class="control-btn" id="toggleRain">☔ RAIN</button>
                <button class="control-btn" id="toggleSmoke">💨 SMOKE</button>
                <button class="control-btn" id="resetBoard">🔄 RESET</button>
            </div>
        </header>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Left panel - Suspects -->
            <section class="panel suspects-panel">
                <div class="panel-header">
                    <h2 class="panel-title">SUSPECTS</h2>
                    <div class="panel-divider"></div>
                </div>
                <div class="suspects-grid" id="suspectsGrid">
                    <!-- Suspect cards will be populated by JS -->
                </div>
            </section>

            <!-- Center - Evidence -->
            <section class="panel evidence-panel">
                <div class="panel-header">
                    <h2 class="panel-title">EVIDENCE</h2>
                    <div class="panel-divider"></div>
                </div>
                <div class="evidence-gallery" id="evidenceGallery">
                    <!-- Evidence photos will be populated by JS -->
                </div>
            </section>

            <!-- Right panel - Witnesses -->
            <section class="panel witnesses-panel">
                <div class="panel-header">
                    <h2 class="panel-title">WITNESSES</h2>
                    <div class="panel-divider"></div>
                </div>
                <div class="witnesses-list" id="witnessesList">
                    <!-- Witness statements will be populated by JS -->
                </div>
            </section>
        </main>

        <!-- Cork Board Section -->
        <section class="cork-board-section">
            <div class="cork-board">
                <div class="cork-texture"></div>
                <div class="board-header">
                    <h2 class="board-title">CONSPIRACY WEB</h2>
                    <div class="board-subtitle">CONNECTING THE THREADS</div>
                </div>
                <div class="pins-container" id="pinsContainer">
                    <!-- Pins will be populated by JS -->
                </div>
                <div class="threads-container" id="threadsContainer">
                    <!-- Threads will be generated by JS -->
                </div>
            </div>
        </section>

        <!-- Case Notes - Typewriter Effect -->
        <section class="case-notes">
            <div class="notes-header">
                <h3>CASE NOTES</h3>
                <div class="cursor-blink">|</div>
            </div>
            <div class="typewriter-container">
                <div class="typewriter-text" id="typewriterText"></div>
            </div>
        </section>

        <!-- Venetian Blind Effect -->
        <div class="venetian-blind-overlay" id="blindOverlay"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
