<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonālpōhualli — Sacred Ritual Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="feathered-serpent-border"></div>
    
    <header class="celestial-header">
        <div class="solar-ring">
            <div class="solar-disc">
                <div class="maya-kin-day">KIN</div>
                <div class="maya-glyph">☉</div>
            </div>
        </div>
        <h1 class="title-glyph">Tonālpōhualli</h1>
        <p class="subtitle-glyph">Sacred Day Count of the Aztecs</p>
        <div class="eclipse-timer">
            <div class="eclipse-icon">☽◯</div>
            <div class="countdown">
                <span class="timer-value" id="eclipse-countdown">00:00:00</span>
                <span class="timer-label">Until Eclipse</span>
            </div>
        </div>
    </header>

    <main class="ritual-chamber">
        <div class="calendar-wheel-container">
            <div class="stone-disc" id="calendar-wheel">
                <div class="disc-rim">
                    <div class="rim-markers">
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                        <span class="marker"></span>
                    </div>
                </div>
                <div class="inner-disc">
                    <div class="four-directions">
                        <div class="direction north">⟡ N</div>
                        <div class="direction east">⟡ E</div>
                        <div class="direction south">⟡ S</div>
                        <div class="direction west">⟡ W</div>
                    </div>
                    <div class="central-sun">
                        <div class="sun-core"></div>
                    </div>
                </div>
                <div class="calendar-days" id="calendar-days">
                </div>
            </div>
            <div class="wheel-controls">
                <button class="wheel-btn" id="rotate-ccw">◂</button>
                <button class="wheel-btn" id="rotate-cw">▸</button>
            </div>
        </div>

        <div class="ritual-panels">
            <div class="deity-cycle-panel">
                <h2 class="panel-title">Deity Cycles</h2>
                <div class="deity-list" id="deity-list">
                </div>
            </div>

            <div class="tribute-panel">
                <h2 class="panel-title">Tribute Schedule</h2>
                <div class="tribute-list" id="tribute-list">
                </div>
            </div>

            <div class="astronomical-events">
                <h2 class="panel-title">Astronomical Events</h2>
                <div class="event-list" id="event-list">
                </div>
            </div>

            <div class="ritual-dates">
                <h2 class="panel-title">Sacred Ritual Dates</h2>
                <div class="ritual-list" id="ritual-list">
                </div>
            </div>
        </div>
    </main>

    <footer class="cosmic-footer">
        <div class="world-tree"></div>
        <p class="footer-glyph">Mictlān — The Nine Underworlds</p>
    </footer>

    <div class="tooltip" id="glyph-tooltip">
        <div class="tooltip-glyph"></div>
        <div class="tooltip-translation"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
