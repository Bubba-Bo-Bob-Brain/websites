<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XIUHPOHUALLI · The Ceremonial Count</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Macondo&family=Marcellus&display=swap" rel="stylesheet">
</head>
<body>
  <div class="obsidian-veil" id="loading-veil">
    <div class="cosmic-glyph"></div>
  </div>

  <div class="quetzalcoatl-border" aria-hidden="true">
    <div class="serpent-scale s1"></div>
    <div class="serpent-scale s2"></div>
    <div class="serpent-scale s3"></div>
    <div class="serpent-scale s4"></div>
    <div class="serpent-feather"></div>
  </div>

  <main class="ceremonial-cosmos">
    <header class="sky-band">
      <div class="tonalpohualli-track" id="tonalpohualli-track">
        <div class="day-sign-carousel" id="day-sign-carousel">
          <span class="day-glyph" data-nahuatl="Cipactli">🐊</span>
          <span class="day-glyph" data-nahuatl="Ehecatl">🌬️</span>
          <span class="day-glyph" data-nahuatl="Calli">🏠</span>
          <span class="day-glyph" data-nahuatl="Cuetzpalin">🦎</span>
          <span class="day-glyph" data-nahuatl="Coatl">🐍</span>
          <span class="day-glyph" data-nahuatl="Miquiztli">💀</span>
          <span class="day-glyph" data-nahuatl="Mazatl">🦌</span>
          <span class="day-glyph" data-nahuatl="Tochtli">🐇</span>
          <span class="day-glyph" data-nahuatl="Atl">💧</span>
          <span class="day-glyph" data-nahuatl="Itzcuintli">🐕</span>
          <span class="day-glyph" data-nahuatl="Ozomahtli">🐒</span>
          <span class="day-glyph" data-nahuatl="Malinalli">🌿</span>
          <span class="day-glyph" data-nahuatl="Acatl">🎋</span>
          <span class="day-glyph" data-nahuatl="Ocelotl">🐆</span>
          <span class="day-glyph" data-nahuatl="Cuauhtli">🦅</span>
          <span class="day-glyph" data-nahuatl="Cozcacuauhtli">🦅</span>
          <span class="day-glyph" data-nahuatl="Ollin">🌍</span>
          <span class="day-glyph" data-nahuatl="Tecpatl">🔪</span>
          <span class="day-glyph" data-nahuatl="Quiahuitl">🌧️</span>
          <span class="day-glyph" data-nahuatl="Xochitl">🌸</span>
        </div>
      </div>
      <div class="celestial-markers">
        <div class="venus-phase" id="venus-marker">✨</div>
        <div class="sun-stone-center"></div>
        <div class="moon-phase" id="moon-phase"></div>
      </div>
    </header>

    <div class="temple-floor">
      <div class="stone-calendar-wheel" id="calendar-wheel">
        <div class="wheel-ring ring-outer">
          <div class="tribute-nodes">
            <div class="tribute-node" data-deity="Tlaloc" data-offering="Jade & Quetzal Feathers" style="--angle: 0deg;"></div>
            <div class="tribute-node" data-deity="Huitzilopochtli" data-offering="Eagle Hearts & Copal" style="--angle: 30deg;"></div>
            <div class="tribute-node" data-deity="Quetzalcoatl" data-offering="Conch Shells & Wind" style="--angle: 60deg;"></div>
            <div class="tribute-node" data-deity="Tezcatlipoca" data-offering="Obsidian Mirrors" style="--angle: 90deg;"></div>
            <div class="tribute-node" data-deity="Xipe Totec" data-offering="First Maize" style="--angle: 120deg;"></div>
            <div class="tribute-node" data-deity="Mictlantecuhtli" data-offering="Bones & Marigolds" style="--angle: 150deg;"></div>
            <div class="tribute-node" data-deity="Chalchiuhtlicue" data-offering="Jade Beads & Water" style="--angle: 180deg;"></div>
            <div class="tribute-node" data-deity="Xiuhtecuhtli" data-offering="Turquoise & Fire" style="--angle: 210deg;"></div>
            <div class="tribute-node" data-deity="Centzon Huitznahua" data-offering="Star Incense" style="--angle: 240deg;"></div>
            <div class="tribute-node" data-deity="Mayahuel" data-offering="Pulque & Agave" style="--angle: 270deg;"></div>
            <div class="tribute-node" data-deity="Tonatiuh" data-offering="Gold & Blood" style="--angle: 300deg;"></div>
            <div class="tribute-node" data-deity="Coyolxauhqui" data-offering="Silver Bells" style="--angle: 330deg;"></div>
          </div>
        </div>
        <div class="wheel-ring ring-mid">
          <div class="ritual-markers">
            <div class="ritual-marker" data-festival="Toxcatl" data-date="Dry Season" style="--angle: 15deg;"></div>
            <div class="ritual-marker" data-festival="Etzalcualiztli" data-date="Rain Feast" style="--angle: 75deg;"></div>
            <div class="ritual-marker" data-festival="Tlacaxipehualiztli" data-date="Spring Equinox" style="--angle: 135deg;"></div>
            <div class="ritual-marker" data-festival="Ochpaniztli" data-date="Harvest" style="--angle: 195deg;"></div>
            <div class="ritual-marker" data-festival="Panquetzaliztli" data-date="Winter Solstice" style="--angle: 255deg;"></div>
            <div class="ritual-marker" data-festival="Izcalli" data-date="Rebirth" style="--angle: 315deg;"></div>
          </div>
        </div>
        <div class="wheel-ring ring-inner">
          <div class="deity-cycle" id="deity-cycle">
            <div class="deity-icon" data-deity="Tlaloc" style="--angle: 0deg;">🌧️</div>
            <div class="deity-icon" data-deity="Quetzalcoatl" style="--angle: 72deg;">🐍</div>
            <div class="deity-icon" data-deity="Tezcatlipoca" style="--angle: 144deg;">🪞</div>
            <div class="deity-icon" data-deity="Huitzilopochtli" style="--angle: 216deg;">🐦</div>
            <div class="deity-icon" data-deity="Xipe Totec" style="--angle: 288deg;">🌽</div>
          </div>
        </div>
        <div class="central-obsidian-disc" id="central-disc">
          <div class="eclipse-countdown" id="eclipse-timer">
            <span class="blood-drop"></span>
            <span class="countdown-value" id="eclipse-value">260</span>
            <span class="countdown-label">TONALPOHUALLI</span>
          </div>
          <div class="glyph-tooltip" id="glyph-tooltip" role="tooltip" aria-hidden="true">
            <span class="tooltip-glyph"></span>
            <span class="tooltip-name"></span>
            <span class="tooltip-detail"></span>
          </div>
        </div>
      </div>

      <aside class="tribute-slab" id="tribute-slab">
        <div class="slab-glow"></div>
        <h2 class="slab-heading"><span class="glyph-decor">📜</span>TRIBUTE RECORD<span class="glyph-decor">📜</span></h2>
        <div class="tribute-offering-list" id="offering-list">
          <div class="offering-item">
            <span class="offering-icon">🪶</span>
            <span class="offering-text">Quetzal Feathers</span>
            <span class="offering-quantity">400 bundles</span>
          </div>
          <div class="offering-item">
            <span class="offering-icon">🟢</span>
            <span class="offering-text">Jade Beads</span>
            <span class="offering-quantity">200 strings</span>
          </div>
          <div class="offering-item">
            <span class="offering-icon">🌽</span>
            <span class="offering-text">Sacred Maize</span>
            <span class="offering-quantity">800 ears</span>
          </div>
          <div class="offering-item">
            <span class="offering-icon">🩸</span>
            <span class="offering-text">Copal Resin</span>
            <span class="offering-quantity">60 cakes</span>
          </div>
        </div>
        <div class="calendar-stone-detail">
          <div class="detail-ring"></div>
          <div class="detail-ring"></div>
          <div class="detail-ring"></div>
        </div>
      </aside>
    </div>

    <div class="cosmic-event-banner" id="event-banner">
      <div class="event-glyph-bg"></div>
      <div class="event-content">
        <span class="event-icon">🌑</span>
        <span class="event-text" id="next-event-text">NEXT RITUAL: ETZALCUALIZTLI · BEAN FEAST</span>
        <span class="event-timer" id="event-timer">13.0.5.2.9</span>
      </div>
    </div>
  </main>

  <footer class="underworld-navigation">
    <nav class="glyph-nav">
      <button class="nav-glyph active" data-view="calendar" aria-label="Calendar Wheel">
        <span class="glyph-icon">🗿</span>
        <span class="glyph-hint">Xiuhpohualli</span>
      </button>
      <button class="nav-glyph" data-view="deities" aria-label="Deity Cycles">
        <span class="glyph-icon">🐍</span>
        <span class="glyph-hint">Teotl</span>
      </button>
      <button class="nav-glyph" data-view="astronomy" aria-label="Astronomical Events">
        <span class="glyph-icon">🌟</span>
        <span class="glyph-hint">Citlalin</span>
      </button>
      <button class="nav-glyph" data-view="tribute" aria-label="Tribute Schedule">
        <span class="glyph-icon">💎</span>
        <span class="glyph-hint">Tequitl</span>
      </button>
    </nav>
  </footer>

  <div class="ambient-particles" id="particle-container"></div>
  <script src="scripts.js"></script>
</body>
</html>
