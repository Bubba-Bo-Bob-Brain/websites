<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AniFlux · Seasonal Anime Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="vivid-bg"></div>
  <div class="color-wave-header">
    <svg class="wave-svg" viewBox="0 0 1440 200" preserveAspectRatio="none">
      <path class="wave-path" d="M0,100 C240,180 480,20 720,100 C960,180 1200,20 1440,100 L1440,0 L0,0 Z" fill="url(#waveGradient)"/>
      <defs>
        <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FF6B9D"/>
          <stop offset="30%" stop-color="#C44DFF"/>
          <stop offset="70%" stop-color="#4D9EFF"/>
          <stop offset="100%" stop-color="#3CF0C5"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <header class="main-header">
    <div class="header-content">
      <div class="logo-area">
        <span class="logo-icon">✦</span>
        <h1 class="logo-text">AniFlux</h1>
        <span class="season-badge">SPRING 2025</span>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <span class="stat-label">Airing</span>
          <span class="stat-value" id="airingCount">24</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Watching</span>
          <span class="stat-value" id="watchingCount">7</span>
        </div>
        <div class="chibi-mascot" id="chibiMascot">
          <div class="chibi-face">
            <div class="chibi-eyes">
              <div class="chibi-eye left"></div>
              <div class="chibi-eye right"></div>
            </div>
            <div class="chibi-mouth"></div>
            <div class="chibi-blush left"></div>
            <div class="chibi-blush right"></div>
          </div>
          <div class="chibi-body"></div>
          <div class="speech-bubble" id="speechBubble">Keep watching! ✨</div>
        </div>
      </div>
    </div>
  </header>

  <main class="anime-grid-container">
    <div class="grid-controls">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All Series</button>
        <button class="filter-tab" data-filter="watching">Watching</button>
        <button class="filter-tab" data-filter="planning">Plan to Watch</button>
        <button class="filter-tab" data-filter="completed">Completed</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search anime..." autocomplete="off">
      </div>
    </div>

    <div class="anime-grid" id="animeGrid">
    </div>
  </main>

  <div class="detail-modal" id="detailModal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-visual">
        <div class="modal-poster"></div>
        <div class="modal-sparkline-container">
          <svg class="sparkline-svg" id="modalSparkline" viewBox="0 0 200 60" preserveAspectRatio="none"></svg>
        </div>
      </div>
      <div class="modal-info">
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-tags" id="modalTags"></div>
        <p class="modal-studio" id="modalStudio"></p>
        <div class="modal-progress">
          <div class="progress-ring-container">
            <svg class="progress-ring" viewBox="0 0 100 100">
              <circle class="progress-ring-bg" cx="50" cy="50" r="42"/>
              <circle class="progress-ring-fill" id="modalProgressRing" cx="50" cy="50" r="42"/>
            </svg>
            <span class="progress-episode" id="modalEpisode">12/12</span>
          </div>
          <div class="watch-status-selector">
            <button class="status-btn" data-status="watching">▶ Watching</button>
            <button class="status-btn" data-status="planning">📋 Plan</button>
            <button class="status-btn" data-status="completed">✓ Done</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
