<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTrack | Winter 2025 Season</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cosmic-bg"></div>
    <div class="sparkle-layer"></div>
    
    <header class="wave-header">
        <div class="wave-container">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
            <div class="wave wave-3"></div>
        </div>
        <div class="header-content">
            <div class="season-badge">
                <span class="season-icon">❄</span>
                <span class="season-text">WINTER 2025</span>
            </div>
            <h1 class="main-title">
                <span class="title-ani">ANI</span><span class="title-track">TRACK</span>
            </h1>
            <p class="tagline">Your Personal Anime Season Companion</p>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-number" id="watching-count">0</span>
                    <span class="stat-label">Watching</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completed-count">0</span>
                    <span class="stat-label">Completed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="total-count">0</span>
                    <span class="stat-label">This Season</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="day-nav">
        <div class="day-tabs">
            <button class="day-tab active" data-day="all">All Days</button>
            <button class="day-tab" data-day="monday">Monday</button>
            <button class="day-tab" data-day="tuesday">Tuesday</button>
            <button class="day-tab" data-day="wednesday">Wednesday</button>
            <button class="day-tab" data-day="thursday">Thursday</button>
            <button class="day-tab" data-day="friday">Friday</button>
            <button class="day-tab" data-day="saturday">Saturday</button>
            <button class="day-tab" data-day="sunday">Sunday</button>
        </div>
    </nav>

    <section class="genre-bar">
        <div class="genre-pills">
            <button class="genre-pill active" data-genre="all">All Genres</button>
            <button class="genre-pill" data-genre="action">Action</button>
            <button class="genre-pill" data-genre="romance">Romance</button>
            <button class="genre-pill" data-genre="comedy">Comedy</button>
            <button class="genre-pill" data-genre="fantasy">Fantasy</button>
            <button class="genre-pill" data-genre="sci-fi">Sci-Fi</button>
            <button class="genre-pill" data-genre="slice-of-life">Slice of Life</button>
            <button class="genre-pill" data-genre="drama">Drama</button>
            <button class="genre-pill" data-genre="horror">Horror</button>
        </div>
        <div class="view-toggle">
            <button class="view-btn active" data-view="grid">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button class="view-btn" data-view="list">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
            </button>
        </div>
    </section>

    <main class="anime-grid-container">
        <div class="anime-grid" id="anime-grid">
        </div>
    </main>

    <div class="chibi-mascot" id="chibi-mascot">
        <div class="chibi-body">
            <div class="chibi-face">
                <div class="chibi-eyes">
                    <div class="chibi-eye left"></div>
                    <div class="chibi-eye right"></div>
                </div>
                <div class="chibi-mouth"></div>
                <div class="chibi-blush left"></div>
                <div class="chibi-blush right"></div>
            </div>
            <div class="chibi-hair">
                <div class="hair-strand strand-1"></div>
                <div class="hair-strand strand-2"></div>
                <div class="hair-strand strand-3"></div>
            </div>
            <div class="chibi-antenna">
                <div class="antenna-ball"></div>
            </div>
        </div>
        <div class="chibi-speech" id="chibi-speech">
            <p id="chibi-message">Welcome, Senpai!</p>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="anime-modal">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-content">
                <div class="modal-poster">
                    <img src="" alt="" id="modal-poster-img">
                    <div class="modal-poster-overlay"></div>
                </div>
                <div class="modal-info">
                    <h2 class="modal-title" id="modal-title"></h2>
                    <div class="modal-meta">
                        <span class="modal-studio" id="modal-studio"></span>
                        <span class="modal-episodes" id="modal-episodes"></span>
                    </div>
                    <div class="modal-genres" id="modal-genres"></div>
                    <div class="modal-synopsis" id="modal-synopsis"></div>
                    <div class="modal-rating-section">
                        <h3>Your Rating</h3>
                        <div class="star-rating" id="modal-star-rating">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button class="action-btn watchlist" id="modal-watchlist">
                            <span class="btn-icon">📚</span>
                            <span class="btn-text">Add to Watchlist</span>
                        </button>
                        <button class="action-btn watching" id="modal-watching">
                            <span class="btn-icon">👁</span>
                            <span class="btn-text">Mark Watching</span>
                        </button>
                        <button class="action-btn completed" id="modal-completed">
                            <span class="btn-icon">✓</span>
                            <span class="btn-text">Mark Completed</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <span class="notification-icon">✨</span>
        <span class="notification-text" id="notification-text"></span>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
