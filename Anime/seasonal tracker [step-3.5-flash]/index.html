<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniCalendar - Seasonal Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Zen+Tokyo+Zoo&family=Hiragino+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Dynamic background particles -->
    <div class="particle-container" id="particles"></div>
    
    <!-- Header with wave animation -->
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <div class="chibi-mascot" id="mascot">
                    <div class="mascot-face">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                        <div class="mouth"></div>
                        <div class="blush left"></div>
                        <div class="blush right"></div>
                    </div>
                </div>
                <div class="logo-text">
                    <h1 class="main-title">AniCalendar</h1>
                    <p class="subtitle">Seasonal Anime Tracker</p>
                </div>
            </div>
            <div class="header-controls">
                <div class="season-selector">
                    <button class="season-btn active" data-season="winter">Winter</button>
                    <button class="season-btn" data-season="spring">Spring</button>
                    <button class="season-btn" data-season="summer">Summer</button>
                    <button class="season-btn" data-season="fall">Fall</button>
                </div>
                <div class="view-controls">
                    <button class="view-btn active" data-view="grid"><i class="fas fa-th"></i></button>
                    <button class="view-btn" data-view="list"><i class="fas fa-list"></i></button>
                </div>
            </div>
        </div>
        <div class="wave-container">
            <svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path class="wave-path" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
                <path class="wave-path-2" fill-opacity="0.7" d="M0,64L48,80C96,96,192,128,288,128C384,128,480,96,576,85.3C672,75,768,85,864,106.7C960,128,1056,160,1152,176C1248,192,1344,192,1392,192L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
    </header>

    <!-- Stats bar -->
    <section class="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="total-anime">24</span>
            <span class="stat-label">This Season</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="watching-count">12</span>
            <span class="stat-label">Watching</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="completed-count">8</span>
            <span class="stat-label">Completed</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="avg-rating">8.2</span>
            <span class="stat-label">Avg Rating</span>
        </div>
    </section>

    <!-- Main content -->
    <main class="main-content">
        <!-- Filter bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="action">Action</button>
                <button class="filter-btn" data-filter="adventure">Adventure</button>
                <button class="filter-btn" data-filter="comedy">Comedy</button>
                <button class="filter-btn" data-filter="drama">Drama</button>
                <button class="filter-btn" data-filter="fantasy">Fantasy</button>
                <button class="filter-btn" data-filter="romance">Romance</button>
                <button class="filter-btn" data-filter="sci-fi">Sci-Fi</button>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search anime...">
            </div>
        </div>

        <!-- Anime grid -->
        <section class="anime-grid" id="anime-grid">
            <!-- Anime cards will be generated by JavaScript -->
        </section>

        <!-- Load more -->
        <div class="load-more-container">
            <button class="load-more-btn" id="load-more">
                <span>Load More</span>
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
    </main>

    <!-- Floating action button for quick add -->
    <button class="fab" id="quick-add-btn" title="Quick Add">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <!-- Modal for anime details -->
    <div class="modal" id="anime-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-body" id="modal-body">
                <!-- Modal content will be injected by JavaScript -->
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
