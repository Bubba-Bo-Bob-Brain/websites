<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Pulse – Seasonal Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="noise-overlay"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-wave"></div>
    <div class="header-content">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <h1>Anime<span class="highlight">Pulse</span></h1>
        </div>
        <p class="season-tag">Summer 2024 · Currently Airing</p>
      </div>
      <div class="header-right">
        <div class="mascot-container">
          <div class="mascot" id="mascot">
            <div class="mascot-body">
              <div class="mascot-eye left"></div>
              <div class="mascot-eye right"></div>
              <div class="mascot-mouth"></div>
              <div class="mascot-blush left"></div>
              <div class="mascot-blush right"></div>
            </div>
            <div class="mascot-speech" id="mascotSpeech">
              <span>Watch more anime! ✨</span>
            </div>
          </div>
        </div>
        <div class="stats-badge">
          <div class="stat">
            <span class="stat-number" id="totalWatching">0</span>
            <span class="stat-label">Watching</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-number" id="totalCompleted">0</span>
            <span class="stat-label">Completed</span>
          </div>
        </div>
      </div>
    </div>
    <div class="header-particles" id="headerParticles"></div>
  </header>

  <!-- Filter Bar -->
  <section class="filter-bar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="watching">Watching</button>
      <button class="filter-btn" data-filter="plan_to_watch">Plan to Watch</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <div class="search-group">
      <input type="text" class="search-input" placeholder="Search series..." id="searchInput" />
      <span class="search-icon">🔍</span>
    </div>
  </section>

  <!-- Anime Grid -->
  <main class="grid-container" id="animeGrid">
    <!-- Cards injected by JS -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Data updates every 24h · Made with ❤️ for anime fans</p>
    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">API</a>
      <a href="#">GitHub</a>
    </div>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
