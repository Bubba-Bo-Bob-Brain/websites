<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse | Seasonal Tracker</title>
    
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet Link -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Dynamic Background Elements -->
    <div class="bg-grid"></div>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Loading Screen -->
    <div id="loader" class="loader-overlay">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <h2 class="loader-text">SYNCING ANIME DATABASE...</h2>
        </div>
    </div>

    <!-- Main Application -->
    <main class="app-container">
        
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">AP</span>
                <span class="logo-text">ANI<span class="highlight">PULSE</span></span>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-item active">Seasonal</a>
                <a href="#" class="nav-item">Upcoming</a>
                <a href="#" class="nav-item">My List</a>
            </div>
            <div class="user-profile">
                <div class="avatar-ring"></div>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="user-avatar">
            </div>
        </nav>

        <!-- Hero / Featured Section -->
        <header class="hero-section">
            <div class="hero-content">
                <div class="hero-badge">TRENDING #1</div>
                <h1 class="hero-title">CYBER: REBELLION</h1>
                <p class="hero-studio">Studio: <span class="studio-name">TRIGGER MAPPA</span></p>
                
                <div class="countdown-container">
                    <div class="countdown-ring" data-progress="75">
                        <svg class="ring-svg" viewBox="0 0 120 120">
                            <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
                            <circle class="ring-fill" cx="60" cy="60" r="54" stroke-dasharray="339.292" stroke-dashoffset="84.8"></circle>
                        </svg>
                        <div class="countdown-text">
                            <span class="time-left">04:12:55</span>
                            <span class="time-label">UNTIL EP 12</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Chibi Mascot Container -->
            <div class="mascot-container">
                <div class="mascot-bubble">
                    <span id="mascot-text">Let's watch!</span>
                </div>
                <!-- Placeholder for dynamic SVG mascot -->
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Chibi&backgroundColor=ffdfbf" alt="Mascot" class="mascot-img">
            </div>
        </header>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="action">Action</button>
            <button class="filter-btn" data-filter="slice-of-life">Slice of Life</button>
            <button class="filter-btn" data-filter="fantasy">Fantasy</button>
            <button class="filter-btn" data-filter="scifi">Sci-Fi</button>
        </div>

        <!-- Anime Grid -->
        <section class="anime-grid" id="anime-grid">
            <!-- Cards will be injected via JS, but here is the structure of one for reference -->
            
            <!-- Example Card Structure (Static for SEO/Structure, dynamic for content) -->
            <!-- 
            <article class="anime-card" data-genre="action">
                <div class="card-image-wrapper">
                    <img src="..." alt="Cover" class="card-img">
                    <div class="card-overlay"></div>
                    <div class="watched-ep-badge">Ep 4 / 12</div>
                </div>
                <div class="card-content">
                    <div class="card-tags">
                        <span class="tag tag-action">Action</span>
                        <span class="tag tag-scifi">Sci-Fi</span>
                    </div>
                    <h3 class="card-title">Mecha Horizon</h3>
                    <p class="card-studio">By Sunrise</p>
                    
                    <div class="card-stats">
                        <div class="sparkline-container">
                            <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
                                <path d="M0,25 Q10,28 20,15 T40,10 T60,20 T80,5 T100,2" />
                            </svg>
                        </div>
                        <div class="rating-val">9.2</div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-watch">Watch Now</button>
                        <div class="progress-mini">
                            <div class="progress-bar" style="width: 33%"></div>
                        </div>
                    </div>
                </div>
            </article> 
            -->
        </section>

    </main>

    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
