<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Season Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header with opening theme color wave -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">ANIME<span class="highlight">TRACKER</span></h1>
                <p class="subtitle">Seasonal Anime Calendar & Tracker</p>
            </div>
            <div class="wave-container">
                <div class="wave wave-1"></div>
                <div class="wave wave-2"></div>
                <div class="wave wave-3"></div>
                <div class="wave wave-4"></div>
            </div>
        </header>

        <!-- Chibi mascot -->
        <div class="mascot-container">
            <div class="chibi-mascot">
                <div class="chibi-head">
                    <div class="chibi-eyes">
                        <div class="eye left-eye">
                            <div class="pupil"></div>
                        </div>
                        <div class="eye right-eye">
                            <div class="pupil"></div>
                        </div>
                    </div>
                    <div class="chibi-mouth"></div>
                    <div class="chibi-ears">
                        <div class="ear left-ear"></div>
                        <div class="ear right-ear"></div>
                    </div>
                </div>
                <div class="chibi-body">
                    <div class="chibi-arm left-arm"></div>
                    <div class="chibi-arm right-arm"></div>
                </div>
                <div class="chibi-legs">
                    <div class="leg left-leg"></div>
                    <div class="leg right-leg"></div>
                </div>
                <div class="sparkle"></div>
            </div>
            <div class="mascot-text">Track Your Anime!</div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-status="all">All</button>
            <button class="filter-btn" data-status="watching">Watching</button>
            <button class="filter-btn" data-status="completed">Completed</button>
            <button class="filter-btn" data-status="planning">Planning</button>
            <button class="filter-btn" data-status="on-hold">On Hold</button>
        </div>

        <!-- Calendar Navigation -->
        <div class="calendar-nav">
            <button id="prev-month" class="nav-btn">◀</button>
            <h2 id="current-month-year">January 2024</h2>
            <button id="next-month" class="nav-btn">▶</button>
        </div>

        <!-- Anime Grid -->
        <div class="anime-grid" id="anime-grid">
            <!-- Anime cards will be dynamically inserted here -->
        </div>

        <!-- Progress Charming -->
        <div class="progress-charm">
            <div class="progress-text">Series Watched: <span id="watched-count">0</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
