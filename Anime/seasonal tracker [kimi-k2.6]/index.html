<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniSeason — Seasonal Anime Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Shrikhand&family=Space+Mono:wght@400;700&family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <div class="wave-header">
            <svg class="wave-svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#FF6B9D"/>
                        <stop offset="25%" stop-color="#C44569"/>
                        <stop offset="50%" stop-color="#F8B500"/>
                        <stop offset="75%" stop-color="#00D9C0"/>
                        <stop offset="100%" stop-color="#6C5CE7"/>
                    </linearGradient>
                    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#A29BFE"/>
                        <stop offset="50%" stop-color="#FD79A8"/>
                        <stop offset="100%" stop-color="#FDCB6E"/>
                    </linearGradient>
                    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00CEC9"/>
                        <stop offset="50%" stop-color="#0984E3"/>
                        <stop offset="100%" stop-color="#6C5CE7"/>
                    </linearGradient>
                </defs>
                <path class="wave-path wave-back" fill="url(#waveGrad3)" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"/>
                <path class="wave-path wave-mid" fill="url(#waveGrad2)" d="M0,128L48,154.7C96,181,192,235,288,245.3C384,256,480,224,576,197.3C672,171,768,149,864,160C960,171,1056,213,1152,218.7C1248,224,1344,192,1392,176L1440,160L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"/>
                <path class="wave-path wave-front" fill="url(#waveGrad1)" d="M0,64L48,80C96,96,192,128,288,133.3C384,139,480,117,576,128C672,139,768,181,864,192C960,203,1056,181,1152,160C1248,139,1344,117,1392,106.7L1440,96L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"/>
            </svg>
            <div class="header-content">
                <div class="season-badge">Winter 2025</div>
                <h1 class="main-title">
                    <span class="title-jp">今期アニメ</span>
                    <span class="title-en">AniSeason</span>
                </h1>
                <p class="header-subtitle">Track. Watch. Feel the season.</p>
                <div class="header-stats">
                    <div class="stat-pill">
                        <span class="stat-number" id="total-watching">0</span>
                        <span class="stat-label">Watching</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-number" id="total-episodes">0</span>
                        <span class="stat-label">Episodes Left</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-number" id="season-progress">0%</span>
                        <span class="stat-label">Season Done</span>
                    </div>
                </div>
            </div>
        </div>

        <nav class="filter-bar">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Shows</button>
                <button class="filter-btn" data-filter="watching">Watching</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="planned">Planned</button>
                <button class="filter-btn" data-filter="dropped">Dropped</button>
            </div>
            <div class="sort-group">
                <select class="sort-select" id="sort-select">
                    <option value="airing">Airing Soon First</option>
                    <option value="rating">Highest Rated</option>
                    <option value="progress">Most Progress</option>
                    <option value="title">Title A-Z</option>
                </select>
            </div>
        </nav>

        <main class="anime-grid" id="anime-grid">
        </main>

        <div class="mascot-container" id="mascot">
            <div class="mascot-body">
                <div class="mascot-head">
                    <div class="mascot-ear left"></div>
                    <div class="mascot-ear right"></div>
                    <div class="mascot-face">
                        <div class="mascot-eye left">
                            <div class="mascot-pupil"></div>
                        </div>
                        <div class="mascot-eye right">
                            <div class="mascot-pupil"></div>
                        </div>
                        <div class="mascot-blush left"></div>
                        <div class="mascot-blush right"></div>
                        <div class="mascot-mouth"></div>
                    </div>
                </div>
                <div class="mascot-body-lower">
                    <div class="mascot-arm left"></div>
                    <div class="mascot-arm right"></div>
                    <div class="mascot-tail"></div>
                </div>
            </div>
            <div class="mascot-bubble" id="mascot-bubble">
                <p>Let's watch some anime together! ヾ(＾-＾)ノ</p>
            </div>
        </div>

        <footer class="site-footer">
            <p>Season ends in <span class="countdown-large" id="season-countdown">--d --h --m</span></p>
            <p class="footer-note">Updates every hour • Data from AniList</p>
        </footer>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card" id="modal-card">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-visual" id="modal-visual">
                <div class="modal-accent-strip" id="modal-accent"></div>
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-jp-title" id="modal-jp-title"></p>
                <div class="modal-meta">
                    <span class="modal-studio" id="modal-studio"></span>
                    <span class="modal-episodes" id="modal-episodes"></span>
                    <span class="modal-source" id="modal-source"></span>
                </div>
                <div class="modal-genres" id="modal-genres"></div>
                <p class="modal-synopsis" id="modal-synopsis"></p>
                <div class="modal-actions">
                    <button class="modal-action-btn primary" id="modal-watch">Watch Now</button>
                    <button class="modal-action-btn secondary" id="modal-list">Add to List</button>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
