<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse // Seasonal Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing a bold display font and a clean body font -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background Decorative Elements -->
    <div class="bg-grain"></div>
    <div class="bg-halftone"></div>
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <!-- The Pulse Header -->
    <header class="pulse-header">
        <div class="header-wave"></div>
        <div class="header-content">
            <h1 class="logo">ANI<span>PULSE</span></h1>
            <div class="season-badge">SPRING 2024</div>
            <nav class="filter-nav">
                <button class="filter-btn active" data-filter="all">ALL</button>
                <button class="filter-btn" data-filter="shonen">SHONEN</button>
                <button class="filter-btn" data-filter="seinen">SEINEN</button>
                <button class="filter-btn" data-filter="slice-of-life">SOL</button>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <!-- Anime Grid -->
        <section class="anime-grid" id="animeGrid">
            <!-- Card 1: Featured/High Energy -->
            <article class="anime-card featured" data-genre="shonen">
                <div class="card-image">
                    <img src="https://images.unsplash.com/photo-1578632292335-df37b665a503?auto=format&fit=crop&w=400&q=80" alt="Anime Poster">
                    <div class="countdown-ring">
                        <svg width="60" height="60">
                            <circle cx="30" cy="30" r="25" class="ring-bg"></circle>
                            <circle cx="30" cy="30" r="25" class="ring-progress" style="stroke-dashoffset: 60;"></circle>
                        </svg>
                        <span class="timer-text">02d</span>
                    </div>
                    <div class="studio-tag studio-mappa">MAPPA</div>
                </div>
                
                <div class="card-content">
                    <div class="card-header">
                        <h2 class="anime-title">SOLO LEVELING</h2>
                        <div class="rating-sparkline">
                            <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline fill="none" stroke="#00ffcc" stroke-width="3" points="0,20 20,10 40,15 60,5 80,12 100,2" />
                            </svg>
                        </div>
                    </div>
                    
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="label">EPISODES</span>
                            <span class="value">12 / 12</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">STATUS</span>
                            <span class="value status-watching">WATCHING</span>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-mark-watched" title="Mark Episode as Watched">
                            <span class="icon">✓</span>
                        </button>
                        <div class="progress-bar-container">
                            <div class="progress-fill" style="width: 75%;"></div>
                        </div>
                    </div>
                </div>
            </article>

            <!-- Card 2 -->
            <article class="anime-card" data-genre="seinen">
                <div class="card-image">
                    <img src="https://images.unsplash.com/photo-1607604253555-27173386869a?auto=format&fit=crop&w=400&q=80" alt="Anime Poster">
                    <div class="countdown-ring">
                        <svg width="60" height="60">
                            <circle cx="30" cy="30" r="25" class="ring-bg"></circle>
                            <circle cx="30" cy="30" r="25" class="ring-progress" style="stroke-dashoffset: 110;"></circle>
                        </svg>
                        <span class="timer-text">05d</span>
                    </div>
                    <div class="studio-tag studio-ufotable">UFOTABLE</div>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <h2 class="anime-title">DEMON SLAYER</h2>
                        <div class="rating-sparkline">
                            <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline fill="none" stroke="#ff0066" stroke-width="3" points="0,25 20,20 40,10 60,15 80,5 100,10" />
                            </svg>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="label">EPISODES</span>
                            <span class="value">08 / 12</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">STATUS</span>
                            <span class="value status-planned">PLANNED</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-mark-watched">
                            <span class="icon">✓</span>
                        </button>
                        <div class="progress-bar-container">
                            <div class="progress-fill" style="width: 30%;"></div>
                        </div>
                    </div>
                </div>
            </article>

            <!-- Card 3 -->
            <article class="anime-card" data-genre="slice-of-life">
                <div class="card-image">
                    <img src="https://images.unsplash.com/photo-1541562232579-87ea3700215a?auto=format&fit=crop&w=400&q=80" alt="Anime Poster">
                    <div class="countdown-ring">
                        <svg width="60" height="60">
                            <circle cx="30" cy="30" r="25" class="ring-bg"></circle>
                            <circle cx="30" cy="30" r="25" class="ring-progress" style="stroke-dashoffset: 30;"></circle>
                        </svg>
                        <span class="timer-text">01d</span>
                    </div>
                    <div class="studio-tag studio-kyoto">Kyoto Anim.</div>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <h2 class="anime-title">Frieren</h2>
                        <div class="rating-sparkline">
                            <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline fill="none" stroke="#ccff00" stroke-width="3" points="0,10 20,5 40,8 60,2 80,4 100,1" />
                            </svg>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="label">EPISODES</span>
                            <span class="value">24 / 28</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">STATUS</span>
                            <span class="value status-completed">COMPLETED</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-mark-watched">
                            <span class="icon">✓</span>
                        </button>
                        <div class="progress-bar-container">
                            <div class="progress-fill" style="width: 90%;"></div>
                        </div>
                    </div>
                </div>
            </article>

            <!-- Card 4 -->
            <article class="anime-card" data-genre="shonen">
                <div class="card-image">
                    <img src="https://images.unsplash.com/photo-1560985576-6676fad43f46?auto=format&fit=crop&w=400&q=80" alt="Anime Poster">
                    <div class="countdown-ring">
                        <svg width="60" height="60">
                            <circle cx="30" cy="30" r="25" class="ring-bg"></circle>
                            <circle cx="30" cy="30" r="25" class="ring-progress" style="stroke-dashoffset: 150;"></circle>
                        </svg>
                        <span class="timer-text">07d</span>
                    </div>
                    <div class="studio-tag studio-bones">BONES</div>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <h2 class="anime-title">My Hero</h2>
                        <div class="rating-sparkline">
                            <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                                <polyline fill="none" stroke="#00ccff" stroke-width="3" points="0,15 20,18 40,12 60,20 80,15 100,10" />
                            </svg>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <span class="label">EPISODES</span>
                            <span class="value">02 / 24</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">STATUS</span>
                            <span class="value status-watching">WATCHING</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-mark-watched">
                            <span class="icon">✓</span>
                        </button>
                        <div class="progress-bar-container">
                            <div class="progress-fill" style="width: 10%;"></div>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <!-- Chibi Mascot Container -->
    <div class="mascot-container">
        <div class="mascot-bubble">Keep watching!</div>
        <div class="mascot-sprite" id="mascot">
            <!-- SVG for Chibi Mascot -->
            <svg width="100" height="100" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="#ffcc00" stroke="#000" stroke-width="4"/>
                <circle cx="35" cy="40" r="5" fill="#000"/>
                <circle cx="65" cy="40" r="5" fill="#000"/>
                <path d="M 40 60 Q 50 70 60 60" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 20 40 Q 10 30 20 20" stroke="#000" stroke-width="4" fill="none"/>
                <path d="M 80 40 Q 90 30 80 20" stroke="#000" stroke-width="4" fill="none"/>
            </svg>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
