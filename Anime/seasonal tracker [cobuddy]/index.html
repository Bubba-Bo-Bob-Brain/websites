<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniCal — Season Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise-overlay"></div>

  <!-- Animated Background -->
  <div class="bg-layers">
    <div class="bg-wave bg-wave-1"></div>
    <div class="bg-wave bg-wave-2"></div>
    <div class="bg-wave bg-wave-3"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo-area">
        <span class="logo-icon">✦</span>
        <h1 class="logo-title">AniCal</h1>
        <span class="logo-subtitle">Season Tracker</span>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <span class="stat-number" id="total-series">12</span>
          <span class="stat-label">Series</span>
        </div>
        <div class="stat-pill watching">
          <span class="stat-number" id="watching-count">5</span>
          <span class="stat-label">Watching</span>
        </div>
        <div class="stat-pill completed">
          <span class="stat-number" id="completed-count">4</span>
          <span class="stat-label">Done</span>
        </div>
      </div>
    </div>
    <div class="header-wave"></div>
  </header>

  <!-- Mascot -->
  <div class="mascot-container">
    <div class="mascot" id="mascot">
      <div class="mascot-body">
        <div class="mascot-face">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
          <div class="mascot-mouth" id="mascot-mouth"></div>
        </div>
        <div class="mascot-blush left"></div>
        <div class="mascot-blush right"></div>
        <div class="mascot-hair">
          <div class="hair-strand strand-1"></div>
          <div class="hair-strand strand-2"></div>
          <div class="hair-strand strand-3"></div>
        </div>
      </div>
      <div class="mascot-tail"></div>
      <div class="mascot-sparkles" id="mascot-sparkles"></div>
    </div>
    <div class="mascot-bubble" id="mascot-bubble">
      <span id="mascot-text">~Tamon!~</span>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="watching">Watching</button>
      <button class="filter-btn" data-filter="plan-to-watch">Plan to Watch</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <div class="filter-group genre-filters">
      <button class="genre-btn" data-genre="action">⚔️ Action</button>
      <button class="genre-btn" data-genre="romance">💕 Romance</button>
      <button class="genre-btn" data-genre="comedy">😂 Comedy</button>
      <button class="genre-btn" data-genre="fantasy">✨ Fantasy</button>
      <button class="genre-btn" data-genre="sci-fi">🔬 Sci-Fi</button>
    </div>
  </div>

  <!-- Main Grid -->
  <main class="grid-container">
    <div class="anime-grid" id="anime-grid"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Made with ✦ obsession for anime</p>
    <p class="footer-season">Summer 2025 Season</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
