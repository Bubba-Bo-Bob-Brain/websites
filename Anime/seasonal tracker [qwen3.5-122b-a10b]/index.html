<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse | Seasonal Tracker</title>
    
    <!-- Fonts: Clash Display for bold headers, Outfit for clean body text -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=outfit@300,400,500,700&display=swap" rel="stylesheet">
    
    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Dynamic Background Elements -->
    <div class="bg-noise"></div>
    <div class="bg-grid"></div>

    <!-- Navigation / Header -->
    <header class="main-header">
        <div class="header-wave-container">
            <!-- SVG Wave Animation -->
            <svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="#2D5BFF" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
            <svg class="wave wave-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="#FF2D95" fill-opacity="0.8" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,261.3C960,256,1056,224,1152,197.3C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>

        <div class="header-content">
            <div class="logo-area">
                <i class="ph ph-lightning logo-icon"></i>
                <h1>Ani<span class="text-accent">Pulse</span></h1>
            </div>
            <div class="season-badge">
                <span class="badge-dot"></span>
                <span>FALL 2023 SEASON</span>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="container">
        
        <!-- Sidebar Filters (Desktop) -->
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Genres</h3>
                <div class="tags-cloud">
                    <button class="tag active">All</button>
                    <button class="tag" style="--tag-color: #FF2D95">Action</button>
                    <button class="tag" style="--tag-color: #2D5BFF">Fantasy</button>
                    <button class="tag" style="--tag-color: #00D2FF">Sci-Fi</button>
                    <button class="tag" style="--tag-color: #FFD600">Comedy</button>
                    <button class="tag" style="--tag-color: #9D4EDD">Drama</button>
                </div>
            </div>
            
            <div class="filter-group">
                <h3>Status</h3>
                <div class="status-list">
                    <label class="status-item">
                        <input type="checkbox" checked> <span>Airing Now</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox"> <span>Finished</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox"> <span>Upcoming</span>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Anime Grid -->
        <section class="anime-grid" id="animeGrid">
            <!-- Cards will be injected here via JavaScript -->
            <!-- Example Structure for Reference:
            <article class="anime-card">
                ... content ...
            </article> 
            -->
        </section>

    </main>

    <!-- Chibi Mascot Overlay -->
    <div class="mascot-container">
        <div class="mascot-bubble" id="mascotBubble">
            Welcome to the Fall Season! Let's watch some anime!
        </div>
        <div class="mascot-body">
            <!-- Simple CSS/SVG Mascot Construction -->
            <div class="mascot-head">
                <div class="mascot-eyes">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
                <div class="mascot-mouth"></div>
                <div class="mascot-blush"></div>
            </div>
            <div class="mascot-hair"></div>
            <div class="mascot-body-shape"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
