<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>武学宝卷 · 苍穹秘录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient-bamboo-layer" id="bambooForest">
    <div class="bamboo-stalk stalk1"></div>
    <div class="bamboo-stalk stalk2"></div>
    <div class="bamboo-stalk stalk3"></div>
    <div class="bamboo-stalk stalk4"></div>
    <div class="bamboo-stalk stalk5"></div>
    <div class="bamboo-stalk stalk6"></div>
  </div>

  <div class="cloud-layer" id="cloudParallax">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
  </div>

  <div class="scroll-container" id="sacredScroll">
    <div class="scroll-cylinder top-cylinder">
      <div class="cylinder-cap top-cap"></div>
      <div class="cylinder-body"></div>
      <div class="cylinder-cap bottom-cap"></div>
    </div>

    <div class="scroll-fabric" id="scrollFabric">
      <div class="silk-texture"></div>
      <div class="ink-stain stain1"></div>
      <div class="ink-stain stain2"></div>
      <div class="ink-stain stain3"></div>

      <header class="scroll-header">
        <div class="dragon-emblem left-dragon"></div>
        <div class="title-block">
          <h1 class="main-title">苍穹秘录</h1>
          <p class="subtitle">九霄云外 · 武学真解</p>
          <div class="title-seal" id="masterSeal">
            <span class="seal-character">武</span>
          </div>
        </div>
        <div class="dragon-emblem right-dragon"></div>
      </header>

      <section class="intro-section" id="intro">
        <div class="vertical-brush-line"></div>
        <p class="intro-text">
          天地有道，万物归宗。此卷收录上古传承之技，融汇日月精华，贯通奇经八脉。习者当以心悟道，以气御形，方可窥见武道天梯。
        </p>
      </section>

      <section class="meridian-section" id="qiFlowArea">
        <h2 class="section-title">
          <span class="title-brush left-brush"></span>
          内功心法 · 经脉流转
          <span class="title-brush right-brush"></span>
        </h2>
        <div class="meridian-canvas-wrapper">
          <canvas id="qiMeridianCanvas" class="qi-canvas"></canvas>
          <div class="acupoint acupoint-dantian" data-point="dantian">
            <span class="point-glow"></span>
            <span class="point-label">丹田</span>
          </div>
          <div class="acupoint acupoint-baihui" data-point="baihui">
            <span class="point-glow"></span>
            <span class="point-label">百会</span>
          </div>
          <div class="acupoint acupoint-yongquan" data-point="yongquan">
            <span class="point-glow"></span>
            <span class="point-label">涌泉</span>
          </div>
          <div class="acupoint acupoint-laogong-left" data-point="laogong">
            <span class="point-glow"></span>
            <span class="point-label">劳宫</span>
          </div>
          <div class="acupoint acupoint-laogong-right" data-point="laogong">
            <span class="point-glow"></span>
            <span class="point-label">劳宫</span>
          </div>
        </div>
      </section>

      <section class="skill-tree-section" id="techniqueTree">
        <h2 class="section-title">
          <span class="title-brush left-brush"></span>
          武学技能 · 参天悟道
          <span class="title-brush right-brush"></span>
        </h2>
        <div class="skill-tree-canvas-container">
          <canvas id="inkSkillCanvas" class="skill-canvas"></canvas>
          <div class="skill-nodes">
            <div class="skill-node root-node" data-skill="root" style="--node-x: 50%; --node-y: 92%;">
              <div class="node-circle">
                <span class="node-icon">根</span>
              </div>
              <span class="node-name">扎基功</span>
            </div>
            <div class="skill-node branch-node" data-skill="iron-palm" style="--node-x: 28%; --node-y: 72%;">
              <div class="node-circle">
                <span class="node-icon">掌</span>
              </div>
              <span class="node-name">铁砂掌</span>
            </div>
            <div class="skill-node branch-node" data-skill="shadow-step" style="--node-x: 72%; --node-y: 70%;">
              <div class="node-circle">
                <span class="node-icon">步</span>
              </div>
              <span class="node-name">凌波微步</span>
            </div>
            <div class="skill-node leaf-node" data-skill="thunder-fist" style="--node-x: 14%; --node-y: 48%;">
              <div class="node-circle">
                <span class="node-icon">雷</span>
              </div>
              <span class="node-name">奔雷拳</span>
            </div>
            <div class="skill-node leaf-node" data-skill="golden-bell" style="--node-x: 42%; --node-y: 50%;">
              <div class="node-circle">
                <span class="node-icon">钟</span>
              </div>
              <span class="node-name">金钟罩</span>
            </div>
            <div class="skill-node leaf-node" data-skill="sword-qi" style="--node-x: 86%; --node-y: 46%;">
              <div class="node-circle">
                <span class="node-icon">剑</span>
              </div>
              <span class="node-name">剑气纵横</span>
            </div>
            <div class="skill-node ultimate-node" data-skill="celestial" style="--node-x: 50%; --node-y: 22%;">
              <div class="node-circle">
                <span class="node-icon">天</span>
              </div>
              <span class="node-name">天人合一</span>
            </div>
          </div>
        </div>
      </section>

      <section class="cultivation-paths" id="pathsSection">
        <h2 class="section-title">
          <span class="title-brush left-brush"></span>
          修炼途径 · 大道三千
          <span class="title-brush right-brush"></span>
        </h2>
        <div class="paths-grid">
          <div class="path-card" data-path="sword">
            <div class="card-ink-border"></div>
            <h3 class="path-name">剑道</h3>
            <p class="path-desc">以器入道，人剑合一</p>
            <div class="path-seal">锋</div>
          </div>
          <div class="path-card" data-path="alchemy">
            <div class="card-ink-border"></div>
            <h3 class="path-name">丹道</h3>
            <p class="path-desc">炉火纯青，金丹化婴</p>
            <div class="path-seal">炼</div>
          </div>
          <div class="path-card" data-path="talisman">
            <div class="card-ink-border"></div>
            <h3 class="path-name">符箓</h3>
            <p class="path-desc">引动天地，咒法通神</p>
            <div class="path-seal">咒</div>
          </div>
          <div class="path-card" data-path="body">
            <div class="card-ink-border"></div>
            <h3 class="path-name">体修</h3>
            <p class="path-desc">金刚不坏，肉身成圣</p>
            <div class="path-seal">刚</div>
          </div>
        </div>
      </section>

      <footer class="scroll-footer">
        <div class="footer-seal-container">
          <div class="red-seal large-seal" id="footerStamp">
            <span>苍穹秘传</span>
          </div>
        </div>
        <p class="footer-verse">九天之上揽明月，万古云霄一羽毛</p>
      </footer>
    </div>

    <div class="scroll-cylinder bottom-cylinder">
      <div class="cylinder-cap top-cap"></div>
      <div class="cylinder-body"></div>
      <div class="cylinder-cap bottom-cap"></div>
    </div>
  </div>

  <nav class="seal-navigation" id="sealNav">
    <button class="nav-seal" data-target="intro" aria-label="卷首引言">
      <span class="seal-char">卷</span>
    </button>
    <button class="nav-seal" data-target="qiFlowArea" aria-label="内功心法">
      <span class="seal-char">气</span>
    </button>
    <button class="nav-seal" data-target="techniqueTree" aria-label="武学技能">
      <span class="seal-char">技</span>
    </button>
    <button class="nav-seal" data-target="pathsSection" aria-label="修炼途径">
      <span class="seal-char">道</span>
    </button>
  </nav>

  <div class="brush-cursor" id="brushCursor">
    <svg viewBox="0 0 40 60" class="brush-svg">
      <path d="M18,2 Q22,6 24,14 Q26,22 24,30 Q22,38 20,46 Q18,54 20,58" stroke="#2c1a0e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M24,14 Q32,12 36,8" stroke="#2c1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="24" cy="14" r="3" fill="#1a0f07" opacity="0.9"/>
    </svg>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
