<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Scroll of Martial Arts</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scroll-container">
        <!-- Red seal stamps for navigation -->
        <div class="seal-nav">
            <div class="seal active" data-section="techniques" title="Fighting Techniques">技</div>
            <div class="seal" data-section="cultivation" title="Cultivation Paths">修</div>
            <div class="seal" data-section="skills" title="Inner Energy Skills">內</div>
        </div>

        <!-- Main scroll content -->
        <div class="scroll-content">
            <!-- Decorative top border -->
            <div class="scroll-border top-border"></div>
            
            <!-- Section 1: Fighting Techniques -->
            <section class="scroll-section active" id="techniques">
                <div class="section-header">
                    <h1 class="section-title">武學精要</h1>
                    <div class="section-seal">技</div>
                </div>
                
                <div class="technique-content">
                    <div class="technique-card">
                        <h2>太極拳法</h2>
                        <p class="technique-desc">以柔克剛，順勢而為。內力渾然，動若風節。</p>
                        <div class="technique-diagram">
                            <div class="energy-flow"></div>
                        </div>
                    </div>
                    
                    <div class="technique-card">
                        <h2>九陽真經</h2>
                        <p class="technique-desc">陽剛至極，熱血沸騰。一式一動，山河震撼。</p>
                        <div class="technique-diagram">
                            <div class="energy-flow"></div>
                        </div>
                    </div>
                    
                    <div class="technique-card">
                        <h2>降龍十八掌</h2>
                        <p class="technique-desc">掌力剛猛，無堅不摧。萬川歸海，一掌定乾坤。</p>
                        <div class="technique-diagram">
                            <div class="energy-flow"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Section 2: Cultivation Paths -->
            <section class="scroll-section" id="cultivation">
                <div class="section-header">
                    <h1 class="section-title">修行之道</h1>
                    <div class="section-seal">修</div>
                </div>
                
                <div class="cultivation-content">
                    <div class="cultivation-path">
                        <h2>正邪之分</h2>
                        <div class="path-branches">
                            <div class="branch left">
                                <h3>正道</h3>
                                <p>修身養性，匡扶正義。內外兼修，心懷天下。</p>
                            </div>
                            <div class="branch right">
                                <h3>魔道</h3>
                                <p>強奪無慮，為所欲為。追求極致，不顧一切。</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="cultivation-path">
                        <h2>境界層次</h2>
                        <div class="level-progress">
                            <div class="level-item">
                                <span class="level-name">初學</span>
                                <div class="level-bar">
                                    <div class="level-fill"></div>
                                </div>
                            </div>
                            <div class="level-item">
                                <span class="level-name">入門</span>
                                <div class="level-bar">
                                    <div class="level-fill"></div>
                                </div>
                            </div>
                            <div class="level-item">
                                <span class="level-name">精通</span>
                                <div class="level-bar">
                                    <div class="level-fill"></div>
                                </div>
                            </div>
                            <div class="level-item">
                                <span class="level-name">大乘</span>
                                <div class="level-bar">
                                    <div class="level-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Section 3: Inner Energy Skills -->
            <section class="scroll-section" id="skills">
                <div class="section-header">
                    <h1 class="section-title">內功修為</h1>
                    <div class="section-seal">內</div>
                </div>
                
                <div class="skills-content">
                    <div class="skill-tree">
                        <h2>经脉脉络</h2>
                        <div class="meridian-diagram">
                            <div class="meridian-line"></div>
                            <div class="meridian-branch"></div>
                            <div class="meridian-branch"></div>
                            <div class="meridian-branch"></div>
                        </div>
                        <div class="qi-flow">
                            <div class="qi-particle"></div>
                            <div class="qi-particle"></div>
                            <div class="qi-particle"></div>
                        </div>
                    </div>
                    
                    <div class="skill-tree">
                        <h2>元素掌控</h2>
                        <div class="element-grid">
                            <div class="element-item fire">
                                <h3>火</h3>
                                <p>炎熱之力，焚萬物於灰燼</p>
                            </div>
                            <div class="element-item water">
                                <h3>水</h3>
                                <p>柔韌之勢，潤萬物而不爭</p>
                            </div>
                            <div class="element-item wood">
                                <h3>木</h3>
                                <p>生長之氣，破土而出的力量</p>
                            </div>
                            <div class="element-item metal">
                                <h3>金</h3>
                                <p>堅韌之質，斷金斷玉的鋒銳</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Decorative bottom border -->
            <div class="scroll-border bottom-border"></div>
            
            <!-- Scroll indicator -->
            <div class="scroll-indicator">
                <div class="scroll-hint"></div>
                <p>捲軸</p>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
