<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRAVERSE - Underground Network</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cyber-bg">
        <!-- Animated background elements -->
        <div class="bg-grid"></div>
        <div class="bg-corner"></div>
        
        <!-- Header -->
        <header class="main-header">
            <div class="header-content">
                <div class="logo-container">
                    <div class="logo-pulse"></div>
                    <h1 class="main-title">NETRAVERSE</h1>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">ONLINE</span>
                    </div>
                </div>
                
                <div class="user-profile">
                    <div class="avatar-placeholder" id="userAvatar">
                        <span class="avatar-initial">U</span>
                    </div>
                    <div class="user-info">
                        <span class="username" id="username">Ghost_0x7F</span>
                        <div class="reputation-holo">
                            <span class="rep-label">REPUTATION</span>
                            <span class="rep-score" id="reputationScore">8420</span>
                            <div class="rep-bar">
                                <div class="rep-fill" id="repBar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="header-divider"></div>
            
            <!-- Navigation -->
            <nav class="main-nav">
                <ul>
                    <li><a href="#" class="nav-active">FEED</a></li>
                    <li><a href="#">JOBS</a></li>
                    <li><a href="#">LEAKS</a></li>
                    <li><a href="#">MARKET</a></li>
                    <li><a href="#">TRACKER</a></li>
                </ul>
            </nav>
        </header>
        
        <div class="main-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3 class="sidebar-title">ACTIVE THREATS</h3>
                    <div class="threat-list" id="threatList">
                        <div class="threat-item high">
                            <span class="threat-icon">🚨</span>
                            <span class="threat-text">ICE WALL DETECTED</span>
                        </div>
                        <div class="threat-item medium">
                            <span class="threat-icon">⚠️</span>
                            <span class="threat-text">DATA MINING ACTIVE</span>
                        </div>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3 class="sidebar-title">QUICK ACCESS</h3>
                    <div class="quick-links">
                        <button class="quick-btn" id="newPostBtn">+ NEW POST</button>
                        <button class="quick-btn">🔒 ENCRYPT</button>
                        <button class="quick-btn">📡 TRACE</button>
                    </div>
                </div>
            </aside>
            
            <!-- Main Feed -->
            <main class="feed-container">
                <!-- Post Creation Form -->
                <div class="post-create-card">
                    <div class="post-avatar-placeholder">
                        <span class="avatar-initial">ME</span>
                    </div>
                    <textarea 
                        class="post-input" 
                        id="postInput" 
                        placeholder="Share encrypted intel with the network... 🔒"
                        maxlength="500"
                    ></textarea>
                    <div class="post-controls">
                        <div class="post-options">
                            <select class="threat-level-select" id="threatLevel">
                                <option value="low">Threat Level: LOW</option>
                                <option value="medium">Threat Level: MEDIUM</option>
                                <option value="high">Threat Level: HIGH</option>
                                <option value="critical">Threat Level: CRITICAL</option>
                            </select>
                            <select class="post-type-select">
                                <option value="job">Job Posting</option>
                                <option value="leak">Data Leak</option>
                                <option value="trade">Tech Trade</option>
                                <option value="intel">Corporate Intel</option>
                            </select>
                        </div>
                        <button class="post-btn" id="submitPost">TRANSMIT</button>
                    </div>
                    <div class="post-footer">
                        <span class="char-count" id="charCount">0/500</span>
                        <div class="encryption-indicator">
                            <span class="encrypt-dot"></span>
                            <span class="encrypt-dot"></span>
                            <span class="encrypt-dot"></span>
                            <span class="encrypt-dot"></span>
                            <span class="encrypt-label">ENCRYPTED</span>
                        </div>
                    </div>
                </div>
                
                <!-- Posts Container -->
                <div class="posts-container" id="postsContainer">
                    <!-- Posts will be dynamically added here -->
                </div>
            </main>
        </div>
    </div>
    
    <!-- Trace Detected Modal -->
    <div class="modal-overlay" id="traceModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">TRACE DETECTED</span>
                <button class="modal-close" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <div class="trace-animation">
                    <div class="trace-line"></div>
                    <div class="trace-line"></div>
                    <div class="trace-line"></div>
                </div>
                <p class="trace-text">Unauthorized access attempt detected. Your position has been triangulated.</p>
                <div class="trace-actions">
                    <button class="trace-btn trace-urgent">INITIATE COUNTERMEASURES</button>
                    <button class="trace-btn trace-cancel">ABORT TRACE</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
