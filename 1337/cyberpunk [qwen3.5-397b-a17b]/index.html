<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON_GHOST // PROTOCOL</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Importing a distinct monospace font for that terminal feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CRT Screen Effects Overlay -->
    <div id="crt-overlay">
        <div class="scanline"></div>
        <div class="vignette"></div>
        <div class="flicker"></div>
    </div>

    <!-- Background Matrix Rain -->
    <canvas id="matrix-bg"></canvas>

    <!-- Main Interface Container -->
    <main class="interface-container">
        
        <!-- Header Section -->
        <header class="cyber-header">
            <div class="logo-area">
                <h1 class="glitch-text" data-text="NEON_GHOST">NEON_GHOST</h1>
                <span class="status-badge">SYSTEM: <span class="blink">ONLINE</span></span>
            </div>
            <div class="header-data">
                <div class="data-row">IP: <span class="random-ip">192.168.X.X</span></div>
                <div class="data-row">ENC: <span class="cipher">AES-256</span></div>
                <div class="data-row">LOC: <span class="cipher">UNKNOWN</span></div>
            </div>
        </header>

        <!-- Navigation / Tabs -->
        <nav class="cyber-nav">
            <button class="nav-btn active" data-target="terminal">>_ TERMINAL</button>
            <button class="nav-btn" data-target="modules">[ MODULES ]</button>
            <button class="nav-btn" data-target="logs">// LOGS</button>
        </nav>

        <!-- Content Area -->
        <section class="content-grid">
            
            <!-- Left Column: Interactive Terminal -->
            <div class="panel terminal-panel">
                <div class="panel-header">
                    <span class="icon">></span> ROOT_ACCESS
                </div>
                <div class="terminal-output" id="terminal-output">
                    <div class="log-entry">Initializing connection...</div>
                    <div class="log-entry">Bypassing firewall layer 1...</div>
                    <div class="log-entry success">Access Granted.</div>
                    <div class="log-entry">Welcome, User.</div>
                </div>
                <div class="terminal-input-area">
                    <span class="prompt">root@neon-ghost:~$</span>
                    <input type="text" id="command-input" autocomplete="off" autofocus placeholder="Enter command...">
                </div>
            </div>

            <!-- Right Column: Data Visualization -->
            <div class="panel data-panel">
                <div class="panel-header">
                    <span class="icon">#</span> NETWORK_TRAFFIC
                </div>
                <div class="data-visualization">
                    <div class="bar-graph" id="traffic-graph">
                        <!-- Bars generated by JS -->
                    </div>
                    <div class="hex-dump" id="hex-dump">
                        <!-- Hex code generated by JS -->
                    </div>
                </div>
            </div>

        </section>

        <!-- Footer / Status Bar -->
        <footer class="cyber-footer">
            <div class="memory-leak">MEM: 64TB // CPU: <span id="cpu-load">12%</span></div>
            <div class="uptime">UPTIME: <span id="uptime">00:00:00</span></div>
        </footer>

    </main>

    <script src="scripts.js"></script>
</body>
</html>
